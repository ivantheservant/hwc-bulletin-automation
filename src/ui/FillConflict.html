<!--
  ui/FillConflict.html

  「處理填寫表衝突」對話框。逐項列出衝突，每項三選一：用格子表的值、
  用系統的值、暫不處理。

  ⚠️ 系統**不會**自作主張選任何一邊——兩邊都改過的時候，只有人知道
  哪一個才是對的。這個對話框存在的唯一理由就是把那個選擇交還給人。

  ⚠️ 本檔案的 HTML 註解內不可以出現字面上的樣板標籤符號（見
  docs/已知bug類型.md 的 bug class 第 1 項）——樣板引擎不理註解。
-->
<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body {
    font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
    font-size: 13px;
    margin: 0;
    padding: 12px 16px;
    color: #222;
  }
  h2 { font-size: 15px; margin: 0 0 0.4em; }
  .intro {
    background: #fdeceb;
    color: #8c231c;
    padding: 0.6em 0.9em;
    border-radius: 4px;
    margin-bottom: 0.8em;
    line-height: 1.6;
  }
  .toolbar { margin-bottom: 0.6em; display: flex; gap: 0.4em; align-items: center; flex-wrap: wrap; }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 0.35em 0.9em;
    border: 1px solid #c6c9cd;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button.small { font-size: 12px; padding: 0.2em 0.6em; }
  button:disabled { opacity: 0.5; cursor: default; }
  .table-wrap { max-height: 380px; overflow-y: auto; border: 1px solid #e1e3e7; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    border-bottom: 1px solid #eceef0;
    padding: 6px 8px;
    text-align: left;
    vertical-align: top;
  }
  th { background: #f6f7f8; position: sticky; top: 0; font-weight: bold; }
  td.value { max-width: 220px; word-break: break-word; }
  .snapshot { color: #888; font-size: 12px; }
  .choices { white-space: nowrap; }
  .choices label { margin-right: 0.7em; cursor: pointer; }
  .actions { margin-top: 0.8em; display: flex; justify-content: flex-end; gap: 0.5em; align-items: center; }
  #status { margin-right: auto; color: #555; }
</style>
</head>
<body>
  <h2>處理填寫表衝突 — <?= quarterId ?></h2>

  <div class="intro">
    以下欄位在<strong>季度填寫表</strong>與<strong>系統</strong>兩邊都被改過。
    系統目前<strong>一格都沒有改動</strong>，兩邊的值都保留住。<br>
    請逐項選擇要保留哪一邊。選「暫不處理」的格子完全不動，下次同步仍然會再問一次。
  </div>

  <div class="toolbar">
    <span>整批設定：</span>
    <button type="button" class="small" onclick="setAll('GRID')">全部用填寫表</button>
    <button type="button" class="small" onclick="setAll('SYSTEM')">全部用系統</button>
    <button type="button" class="small" onclick="setAll('SKIP')">全部暫不處理</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>主日</th>
          <th>欄位</th>
          <th>填寫表的值</th>
          <th>系統的值</th>
          <th>選擇</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="actions">
    <span id="status"></span>
    <button type="button" onclick="google.script.host.close()">取消</button>
    <button type="button" class="primary" id="confirmBtn" onclick="submitDecisions()">確定</button>
  </div>

<script>
  var QUARTER_ID = <?= JSON.stringify(quarterId) ?>;
  var CONFLICTS = <?!= conflictsJson ?>;

  /**
   * 用途：把文字轉成安全嵌入 HTML 的形式。
   * Args: text {*}
   * Returns: {string}
   */
  function esc(text) {
    return String(text === null || text === undefined ? '' : text)
      .split('&').join('&amp;')
      .split('<').join('&lt;')
      .split('>').join('&gt;')
      .split('"').join('&quot;');
  }

  /**
   * 用途：渲染衝突清單。預設一律是「暫不處理」——系統不可以替使用者
   *   預先選好任何一邊，否則撳「確定」就會不小心蓋掉東西。
   * Returns: {void}
   */
  function render() {
    var html = CONFLICTS.map(function (c, i) {
      return '<tr>'
        + '<td>' + esc(c.isoDate) + '</td>'
        + '<td>' + esc(c.label) + '<div class="snapshot">上次同步時：' + esc(c.snapshotValue || '（空白）') + '</div></td>'
        + '<td class="value">' + esc(c.gridValue || '（空白）') + '</td>'
        + '<td class="value">' + esc(c.systemValue || '（空白）') + '</td>'
        + '<td class="choices">'
        + '<label><input type="radio" name="c' + i + '" value="GRID"> 填寫表</label>'
        + '<label><input type="radio" name="c' + i + '" value="SYSTEM"> 系統</label>'
        + '<label><input type="radio" name="c' + i + '" value="SKIP" checked> 暫不處理</label>'
        + '</td>'
        + '</tr>';
    }).join('');
    document.getElementById('rows').innerHTML = html;
  }

  /**
   * 用途：整批設定全部項目的選擇。
   * Args: choice {string} 'GRID'／'SYSTEM'／'SKIP'
   * Returns: {void}
   */
  function setAll(choice) {
    CONFLICTS.forEach(function (c, i) {
      var radios = document.getElementsByName('c' + i);
      for (var j = 0; j < radios.length; j++) {
        radios[j].checked = (radios[j].value === choice);
      }
    });
  }

  /**
   * 用途：收集使用者的選擇並送去伺服器。
   * Returns: {void}
   */
  function submitDecisions() {
    var decisions = CONFLICTS.map(function (c, i) {
      var radios = document.getElementsByName('c' + i);
      var choice = 'SKIP';
      for (var j = 0; j < radios.length; j++) {
        if (radios[j].checked) choice = radios[j].value;
      }
      return { isoDate: c.isoDate, fieldKey: c.fieldKey, choice: choice };
    });

    document.getElementById('confirmBtn').disabled = true;
    document.getElementById('status').textContent = '處理中…';

    google.script.run
      .withSuccessHandler(function (resp) {
        if (!resp.ok) {
          document.getElementById('status').textContent = '失敗：' + resp.error.message;
          document.getElementById('confirmBtn').disabled = false;
          return;
        }
        var d = resp.data;
        document.getElementById('status').textContent =
          '已套用填寫表 ' + d.appliedGrid + ' 格、系統 ' + d.appliedSystem + ' 格，暫不處理 ' + d.skipped + ' 格。';
        setTimeout(function () { google.script.host.close(); }, 1500);
      })
      .withFailureHandler(function (err) {
        document.getElementById('status').textContent = '失敗：' + (err && err.message ? err.message : err);
        document.getElementById('confirmBtn').disabled = false;
      })
      .apiResolveFillConflicts(QUARTER_ID, decisions);
  }

  render();
</script>
</body>
</html>
