<!--
  ui/FillConflict.html

  「處理填寫表衝突」對話框。逐項列出衝突，每項三選一：用格子表的值、
  用系統的值、暫不處理。

  ⚠️ 系統**不會**自作主張選任何一邊——兩邊都改過的時候，只有人知道
  哪一個才是對的。這個對話框存在的唯一理由就是把那個選擇交還給人。

  ⚠️ 三個選項一律不預選，「確定」要等每一行都有明確選擇才能撳——
  「暫不處理」曾經是預設值，結果使用者以為自己選了別的，實際送出的
  全部都是「暫不處理」，系統完全沒有反應也沒有記錄，外表跟壞掉一樣
  （見 docs/已知bug類型.md「預設值等於什麼都不做」的介面）。

  ⚠️ 本檔案的 HTML 註解內不可以出現字面上的樣板標籤符號（見
  docs/已知bug類型.md 的 bug class 第 1 項）——樣板引擎不理註解。

  ⚠️ HtmlService 有兩種輸出標籤：**會轉義**（把值當 HTML 文字處理，
  用於直接顯示在畫面上的內容）與**不轉義**（原樣輸出）。凡是伺服器端
  已經呼叫過 JSON.stringify() 的值，一律要用**不轉義**那一種——用
  會轉義那一種等於把已經編碼好的 JSON 字串再轉義一次，雙引號會變成
  資料本身的一部分（實測出現過季度 ID 從 2027T4 變成帶引號的字串，
  導致所有比對都失配、卻不會拋任何錯誤）。詳見 docs/已知bug類型.md。
-->
<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body {
    font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    margin: 0;
    padding: 12px 16px;
    color: #222;
  }
  h2 { font-size: 17px; margin: 0 0 0.4em; }
  .intro {
    background: #fdeceb;
    color: #8c231c;
    padding: 0.6em 0.9em;
    border-radius: 4px;
    margin-bottom: 0.8em;
    line-height: 1.6;
  }
  .toolbar { margin-bottom: 0.6em; display: flex; gap: 0.4em; align-items: center; flex-wrap: wrap; }
  button {
    font-family: inherit;
    font-size: 15px;
    padding: 8px 16px;
    border: 1px solid #c6c9cd;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button.small { font-size: 14px; padding: 6px 12px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .table-wrap { max-height: 380px; overflow-y: auto; border: 1px solid #e1e3e7; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    border-bottom: 1px solid #eceef0;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
    font-size: 15px;
  }
  th { background: #f6f7f8; position: sticky; top: 0; font-weight: bold; }
  td.value { max-width: 220px; word-break: break-word; }
  .snapshot { color: #888; font-size: 14px; }
  .choices { white-space: nowrap; }
  .choices label { margin-right: 0.7em; cursor: pointer; }
  .summary-row { margin-top: 0.8em; font-size: 15px; }
  .hint { font-size: 14px; color: #555; margin-left: 0.6em; }
  .hint.ready { color: #1a7a34; font-weight: bold; }
  .actions { margin-top: 0.5em; display: flex; justify-content: flex-end; gap: 0.5em; align-items: center; }
  #status { margin-right: auto; color: #555; font-size: 15px; }
</style>
</head>
<body>
  <h2>處理填寫表衝突 — <?= quarterId ?></h2>

  <div class="intro">
    以下欄位在<strong>季度填寫表</strong>與<strong>系統</strong>兩邊都被改過。
    系統目前<strong>一格都沒有改動</strong>，兩邊的值都保留住。<br>
    請逐項選擇要保留哪一邊。選「暫不處理」的格子完全不動，下次同步仍然會再問一次。
  </div>

  <div class="toolbar">
    <span>整批設定：</span>
    <button type="button" class="small" id="setAllGridBtn" onclick="setAll('GRID')">全部用填寫表</button>
    <button type="button" class="small" id="setAllSystemBtn" onclick="setAll('SYSTEM')">全部用系統</button>
    <button type="button" class="small" id="setAllSkipBtn" onclick="setAll('SKIP')">全部暫不處理</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>主日</th>
          <th>欄位</th>
          <th>填寫表的值</th>
          <th>系統的值</th>
          <th>選擇</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="summary-row" id="summary"></div>

  <div class="actions">
    <span id="status"></span>
    <span class="hint" id="hint"></span>
    <button type="button" id="cancelBtn" onclick="google.script.host.close()">取消</button>
    <button type="button" class="primary" id="confirmBtn" disabled onclick="submitDecisions()">確定</button>
  </div>

<script>
  var QUARTER_ID = <?!= JSON.stringify(quarterId) ?>;
  var CONFLICTS = <?!= conflictsJson ?>;
  var CALL_TIMEOUT_SEC = <?!= JSON.stringify(callTimeoutSec) ?>;

  // BEGIN no-response-detect（G20：照搬自 ui/Script.html，兩處要一字不差；這個對話框是另一個獨立頁面，共用不到那一份。改這裏要同步改那裏；tests/writeaction.test.js 會核對）
  /**
   * 第二批測試修正 G13／G26：看來是連線／傳輸問題的錯誤訊息（見 isNoResponseFailure()）。
   * G26：訊息帶 HTTP 狀態碼時另外按狀態碼判斷（httpStatusOfFailure()），這裏不再認 HTTP 5xx。
   */
  var NO_RESPONSE_PATTERN = /NetworkError|time(d)?\s*out|Failed to fetch|Connection failure/i;

  /**
   * 用途：第二批測試修正 G26：取出失敗處理收到的錯誤的文字。
   * Args:
   *   err {*} 失敗處理收到的錯誤（字串、Error 或其他）。
   * Returns:
   *   {string} 沒有文字回空字串。
   * Raises:
   *   （無）
   */
  function failureRawText(err) {
    if (typeof err === 'string') return err;
    if (err && typeof err.message === 'string') return err.message;
    return '';
  }

  /**
   * 用途：第二批測試修正 G26：由錯誤訊息找出 HTTP 狀態碼（例如「NetworkError: Connection
   *   failure due to HTTP 502」的 502）。
   * Args:
   *   raw {string} 錯誤訊息。
   * Returns:
   *   {?number} 沒有狀態碼回 null。
   * Raises:
   *   （無）
   */
  function httpStatusOfFailure(raw) {
    var m = /HTTP\s*(\d{1,3})\b/i.exec(String(raw || ''));
    return m ? Number(m[1]) : null;
  }

  /**
   * 用途：第二批測試修正 G13：判斷一個失敗看來是不是連線／傳輸問題（伺服器沒有回應），
   *   而不是伺服器明確回傳的錯誤。
   *
   *   google.script.run 遇到 HTTP 502 之類的連線錯誤時，失敗處理收到的是瀏覽器那一邊
   *   的錯誤（例如「NetworkError: Connection failure due to HTTP 502」），伺服器卻可能
   *   仍在處理、之後亦可能已經完成。伺服器明確回傳的錯誤（例如 STALE、驗證失敗）經
   *   withApiResult_() 變成 ok:false，由成功處理接收，不會來到這裏；來到失敗處理而又
   *   有一句不屬於連線問題的訊息，是伺服器拋出的例外，照舊當作失敗。
   *
   *   G26：帶 HTTP 狀態碼的，只有 0 與 5xx 算沒有回應。401／403 是登入狀態有問題（登入過期、
   *   同一個瀏覽器登入了幾個 Google 帳戶），請求根本沒有到伺服器，見 isSignInFailure()；
   *   其他 4xx 亦沒有到伺服器，照舊當作失敗。
   * Args:
   *   err {*} 失敗處理收到的錯誤；callServer() 自己的逾時錯誤帶 noResponse:true。
   * Returns:
   *   {boolean} 帶 noResponse:true、沒有任何訊息、HTTP 狀態碼是 0 或 5xx，或者沒有狀態碼而
   *     訊息符合 NO_RESPONSE_PATTERN（NetworkError、timeout／timed out、Failed to fetch、
   *     Connection failure）就是 true。
   * Raises:
   *   （無）
   */
  function isNoResponseFailure(err) {
    if (err && err.noResponse === true) return true;
    var raw = failureRawText(err);
    if (raw.trim() === '') return true;
    var status = httpStatusOfFailure(raw);
    if (status !== null) return status === 0 || (status >= 500 && status <= 599);
    return NO_RESPONSE_PATTERN.test(raw);
  }

  /**
   * 用途：第二批測試修正 G26：這個失敗是不是 Google 登入狀態有問題（HTTP 401／403）。
   * Args:
   *   err {*} 失敗處理收到的錯誤。
   * Returns:
   *   {boolean}
   * Raises:
   *   （無）
   */
  function isSignInFailure(err) {
    if (err && err.noResponse === true) return false;
    var status = httpStatusOfFailure(failureRawText(err));
    return status === 401 || status === 403;
  }

  /**
   * 用途：第二批測試修正 G26：登入狀態有問題時給使用者看的一句。這個動作沒有送到伺服器，
   *   重新登入之後再做一次是安全的。
   * Args:
   *   err {*} 失敗處理收到的錯誤（取它的 HTTP 狀態碼）。
   * Returns:
   *   {string}
   * Raises:
   *   （無）
   */
  function describeSignInFailure(err) {
    var status = httpStatusOfFailure(failureRawText(err));
    return 'Google 登入狀態有問題（HTTP ' + (status || '401/403') + '），這個動作沒有送到伺服器。'
      + '請重新載入頁面；如果用了多個 Google 帳戶，請只登入教會帳戶再試。';
  }
  // END no-response-detect

  /**
   * 用途：這個對話框**唯一**的伺服器呼叫入口。
   *
   *   ⚠️ 跟 ui/Script.html 的 callServer() 是同一套設計，但這裏是一個
   *   獨立的 HTML 文件（modal dialog），共用不到那一份，所以另寫一份
   *   精簡版。兩件事一定要做：
   *     1. **一定有失敗處理**——沒有的話，後端拋錯時使用者只會見到
   *        「處理中…」永遠停在那裏（見 docs/已知bug類型.md 事故二十五）。
   *     2. **一定有逾時**——google.script.run 本身沒有逾時機制，伺服器
   *        卡住時成功與失敗兩個處理函式都不會被呼叫。
   * Args:
   *   fnName {string} 伺服器函式名稱。
   *   args {Array} 參數。
   *   onOk {function(*):void} 成功處理。
   *   onFail {function(string):void} 失敗處理，收到一句可以直接顯示的訊息。
   *   onNoResponse {function(string):void} 第二批測試修正 G20：連線錯誤或逾時（伺服器沒有
   *     回應，見 isNoResponseFailure()）時的處理，收到 describeNoResponse() 那一句。這個動作
   *     可能已經完成，呼叫方不可以自動重試，亦不可以叫人即時再按。
   * Returns:
   *   {void}
   */
  function callServer(fnName, args, onOk, onFail, onNoResponse) {
    var settled = false;
    var timer = null;

    function settle(handler) {
      return function (value) {
        if (settled) return;
        settled = true;
        if (timer) { clearTimeout(timer); timer = null; }
        handler(value);
      };
    }

    var seconds = parseInt(CALL_TIMEOUT_SEC, 10);
    if (!(seconds > 0)) seconds = 120;

    var fail = settle(function (err) {
      // G26：HTTP 401／403 是登入狀態有問題，請求沒有到伺服器（同 ui/Script.html）。
      if (isSignInFailure(err)) {
        onFail(describeSignInFailure(err));
        return;
      }
      // G20：連線錯誤（例如 HTTP 502）或逾時不等於沒有做，伺服器可能仍在處理、之後亦可能
      // 已經完成（同 ui/Script.html 的 G13）。不自動重試。
      if (isNoResponseFailure(err)) {
        onNoResponse(describeNoResponse(fnName, err && err.timedOut === true, seconds));
        return;
      }
      var raw = (err && err.message) ? String(err.message) : String(err);
      if (raw.length > 300) raw = raw.slice(0, 300) + '…（訊息過長，完整內容請看 ErrorLog）';
      onFail('呼叫伺服器失敗（' + fnName + '）：' + raw);
    });

    timer = setTimeout(function () {
      var timeoutErr = new Error('伺服器在 ' + seconds + ' 秒內沒有回應。');
      timeoutErr.noResponse = true;
      timeoutErr.timedOut = true;
      fail(timeoutErr);
    }, seconds * 1000);

    try {
      var runner = google.script.run
        .withSuccessHandler(settle(onOk))
        .withFailureHandler(fail);
      runner[fnName].apply(runner, args || []);
    } catch (err) {
      fail(err);
    }
  }

  /** 第二批測試修正 G20：核對時要開的選單（與 src/Menu.gs 的選單名稱一致）。 */
  var RESOLVE_MENU_PATH = '「週報系統 ▸ 季度填寫表 ▸ 處理填寫表衝突」';

  /**
   * 用途：第二批測試修正 G20：送出選擇之後伺服器沒有回應時的一句，按連線錯誤與逾時分。
   *
   *   核對的地方按這個動作的實際情況寫：選用填寫表的值會寫入 BulletinWeeks、選用系統的值
   *   會改格子表那一格，兩者都會更新 FillSnapshot，所以已經套用的格，再開一次這個對話框
   *   就不會再列出（全部處理完會講「目前沒有任何衝突」）；選了「暫不處理」的格本來就仍會
   *   列出。即時再按「確定」可能令伺服器同時處理兩次，所以叫人關閉視窗、等一會再開。
   * Args:
   *   fnName {string} 伺服器函式名稱。
   *   timedOut {boolean} true 是這個對話框自己的逾時；false 是連線錯誤。
   *   seconds {number} 逾時秒數（Config WEBAPP_CALL_TIMEOUT_SEC）。
   * Returns:
   *   {string}
   * Raises:
   *   （無）
   */
  function describeNoResponse(fnName, timedOut, seconds) {
    if (timedOut) {
      return '伺服器在 ' + seconds + ' 秒內沒有回應（' + fnName + '），伺服器可能仍在處理（最長約 6 分鐘）。'
        + '請按「取消」關閉這個視窗，等 6 分鐘後再按選單' + RESOLVE_MENU_PATH + '核對，不要即時再選一次；'
        + '亦可請 IT 看 Apps Script 的「執行項目」。';
    }
    return '伺服器沒有回應（' + fnName + '），這個動作可能已經完成。請按「取消」關閉這個視窗，再按選單'
      + RESOLVE_MENU_PATH + '核對：已經套用的格不會再列出（選了「暫不處理」的格仍會列出）。'
      + '如果仍然列出，伺服器可能仍在處理，請等 5 分鐘再開一次核對，不要即時再選一次。';
  }

  // 每一項目前的選擇；null 代表這一行還沒有人選過。
  var decisions = CONFLICTS.map(function () { return null; });

  // G20 補充：選擇已經送出（處理中、沒有回應、或者已經完成）。送出之後全部選項與「全部用…」
  // 按鈕停用，updateSummary() 不可以把「確定」重新啟用；只有伺服器明確回失敗（或者登入狀態
  // 有問題、請求沒有送到）才解除。resolveFillConflicts_() 沒有鎖，再送一次會再寫一次。
  var submitted = false;

  /**
   * 用途：第二批測試修正 G20 補充：停用或恢復全部選項（radio）與三粒「全部用…」按鈕。
   * Args:
   *   locked {boolean} true 停用；false 恢復。
   * Returns: {void}
   * Raises: （無）
   */
  function setChoicesLocked(locked) {
    ['setAllGridBtn', 'setAllSystemBtn', 'setAllSkipBtn'].forEach(function (id) {
      document.getElementById(id).disabled = locked;
    });
    CONFLICTS.forEach(function (c, i) {
      var radios = document.getElementsByName('c' + i);
      for (var j = 0; j < radios.length; j++) radios[j].disabled = locked;
    });
  }

  /**
   * 用途：把文字轉成安全嵌入 HTML 的形式。
   * Args: text {*}
   * Returns: {string}
   */
  function esc(text) {
    return String(text === null || text === undefined ? '' : text)
      .split('&').join('&amp;')
      .split('<').join('&lt;')
      .split('>').join('&gt;')
      .split('"').join('&quot;');
  }

  /**
   * 用途：渲染衝突清單。**一律不預選任何選項**——系統不可以替使用者
   *   預先選好任何一邊，否則撳「確定」就會不小心蓋掉東西（或者以為
   *   自己選了、其實送出的是預設值）。
   * Returns: {void}
   */
  function render() {
    var html = CONFLICTS.map(function (c, i) {
      return '<tr>'
        + '<td>' + esc(c.isoDate) + '</td>'
        + '<td>' + esc(c.label) + '<div class="snapshot">上次同步時：' + esc(c.snapshotValue || '（空白）') + '</div></td>'
        + '<td class="value">' + esc(c.gridValue || '（空白）') + '</td>'
        + '<td class="value">' + esc(c.systemValue || '（空白）') + '</td>'
        + '<td class="choices">'
        + '<label><input type="radio" name="c' + i + '" value="GRID" onchange="onChoiceChange(' + i + ', this.value)"> 填寫表</label>'
        + '<label><input type="radio" name="c' + i + '" value="SYSTEM" onchange="onChoiceChange(' + i + ', this.value)"> 系統</label>'
        + '<label><input type="radio" name="c' + i + '" value="SKIP" onchange="onChoiceChange(' + i + ', this.value)"> 暫不處理</label>'
        + '</td>'
        + '</tr>';
    }).join('');
    document.getElementById('rows').innerHTML = html;
    updateSummary();
  }

  /**
   * 用途：單一項目的選擇被使用者改變時更新內部狀態，並重新計算摘要
   *   與「確定」按鈕是否可撳。
   * Args:
   *   index {number} 這一項在 CONFLICTS 內的位置。
   *   choice {string} 'GRID'／'SYSTEM'／'SKIP'
   * Returns: {void}
   */
  function onChoiceChange(index, choice) {
    if (submitted) return;
    decisions[index] = choice;
    updateSummary();
  }

  /**
   * 用途：整批設定全部項目的選擇，並同步更新摘要（證明按鈕真的生效）。
   * Args: choice {string} 'GRID'／'SYSTEM'／'SKIP'
   * Returns: {void}
   */
  function setAll(choice) {
    if (submitted) return;
    CONFLICTS.forEach(function (c, i) {
      decisions[i] = choice;
      var radios = document.getElementsByName('c' + i);
      for (var j = 0; j < radios.length; j++) {
        radios[j].checked = (radios[j].value === choice);
      }
    });
    updateSummary();
  }

  /**
   * 用途：重新計算「將套用」摘要、「尚有 N 行未選擇」提示，以及「確定」
   *   按鈕是否可撳——每一行都必須有明確選擇（含「暫不處理」本身）才行。
   * Returns: {void}
   */
  function updateSummary() {
    var gridCount = 0, systemCount = 0, skipCount = 0, unselected = 0;
    decisions.forEach(function (d) {
      if (d === 'GRID') gridCount++;
      else if (d === 'SYSTEM') systemCount++;
      else if (d === 'SKIP') skipCount++;
      else unselected++;
    });

    document.getElementById('summary').textContent =
      '將套用：填寫表 ' + gridCount + ' 格　系統 ' + systemCount + ' 格　暫不處理 ' + skipCount + ' 格';

    var hint = document.getElementById('hint');
    var confirmBtn = document.getElementById('confirmBtn');
    // G20 補充：送出之後「確定」由送出那一段管理，這裏不可以重新啟用。
    if (submitted) return;
    if (unselected > 0) {
      hint.textContent = '尚有 ' + unselected + ' 行未選擇';
      hint.className = 'hint';
      confirmBtn.disabled = true;
    } else {
      hint.textContent = '可以確定';
      hint.className = 'hint ready';
      confirmBtn.disabled = false;
    }
  }

  /**
   * 用途：收集使用者的選擇並送去伺服器；成功之後**不自動關閉對話框**，
   *   把結果清楚顯示出來，改由使用者自己撳「關閉」——一定要讓使用者
   *   看到系統做了什麼才關閉視窗。
   * Returns: {void}
   */
  function submitDecisions() {
    if (submitted) return;
    var payload = CONFLICTS.map(function (c, i) {
      return { isoDate: c.isoDate, fieldKey: c.fieldKey, choice: decisions[i] };
    });

    // G20 補充：送出之後不可以再改選擇、不可以再送（見 submitted 的說明）。
    submitted = true;
    setChoicesLocked(true);
    document.getElementById('confirmBtn').disabled = true;
    document.getElementById('cancelBtn').disabled = true;
    document.getElementById('status').textContent = '處理中…';

    // 伺服器明確回失敗：沒有寫入，可以改選擇再送。
    function unlockAfterFailure() {
      submitted = false;
      setChoicesLocked(false);
      document.getElementById('confirmBtn').disabled = false;
      document.getElementById('cancelBtn').disabled = false;
    }

    callServer('apiResolveFillConflicts', [QUARTER_ID, payload], function (resp) {
        document.getElementById('cancelBtn').disabled = false;
        if (!resp.ok) {
          document.getElementById('status').textContent = '失敗：' + resp.error.message;
          unlockAfterFailure();
          return;
        }
        // ⚠️ 訊息文字一律用伺服器回傳的 message（buildFillConflictResultMessage_()
        // 算好的），前端不可以自己用 appliedGrid／appliedSystem 是不是都是
        // 0 去猜——那樣猜不出「skipped 也是 0」的情況，見
        // docs/已知bug類型.md 事故十五。
        var d = resp.data;
        document.getElementById('status').textContent = d.message;
        document.getElementById('hint').textContent = '';

        var confirmBtn = document.getElementById('confirmBtn');
        confirmBtn.textContent = '關閉';
        confirmBtn.disabled = false;
        confirmBtn.onclick = function () { google.script.host.close(); };
      }, function (message) {
        document.getElementById('status').textContent = message;
        unlockAfterFailure();
      }, function (message) {
        // G20：可能已經完成。「確定」維持停用（不可以即時再送一次），只可以按「取消」關閉，
        // 再開一次對話框核對。
        document.getElementById('status').textContent = message;
        document.getElementById('hint').textContent = '';
        document.getElementById('confirmBtn').disabled = true;
        document.getElementById('cancelBtn').disabled = false;
      });
  }

  render();
</script>
</body>
</html>
