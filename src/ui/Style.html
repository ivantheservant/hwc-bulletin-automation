<style>
  * { box-sizing: border-box; }

  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    margin: 0;
    background: #f4f5f7;
    color: #222;
    font-size: 14px;
  }

  h2 { font-size: 16px; margin: 0 0 0.8em 0; }
  h3 { font-size: 13px; margin: 1em 0 0.4em 0; color: #555; }

  #topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #ffffff;
    border-bottom: 1px solid #d7d9dd;
    padding: 0.6em 1em;
  }

  .topbar-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.8em;
  }

  .topbar-field select {
    margin-left: 0.3em;
  }

  .topbar-spacer { flex: 1; }

  .stat {
    padding: 0.2em 0.6em;
    border-radius: 4px;
    background: #eef0f3;
    font-size: 13px;
  }

  .stat-clickable { cursor: pointer; }
  .stat-clickable:hover { background: #dfe3e8; }

  .btn {
    border: 1px solid #c7cad0;
    background: #fff;
    padding: 0.45em 1em;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .btn:hover { background: #f0f1f3; }
  .btn-primary {
    background: #2f6feb;
    border-color: #2f6feb;
    color: #fff;
    font-weight: bold;
  }
  .btn-primary:hover { background: #2657c0; }
  .btn-secondary { color: #444; }
  .btn-small { padding: 0.2em 0.6em; font-size: 12px; }
  .btn-danger { color: #b3261e; border-color: #e2b4b0; }

  /* 停用中的按鈕／下拉要有明顯的視覺差異，讓人一眼看出「而家做緊嘢」。 */
  .btn:disabled, select:disabled {
    background: #eee;
    color: #999;
    border-color: #ddd;
    cursor: not-allowed;
  }
  .btn:disabled:hover { background: #eee; }

  .message-bar {
    margin-top: 0.5em;
    padding: 0.5em 0.8em;
    border-radius: 4px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6em;
  }
  .message-bar.info { background: #e6f0ff; color: #14418a; }
  .message-bar.error { background: #fdeceb; color: #8c231c; }
  .message-bar.success { background: #e8f6ec; color: #216032; }
  .message-bar-close {
    background: none;
    border: none;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    color: inherit;
    padding: 0 0.2em;
    flex-shrink: 0;
  }
  .hidden { display: none !important; }

  .schema-warning {
    background: #fff3cd;
    color: #7a5c00;
    border-bottom: 1px solid #f0d999;
    padding: 0.6em 1em;
    font-size: 13px;
  }

  /* 使用者測試期間的兩條保險。刻意放在整頁最頂端、常駐（不是收在
     「發佈及匯出」區塊裏面）——寄出這件事的風險不會因為使用者沒有
     捲到那個區塊而變小。 */
  .top-banner {
    padding: 0.55em 1em;
    font-size: 13.5px;
    font-weight: 600;
    text-align: center;
  }
  .top-banner-dryrun {
    background: #fff3e0;
    color: #8a5000;
    border-bottom: 1px solid #ffb74d;
  }
  .top-banner-test {
    background: #e3f2fd;
    color: #0d47a1;
    border-bottom: 1px solid #90caf9;
  }

  /* 頂部忙碌指示列：載入／儲存／重新讀取職事表期間顯示，含一條動畫進度條與文字。 */
  .busy-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #2f6feb;
    color: #fff;
    font-size: 12px;
    padding: 0.35em 1em;
    display: flex;
    align-items: center;
    gap: 0.7em;
  }
  .busy-bar-progress {
    position: relative;
    width: 90px;
    height: 4px;
    background: rgba(255, 255, 255, 0.35);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .busy-bar-progress::after {
    content: '';
    position: absolute;
    top: 0;
    left: -40%;
    width: 40%;
    height: 100%;
    background: #fff;
    border-radius: 2px;
    animation: busy-bar-slide 1.1s ease-in-out infinite;
  }
  @keyframes busy-bar-slide {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  .busy-bar-text { white-space: nowrap; }

  /* 忙碌時內容區蓋一層半透明遮罩，讓人一眼看到「而家做緊嘢，唔好撳」。
     只在 inFlight > 0（載入／儲存／重新讀取職事表）時加上，即時預覽
     自己的忙碌狀態不會觸發這個遮罩——見 Script.html 的 applyBusyState()。 */
  #mainContent.is-busy {
    pointer-events: none;
  }
  #mainContent.is-busy::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.55);
    z-index: 5;
  }

  .preview-busy {
    font-size: 11px;
    font-weight: normal;
    color: #888;
    margin-left: 0.5em;
  }

  .missing-panel {
    margin-top: 0.5em;
    background: #fff8e6;
    border: 1px solid #f0d999;
    border-radius: 4px;
    padding: 0.6em 1em;
    font-size: 13px;
    max-height: 220px;
    overflow-y: auto;
  }
  .missing-panel ul { margin: 0.3em 0 0 1.2em; padding: 0; }

  /* 有衝突時「衝突 N 項」用紅色，一眼看得出來跟「待填」不是同一回事。 */
  .stat-conflict { background: #fdeceb; color: #8c231c; font-weight: bold; }
  .conflict-panel {
    margin-top: 0.5em;
    background: #fdeceb;
    border: 1px solid #e2b4b0;
    border-radius: 4px;
    padding: 0.6em 1em;
    font-size: 13px;
    max-height: 260px;
    overflow-y: auto;
  }
  .conflict-panel ul { margin: 0.3em 0 0 1.2em; padding: 0; }

  #mainContent {
    position: relative;
    max-width: 960px;
    margin: 1em auto 3em auto;
    padding: 0 1em;
  }

  .panel {
    background: #fff;
    border: 1px solid #e1e3e7;
    border-radius: 6px;
    padding: 1em 1.2em;
    margin-bottom: 1em;
  }

  .readonly-panel { background: #fafafa; }
  .readonly-meta { font-size: 13px; color: #555; margin-bottom: 0.6em; }
  .readonly-columns { display: flex; gap: 2em; flex-wrap: wrap; }
  .readonly-col { flex: 1; min-width: 260px; }
  .readonly-table, .preview-table, .attendance-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .readonly-table td, .readonly-table th,
  .preview-table td, .preview-table th,
  .attendance-table td, .attendance-table th {
    border: 1px solid #e1e3e7;
    padding: 0.35em 0.5em;
    text-align: left;
    vertical-align: top;
  }
  .readonly-table .pending { color: #b3261e; font-style: italic; }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.7em 1em;
    margin-bottom: 0.6em;
  }
  .field-grid label {
    display: flex;
    flex-direction: column;
    font-size: 12px;
    color: #555;
    gap: 0.25em;
  }
  .field-wide { grid-column: 1 / -1; }

  input[type="text"], textarea, select {
    font-size: 13px;
    padding: 0.4em 0.5em;
    border: 1px solid #c7cad0;
    border-radius: 4px;
    font-family: inherit;
    width: 100%;
  }
  textarea { resize: vertical; }

  .attendance-table th { background: #f4f5f7; }
  .attendance-table input { width: 100%; }

  .hint { font-size: 12px; color: #777; margin: 0.4em 0 0 0; }

  .repeatable-list { display: flex; flex-direction: column; gap: 0.5em; margin-bottom: 0.6em; }
  .repeatable-row {
    display: flex;
    align-items: flex-start;
    gap: 0.5em;
    background: #fafbfc;
    border: 1px solid #e6e8eb;
    border-radius: 4px;
    padding: 0.5em;
  }
  .repeatable-row textarea, .repeatable-row input[type="text"] { flex: 1; }
  .repeatable-row-fields { flex: 1; display: grid; gap: 0.4em; }
  .repeatable-list-fellowship .repeatable-row-fields { grid-template-columns: 1.3fr 1fr 1fr 1.6fr; }
  .repeatable-list-finance .repeatable-row-fields { grid-template-columns: 1.4fr 1fr 1fr; }
  .repeatable-row-actions { display: flex; flex-direction: column; gap: 0.25em; }

  #prayerBlockHeadingInput { max-width: 260px; }

  /* ---- 可編輯的事奉框（第六輪） ---- */

  .duty-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1em;
    flex-wrap: wrap;
  }
  .duty-panel-head h2 { margin: 0; }

  .duty-list { display: flex; flex-direction: column; gap: 0.4em; margin-top: 0.8em; }

  .duty-row {
    display: flex;
    align-items: flex-start;
    gap: 0.6em;
    padding: 0.4em 0.5em;
    border: 1px solid #e6e8eb;
    border-radius: 4px;
    background: #fff;
    border-left: 4px solid transparent;
  }
  .duty-row-label {
    flex: 0 0 7em;
    font-size: 13px;
    color: #444;
    padding-top: 0.45em;
  }
  .duty-row-slots { flex: 1; display: flex; flex-direction: column; gap: 0.4em; }

  .duty-slot { display: flex; align-items: center; gap: 0.5em; flex-wrap: wrap; }
  .duty-slot input[type="text"] { flex: 1; min-width: 9em; }
  .duty-slot-roster { font-size: 11px; color: #999; white-space: nowrap; }

  /* 改動過的格子：左邊一條橙色直線 ＋ 一個「還原」小按鈕。 */
  .duty-row.is-overridden { border-left-color: #e08a1e; background: #fffaf2; }
  .duty-row.is-conflict { border-left-color: #b3261e; background: #fdeceb; }

  .duty-conflict-detail {
    font-size: 12px;
    color: #8c231c;
    background: #fff;
    border: 1px solid #e2b4b0;
    border-radius: 3px;
    padding: 0.3em 0.5em;
    line-height: 1.6;
  }

  /* ---- 「由職事表重新取數」對話框 ---- */

  .dialog-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1em;
  }
  .dialog {
    background: #fff;
    border-radius: 6px;
    max-width: 760px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    padding: 1em 1.2em;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
  }
  .dialog h3 { margin: 0 0 0.6em; font-size: 15px; color: #222; }
  .dialog-toolbar { display: flex; gap: 0.4em; margin-bottom: 0.5em; }
  .dialog-body { flex: 1; overflow-y: auto; }
  .dialog-body table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .dialog-body th, .dialog-body td {
    border: 1px solid #e1e3e7;
    padding: 0.35em 0.5em;
    text-align: left;
    vertical-align: top;
  }
  .dialog-body tr.is-conflict td { background: #fdeceb; }
  .dialog-footnote {
    font-size: 12px;
    color: #8c231c;
    background: #fdeceb;
    border-radius: 4px;
    padding: 0.5em 0.8em;
    margin: 0.7em 0 0;
  }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 0.5em; margin-top: 0.8em; }
  .dialog-empty { font-size: 13px; color: #555; padding: 1em 0; }

  /* ---- 內容表接管的七個區塊（R-011）---- */
  .content-sheet-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5em;
    font-size: 13px;
    color: #444;
    background: #eef3f8;
    border: 1px solid #d3dfea;
    border-radius: 4px;
    padding: 0.45em 0.7em;
    margin: 0 0 0.7em;
  }
  .content-sheet-bar .hint { margin: 0; }

  /* 唯讀輸入框：仍然看得到值，但一眼看得出不能修改。 */
  input.is-readonly,
  textarea.is-readonly {
    background: #f4f5f7;
    color: #444;
    cursor: not-allowed;
  }

  /* 唯讀清單（家事報告／代禱／團契／財政）。 */
  .repeatable-row.readonly-row { background: #fafbfc; }
  .repeatable-row.readonly-row .readonly-value {
    font-size: 13px;
    color: #333;
    padding: 0.35em 0.5em;
    border: 1px solid #e6e8ec;
    border-radius: 3px;
    background: #fff;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---- 發佈及匯出（R-002 至 R-008）---- */

  /* R-008：常駐狀態列。刻意用一條淺色橫幅、而不是頂部那一排 .stat——
     它不隨主日下拉改變，跟旁邊那幾格「這一期的統計」意思完全不同。 */
  .publish-status-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6em;
    font-size: 13px;
    color: #33475b;
    background: #f1f5f9;
    border-top: 1px solid #dde3ea;
    padding: 0.4em 1em;
  }
  .publish-status-bar .hint { margin: 0; }

  /* R-035：一個可見季度都沒有時的提示。刻意用黃色而不是紅色——
     「全部季度都封存咗」不是錯誤，只是要撳一下才見得返。 */
  .quarter-empty-hint {
    font-size: 13px;
    color: #7a5b00;
    background: #fff6d8;
    border: 1px solid #f0d98a;
    border-radius: 4px;
    padding: 0.25em 0.6em;
  }

  /* R-036：職事表未有資料的黃色橫幅。用黃色而不是紅色——職事表未出
     不是錯誤，是「未到時候」，用紅色會令幹事以為系統壞了。 */
  .roster-gap-bar {
    font-size: 13px;
    color: #7a5b00;
    background: #fff6d8;
    border-top: 1px solid #f0d98a;
    padding: 0.5em 1em;
  }

  /* 三步驟。刻意用編號清單而不是一段提示文字——「先下載 Word、核對、
     另存 PDF」是有次序的動作，寫成一段話讀的人會跳著看。 */
  .publish-steps {
    margin: 0.4em 0 0.8em;
    padding-left: 1.4em;
    font-size: 13px;
    color: #444;
    line-height: 1.9;
  }

  .publish-panel .publish-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6em;
    margin: 0.6em 0;
  }
  .publish-block {
    border: 1px solid #e2e6ea;
    border-radius: 4px;
    padding: 0.6em 0.8em;
    margin: 0.7em 0;
  }
  .publish-check { font-weight: 600; display: inline-flex; align-items: center; gap: 0.4em; }
  .publish-sub { margin: 0.5em 0 0 1.6em; }
  .publish-sub.is-disabled { opacity: 0.45; }
  .publish-groups { display: flex; flex-wrap: wrap; gap: 0.9em; margin-bottom: 0.5em; }
  .publish-groups label { display: inline-flex; align-items: center; gap: 0.3em; font-size: 13px; }
  .publish-custom { display: inline-flex; align-items: center; gap: 0.4em; font-size: 13px; }
  .publish-custom input { min-width: 20em; }

  .publish-result {
    background: #f6f8fa;
    border: 1px solid #e2e6ea;
    border-radius: 4px;
    padding: 0.6em 0.8em;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .publish-result.is-error { background: #fdecea; border-color: #f5c6c2; color: #86251c; }

  .publish-confirm-check {
    display: flex;
    align-items: flex-start;
    gap: 0.45em;
    font-size: 13px;
    margin: 0.8em 0 0;
    padding: 0.5em 0.7em;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 4px;
  }
  /* ---- R-038：季度作業 ---- */
  .quarter-ops-panel h2 { margin: 0; }
  .quarter-ops-toggle {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
    text-align: left;
  }
  .quarter-ops-caret { display: inline-block; width: 1em; }
  .quarter-ops-body { margin-top: 0.8em; }
  .quarter-ops-group { font-size: 14px; margin: 1em 0 0.5em; }
  .quarter-ops-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6em; }
  .quarter-ops-link-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6em; margin-top: 0.6em; }

  /*
    ⚠️ DRY_RUN=TRUE 用黃色（要留意，但不是錯），FALSE 用紅色（會真的寄出去）。
    兩個都不是綠色——「會真的寄」跟「不會真的寄」都不是「一切正常」，
    兩者都是幹事撳之前必須看清楚的一件事。
  */
  .quarter-ops-dryrun { font-size: 12px; padding: 0.15em 0.5em; border-radius: 3px; }
  .quarter-ops-dryrun.is-dryrun { background: #fff8e1; border: 1px solid #ffe082; color: #7a5b00; }
  .quarter-ops-dryrun.is-live { background: #fdecea; border: 1px solid #f5c6c2; color: #86251c; }

  .quarter-ops-report {
    margin-top: 0.9em;
    border: 1px solid #e2e6ea;
    border-radius: 4px;
    background: #f6f8fa;
  }
  .quarter-ops-report-head {
    display: flex;
    align-items: center;
    gap: 0.7em;
    padding: 0.5em 0.8em;
    border-bottom: 1px solid #e2e6ea;
  }
  .quarter-ops-report-head .btn { margin-left: auto; }
  /*
    ⚠️ 一定要可以捲動而且有上限：報告動輒過百行，不設上限的話整頁會被
    推長到捲極都捲唔完，下面的「發佈及匯出」被推到看不見。
  */
  .quarter-ops-report-body {
    margin: 0;
    padding: 0.7em 0.9em;
    max-height: 22em;
    overflow: auto;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .quarter-ops-message {
    margin-top: 0.7em;
    padding: 0.55em 0.8em;
    border-radius: 4px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .quarter-ops-message.is-error { background: #fdecea; border: 1px solid #f5c6c2; color: #86251c; }
  .quarter-ops-message.is-info { background: #eef4fb; border: 1px solid #cbdcf0; color: #24486e; }
  .quarter-ops-message.is-success { background: #eaf6ec; border: 1px solid #c3e3ca; color: #1e5b2a; }
</style>
