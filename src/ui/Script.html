<script>
(function () {
  'use strict';

  // 目前這個主日的完整狀態。刻意不用 localStorage／sessionStorage——
  // 重新整理頁面就是要重新從伺服器讀最新資料，不應該有任何本地殘留狀態。
  //
  // `loaded`：只有 apiLoadWeek() 成功過才是 true。載入失敗時表單全部
  // 空白，若這時候仍然可以儲存，就會把工作表上既有的內容全部覆蓋成
  // 空白——所以「儲存」按鈕的可用狀態完全跟著這個旗標走，見 applyBusyState()。
  //
  // `inFlight`：目前進行中的「會令使用者等待、要停用介面」的請求數
  // （載入、儲存、重新讀取職事表）。**刻意是計數器，不是 boolean**——
  // 理論上同一時間可能有一個以上的這類請求排隊，用 boolean 會在其中
  // 一個結束時把整個忙碌狀態誤關掉。
  //
  // `previewInFlight`：即時預覽（apiPreviewProgram）自己的忙碌計數器，
  // 刻意跟 `inFlight` 分開——預覽每次打字都會觸發，不可以停用整個介面
  // （尤其不可以停用輸入框本身，否則使用者會打不了字），只顯示一個
  // 小小的「更新中」提示。
  var state = {
    isoDate: null,
    lastSavedAt: null,
    loaded: false,
    inFlight: 0,
    previewInFlight: 0,
    week: {},
    lists: { announcements: [], prayers: [], fellowships: [], finance: [] },
    // 第六輪：事奉框每一格目前的值，鍵是「崗位#位次」。儲存時整批送回
    // 伺服器，由 computeDutyOverridePlan_() 決定哪幾格真的需要寫
    // DutyOverride（與職事表現值相同的格子不會產生記錄）。
    dutyEdits: {},
    // 「由職事表重新取數」對話框目前列出的候選項目。
    fetchCandidates: [],
    options: { programTemplateIds: [], recitationOptions: [], prayerBlockHeadingOptions: [], cantoneseSubColumnLabel: '主堂' }
  };

  /**
   * 成功／資訊訊息至少顯示的時間（毫秒）。**不可以更短**——這類訊息
   * 通常是使用者剛完成一個動作（儲存、重新讀取職事表）之後最想確認
   * 「到底有沒有生效」的回饋。事故經過：`onSaveSuccess()` 顯示完訊息
   * 後緊接著呼叫 `loadWeek()`，而 `loadWeek()` 開頭會呼叫
   * `hideMessage()`——訊息顯示之後幾十毫秒就被自己清掉，使用者的視線
   * 根本來不及從按鈕移到訊息橫幅，等於完全看不見（見
   * docs/已知bug類型.md「成功訊息被緊接的重新載入清走」那一則事故）。
   * 修法是 `loadWeek()` 加 `options.keepMessage`，但即使有這個開關，
   * 訊息本身還是要停留夠久，人才看得清楚，所以 5 秒是下限，不是隨便
   * 抓的數字。
   */
  var MESSAGE_MIN_VISIBLE_MS = 5000;

  var LIST_DEFS = {
    announcements: {
      containerId: 'announcementsList',
      fields: [{ key: 'TEXT', type: 'textarea', placeholder: '家事報告內容' }]
    },
    prayers: {
      containerId: 'prayersList',
      fields: [{ key: 'TEXT', type: 'textarea', placeholder: '代禱事項內容' }]
    },
    fellowships: {
      containerId: 'fellowshipsList',
      fields: [
        { key: 'FELLOWSHIP_NAME', type: 'text', placeholder: '團契' },
        { key: 'MEETING_DATE', type: 'text', placeholder: '日期' },
        { key: 'MEETING_TIME', type: 'text', placeholder: '時間' },
        { key: 'CONTENT', type: 'text', placeholder: '週會內容' }
      ]
    },
    finance: {
      containerId: 'financeList',
      fields: [
        { key: 'ROW_LABEL', type: 'text', placeholder: '項目' },
        { key: 'COL_SPECIAL_OVERSEAS', type: 'text', placeholder: '特殊海外奉獻' },
        { key: 'COL_HARDSHIP', type: 'text', placeholder: '慈惠' }
      ]
    }
  };

  var previewTimer = null;
  var messageAutoHideTimer = null;

  // =====================================================================
  // 小工具
  // =====================================================================

  function escapeHtml(text) {
    return String(text === null || text === undefined ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function el(tag, className) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    return node;
  }

  /**
   * 顯示頂部訊息橫幅。`type` 是 `'success'`／`'info'`／`'error'` 其中一個
   * （對應 Style.html 的 `.message-bar.xxx`）。
   *
   * 錯誤橫幅**不會自動消失**，右邊會加一個「×」讓使用者自己關掉——
   * 錯誤如果自己淡出，使用者可能根本來不及看清楚發生了什麼事就消失了。
   * 成功／資訊橫幅 5 秒後自動淡出。
   */
  function showMessage(type, text) {
    var bar = document.getElementById('messageBar');
    bar.className = 'message-bar ' + type;
    bar.innerHTML = '';

    var textSpan = el('span');
    textSpan.textContent = text;
    bar.appendChild(textSpan);

    if (type === 'error') {
      var closeBtn = el('button', 'message-bar-close');
      closeBtn.type = 'button';
      closeBtn.textContent = '×';
      closeBtn.setAttribute('aria-label', '關閉');
      closeBtn.addEventListener('click', hideMessage);
      bar.appendChild(closeBtn);
    }

    bar.classList.remove('hidden');

    if (messageAutoHideTimer) { clearTimeout(messageAutoHideTimer); messageAutoHideTimer = null; }
    if (type !== 'error') {
      messageAutoHideTimer = setTimeout(hideMessage, MESSAGE_MIN_VISIBLE_MS);
    }
  }

  function hideMessage() {
    document.getElementById('messageBar').classList.add('hidden');
    if (messageAutoHideTimer) { clearTimeout(messageAutoHideTimer); messageAutoHideTimer = null; }
  }

  /** `lastSavedAt` 一律是伺服器 canonicalSaveToken_() 正規化過的字串，前端直接顯示即可，不需要自己解析。 */
  function formatTimestamp(v) {
    return v ? v : '（尚未儲存）';
  }

  /** `apiLoadWeek()` 成功才可以撳「儲存」——理由見 state.loaded 的註解。實際的按鈕停用邏輯統一在 applyBusyState()。 */
  function setLoaded(isLoaded) {
    state.loaded = isLoaded;
    applyBusyState();
  }

  /**
   * 用途：全域忙碌狀態的**唯一**顯示邏輯。`state.inFlight`／
   *   `state.previewInFlight` 兩個計數器有變動之後，一律呼叫這個函式
   *   套用到畫面，不要在別的地方另外直接操作 disabled／樣式——避免
   *   「兩個地方各自決定同一顆按鈕能不能撳」這種容易兜不攏的寫法。
   *
   *   | 狀態 | 表現 |
   *   |---|---|
   *   | `inFlight > 0` | 頂部忙碌指示列、主日下拉／「儲存」／「重新讀取職事表」全部停用、內容區加半透明遮罩 |
   *   | `inFlight === 0` 且 `loaded === false` | 只停用「儲存」，其餘可用 |
   *   | `inFlight === 0` 且 `loaded === true` | 全部可用 |
   *
   *   即時預覽的忙碌（`previewInFlight`）完全不影響上面這些——只控制
   *   一個小提示的顯示與否，輸入框永遠不會因為預覽而被停用。
   * Returns:
   *   {void}
   */
  function applyBusyState() {
    var busy = state.inFlight > 0;

    var busyBar = document.getElementById('busyBar');
    if (busy) busyBar.classList.remove('hidden'); else busyBar.classList.add('hidden');

    var mainContent = document.getElementById('mainContent');
    if (busy) mainContent.classList.add('is-busy'); else mainContent.classList.remove('is-busy');

    document.getElementById('weekSelect').disabled = busy;
    document.getElementById('reloadRosterBtn').disabled = busy;
    document.getElementById('fetchFromRosterBtn').disabled = busy || !state.loaded;
    document.getElementById('saveBtn').disabled = busy || !state.loaded;

    var previewIndicator = document.getElementById('previewBusyIndicator');
    if (state.previewInFlight > 0) previewIndicator.classList.remove('hidden');
    else previewIndicator.classList.add('hidden');
  }

  function setBusyText(text) {
    document.getElementById('busyBarText').textContent = text;
  }

  /**
   * 用途：發出一個「會停用整個介面」的 `google.script.run` 請求前呼叫。
   *   跟 `endRequest()` 成對——每一次 `beginRequest()` 都必須有對應的
   *   `endRequest()`，放在該次請求的 `withSuccessHandler`／
   *   `withFailureHandler` 處理函式**最前面**，避免任何提早 `return`
   *   的分支漏減，導致 `inFlight` 卡住、介面永遠停用。
   * Args:
   *   text {string} 忙碌指示列要顯示的文字（例如「載入中…」）。
   * Returns:
   *   {void}
   */
  function beginRequest(text) {
    state.inFlight++;
    setBusyText(text);
    applyBusyState();
  }

  function endRequest() {
    state.inFlight = Math.max(0, state.inFlight - 1);
    applyBusyState();
  }

  /** 即時預覽自己的忙碌計數器，跟 beginRequest()／endRequest() 分開，理由見 state 的註解。 */
  function beginPreview() {
    state.previewInFlight++;
    applyBusyState();
  }

  function endPreview() {
    state.previewInFlight = Math.max(0, state.previewInFlight - 1);
    applyBusyState();
  }

  function onApiFailure(err) {
    endRequest();
    setSaveButtonText('儲存');
    var message = '呼叫伺服器失敗：' + (err && err.message ? err.message : String(err));
    showMessage('error', message);
    reportClientError_(message, err && err.stack ? String(err.stack).split('\n').slice(0, 5).join('\n') : '', 'onApiFailure');
  }

  /**
   * 用途：把前端捕捉到的錯誤回報到伺服器 ErrorLog（SOURCE='CLIENT'）。
   *   刻意不等回應、也不處理失敗——回報錯誤這件事本身失敗了，不應該再
   *   跳一個新的錯誤橫幅打斷使用者。`detail` 只能放堆疊摘要這類技術性
   *   內容，不可以夾帶電郵或表單完整內容。
   * Args:
   *   message {string}　detail {string}　functionName {string}
   * Returns:
   *   {void}
   */
  function reportClientError_(message, detail, functionName) {
    try {
      google.script.run
        .withSuccessHandler(function () {})
        .withFailureHandler(function () {})
        .apiLogClientError({ message: message, detail: detail, functionName: functionName });
    } catch (e) {
      // 連呼叫 google.script.run 本身都失敗：吞掉，不要因為回報錯誤這件事再產生新的例外。
    }
  }

  // =====================================================================
  // 唯讀區塊
  // =====================================================================

  function renderReadOnly(readOnly) {
    var meta = document.getElementById('rosterMeta');
    var parts = [
      '特別主日：' + escapeHtml(readOnly.special ? readOnly.special.title : '（無）'),
      '程序範本：' + escapeHtml(readOnly.templateId || '（無）'),
      '職事表版本：' + escapeHtml(readOnly.rosterVersionUsed === null || readOnly.rosterVersionUsed === undefined
        ? '（尚未生成）' : String(readOnly.rosterVersionUsed))
    ];
    meta.innerHTML = parts.join('　');
    if (!readOnly.rosterIsOfficial) {
      var warn = el('strong');
      warn.style.color = '#b3261e';
      warn.textContent = '　⚠ 職事表尚未正式發出，內容可能仍會變動';
      meta.appendChild(warn);
    }

    renderEditableDutyBox(readOnly.dutyBoxPage1);
    renderDutyTable('nextWeekDutyBody', readOnly.nextWeekDuty);
    applyBaptismPanelVisibility(readOnly.isBaptismSunday === true);
  }

  /**
   * 用途：按這一週是不是浸禮合堂，決定要不要顯示副框那一段。
   *
   *   ⚠️ **只是隱藏，不是停用、更不是清空**：面板內六個輸入框仍然在 DOM
   *   內，仍然會被 collectWeekFields() 讀出來、原樣送回伺服器存返。如果
   *   隱藏時順手把值清走，幹事把某一週的範本由浸禮改成平常再改返，
   *   原本填好的受浸名單就會靜靜不見。
   *
   *   判斷用的是伺服器算好的 `readOnly.isBaptismSunday`，不是前端自己拿
   *   `templateId` 去跟字面值比——範本 ID 只准有一個真相來源。
   * Args:
   *   isBaptism {boolean}
   * Returns:
   *   （無）
   */
  function applyBaptismPanelVisibility(isBaptism) {
    var panel = document.getElementById('baptismPanel');
    if (!panel) return;
    panel.classList.toggle('hidden', !isBaptism);
  }

  /**
   * 用途：把第 1 頁事奉框渲染成**可編輯**的一格格輸入框（第六輪）。
   *
   *   每個崗位每個位次一個輸入框，預設值是 `slot.bulletinName`——那是
   *   **未套尊稱的原始姓名**，不是版面上印的「陳大文弟兄」。用原始姓名
   *   才能安全來回：輸入框的內容會原樣存進 `DutyOverride.OVERRIDE_NAME`，
   *   如果放的是已加尊稱的顯示文字，幹事什麼都不改直接儲存，就會產生
   *   一個「陳大文弟兄」的覆寫，之後再也對不上 PersonDisplay 的姓名，
   *   尊稱反而不見了。
   *
   *   改動過的格子（`hasOverride`）左邊有一條橙色直線與「還原」按鈕；
   *   `CONFLICT` 的格子用紅底，並列出三個值（覆寫當時的職事表值、
   *   職事表現值、你的覆寫值）。
   * Args:
   *   rows {Object[]} `apiLoadWeek()` 回傳的 `readOnly.dutyBoxPage1`。
   * Returns:
   *   {void}
   */
  function renderEditableDutyBox(rows) {
    var container = document.getElementById('dutyBoxPage1Body');
    container.innerHTML = '';
    state.dutyEdits = {};

    if (!rows || rows.length === 0) {
      var empty = el('div', 'hint');
      empty.textContent = '（沒有事奉資料）';
      container.appendChild(empty);
      return;
    }

    rows.forEach(function (row) {
      var rowEl = el('div', 'duty-row');
      if (row.status === 'CONFLICT') rowEl.classList.add('is-conflict');
      else if (row.hasOverride) rowEl.classList.add('is-overridden');

      var labelEl = el('div', 'duty-row-label');
      labelEl.textContent = row.label;
      rowEl.appendChild(labelEl);

      var slotsWrap = el('div', 'duty-row-slots');
      (row.slots || []).forEach(function (slot) {
        slotsWrap.appendChild(buildDutySlotRow(slot, rowEl));
      });
      rowEl.appendChild(slotsWrap);

      container.appendChild(rowEl);
    });
  }

  /**
   * 用途：渲染事奉框內的一格（一個崗位的一個位次）。
   * Args:
   *   slot {Object} `buildDutyBoxSlotDetail_()` 的輸出。
   *   rowEl {HTMLElement} 整行的容器，用來即時加／減橙色標示。
   * Returns:
   *   {HTMLElement}
   */
  function buildDutySlotRow(slot, rowEl) {
    var wrap = el('div', 'duty-slot');
    var key = slot.postId + '#' + slot.slotIndex;
    state.dutyEdits[key] = { postId: slot.postId, slotIndex: slot.slotIndex, name: slot.bulletinName };

    var input = el('input');
    input.type = 'text';
    input.value = slot.bulletinName || '';
    input.placeholder = slot.rosterName ? '' : '（職事表未排定）';

    var restoreBtn = makeSmallButton('還原', function () {
      input.value = slot.rosterName || '';
      state.dutyEdits[key].name = input.value;
      refreshSlotMarkers();
    });
    restoreBtn.title = '把這一格改回職事表現時的值';

    function refreshSlotMarkers() {
      var changed = String(input.value || '').trim() !== String(slot.rosterName || '').trim();
      restoreBtn.classList.toggle('hidden', !changed);
      // 整行只要有任何一格跟職事表不同就加橙色標示。CONFLICT 的紅底
      // 由伺服器算好，前端不會即時改變它——衝突與否要重新載入才知道。
      if (!rowEl.classList.contains('is-conflict')) {
        var anyChanged = Array.prototype.some.call(rowEl.querySelectorAll('input[type="text"]'), function (other) {
          return other.dataset.rosterName !== undefined
            && String(other.value || '').trim() !== String(other.dataset.rosterName || '').trim();
        });
        rowEl.classList.toggle('is-overridden', anyChanged);
      }
    }

    input.dataset.rosterName = slot.rosterName || '';
    input.addEventListener('input', function () {
      state.dutyEdits[key].name = input.value;
      refreshSlotMarkers();
    });

    wrap.appendChild(input);

    var rosterHint = el('span', 'duty-slot-roster');
    rosterHint.textContent = '職事表：' + (slot.rosterName || '（未排定）');
    wrap.appendChild(rosterHint);

    wrap.appendChild(restoreBtn);
    restoreBtn.classList.toggle('hidden', !slot.hasOverride);

    if (slot.status === 'CONFLICT') {
      var detail = el('div', 'duty-conflict-detail');
      detail.textContent = '⚠ 職事表在你覆寫之後又改過　'
        + '覆寫當時職事表＝' + (slot.rosterValueAtOverride || '（空白）')
        + '　職事表現值＝' + (slot.rosterName || '（空白）')
        + '　你的覆寫值＝' + (slot.bulletinName || '（空白）');
      wrap.appendChild(detail);
    }

    return wrap;
  }

  function renderDutyTable(tbodyId, rows) {
    var tbody = document.getElementById(tbodyId);
    tbody.innerHTML = '';
    (rows || []).forEach(function (r) {
      var tr = el('tr');
      var tdLabel = el('td');
      tdLabel.textContent = r.label;
      var tdText = el('td', r.isPending ? 'pending' : '');
      tdText.textContent = r.text || '（待填）';
      tr.appendChild(tdLabel);
      tr.appendChild(tdText);
      tbody.appendChild(tr);
    });
    if (!rows || rows.length === 0) {
      var tr = el('tr');
      var td = el('td');
      td.colSpan = 2;
      td.textContent = '（沒有資料）';
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
  }

  function renderProgramPreview(rows) {
    var tbody = document.getElementById('programPreviewBody');
    tbody.innerHTML = '';
    (rows || []).forEach(function (r) {
      var tr = el('tr');
      [r.itemName, r.content, r.fullWidth ? '' : r.posture].forEach(function (text) {
        var td = el('td');
        td.textContent = text || '';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  // =====================================================================
  // 可編輯欄位
  // =====================================================================

  function applyWeekFieldsToForm() {
    var fields = document.querySelectorAll('[data-field]');
    for (var i = 0; i < fields.length; i++) {
      var fieldEl = fields[i];
      var key = fieldEl.getAttribute('data-field');
      fieldEl.value = state.week[key] || '';
    }
  }

  function collectWeekFieldsFromForm() {
    var week = {};
    var fields = document.querySelectorAll('[data-field]');
    for (var i = 0; i < fields.length; i++) {
      var fieldEl = fields[i];
      week[fieldEl.getAttribute('data-field')] = fieldEl.value;
    }
    return week;
  }

  function populateSelectOptions(selectEl, options, labelFn) {
    selectEl.innerHTML = '';
    (options || []).forEach(function (opt) {
      var o = el('option');
      o.value = opt;
      o.textContent = labelFn ? labelFn(opt) : opt;
      selectEl.appendChild(o);
    });
  }

  function populatePrayerHeadingOptions(options) {
    var dl = document.getElementById('prayerBlockHeadingOptions');
    dl.innerHTML = '';
    (options || []).forEach(function (v) {
      var o = el('option');
      o.value = v;
      dl.appendChild(o);
    });
  }

  // =====================================================================
  // 可增刪清單（家事報告／代禱／團契／財政）
  // =====================================================================

  function renderList(type) {
    var def = LIST_DEFS[type];
    var container = document.getElementById(def.containerId);
    container.innerHTML = '';
    state.lists[type].forEach(function (item, idx) {
      container.appendChild(buildListRow(type, def, item, idx));
    });
    if (state.lists[type].length === 0) {
      var empty = el('div', 'hint');
      empty.textContent = '（目前沒有任何一項，撳下面的按鈕新增）';
      container.appendChild(empty);
    }
  }

  function buildListRow(type, def, item, idx) {
    var row = el('div', 'repeatable-row');

    var fieldsWrap = el('div', 'repeatable-row-fields');
    def.fields.forEach(function (f) {
      var inputEl = el(f.type === 'textarea' ? 'textarea' : 'input');
      if (f.type !== 'textarea') inputEl.type = 'text';
      if (f.type === 'textarea') inputEl.rows = 2;
      inputEl.placeholder = f.placeholder;
      inputEl.value = item[f.key] || '';
      inputEl.addEventListener('input', function () { item[f.key] = inputEl.value; });
      fieldsWrap.appendChild(inputEl);
    });
    row.appendChild(fieldsWrap);

    var actions = el('div', 'repeatable-row-actions');
    actions.appendChild(makeSmallButton('↑ 上移', function () { moveListItem(type, idx, -1); }));
    actions.appendChild(makeSmallButton('↓ 下移', function () { moveListItem(type, idx, 1); }));
    actions.appendChild(makeSmallButton('刪除', function () { removeListItem(type, idx); }, true));
    row.appendChild(actions);

    return row;
  }

  function makeSmallButton(label, onClick, danger) {
    var btn = el('button', 'btn btn-small' + (danger ? ' btn-danger' : ''));
    btn.type = 'button';
    btn.textContent = label;
    btn.addEventListener('click', onClick);
    return btn;
  }

  function moveListItem(type, idx, delta) {
    var arr = state.lists[type];
    var target = idx + delta;
    if (target < 0 || target >= arr.length) return;
    var tmp = arr[idx];
    arr[idx] = arr[target];
    arr[target] = tmp;
    renderList(type);
  }

  function removeListItem(type, idx) {
    state.lists[type].splice(idx, 1);
    renderList(type);
  }

  function addListItem(type) {
    var def = LIST_DEFS[type];
    var blank = { seqNo: null };
    def.fields.forEach(function (f) { blank[f.key] = ''; });
    state.lists[type].push(blank);
    renderList(type);
  }

  function renderAllLists() {
    Object.keys(LIST_DEFS).forEach(function (type) { renderList(type); });
  }

  // =====================================================================
  // 頂部統計與待填清單
  // =====================================================================

  function renderStats(missing, warnings, lastSavedAt) {
    document.getElementById('statMissing').textContent = '待填 ' + (missing ? missing.length : 0) + ' 項';
    document.getElementById('statWarnings').textContent = '警告 ' + (warnings ? warnings.length : 0) + ' 項';
    document.getElementById('statSaved').textContent = '最後儲存時間：' + formatTimestamp(lastSavedAt);
    renderMissingPanel(missing);
  }

  /**
   * 用途：更新頂部「衝突 N 項」與可展開的分歧清單。有衝突時整個標籤
   *   變紅色——衝突跟「待填」不是同一種嚴重程度，要一眼分得出來。
   * Args:
   *   rosterDiff {Object} `apiLoadWeek()` 回傳的 `rosterDiff`。
   * Returns:
   *   {void}
   */
  function renderConflictStat(rosterDiff) {
    var diff = rosterDiff || { conflictCount: 0, rows: [] };
    var statEl = document.getElementById('statConflicts');
    statEl.textContent = '衝突 ' + diff.conflictCount + ' 項';
    statEl.classList.toggle('stat-conflict', diff.conflictCount > 0);

    var panel = document.getElementById('conflictPanel');
    var conflicts = (diff.rows || []).filter(function (r) { return r.status === 'CONFLICT'; });
    if (conflicts.length === 0) {
      panel.innerHTML = '（週報與職事表沒有衝突）';
      return;
    }
    panel.innerHTML =
      '<div><strong>職事表在你覆寫之後又改過的欄位：</strong></div><ul>'
      + conflicts.map(function (r) {
        return '<li>' + escapeHtml(r.postLabel) + ' #' + r.slotIndex
          + '　覆寫當時職事表＝' + escapeHtml(r.rosterValueAtOverride || '（空白）')
          + '　職事表現值＝' + escapeHtml(r.rosterName || '（空白）')
          + '　週報現值＝' + escapeHtml(r.bulletinName || '（空白）')
          + '</li>';
      }).join('')
      + '</ul><div>本系統不會改動職事表。如果週報的版本才是正確的，請自行到職事表更正。</div>';
  }

  function renderMissingPanel(missing) {
    var panel = document.getElementById('missingPanel');
    if (!missing || missing.length === 0) {
      panel.innerHTML = '（目前沒有待填項目）';
      return;
    }
    var html = '<ul>' + missing.map(function (m) {
      return '<li>' + escapeHtml(m.label) + '：' + escapeHtml(m.reason) + '</li>';
    }).join('') + '</ul>';
    panel.innerHTML = html;
  }

  // =====================================================================
  // 主日下拉、載入、儲存、重新讀取職事表
  // =====================================================================

  function populateWeekSelect(weeks, defaultIsoDate) {
    var sel = document.getElementById('weekSelect');
    sel.innerHTML = '';
    weeks.forEach(function (w) {
      var o = el('option');
      o.value = w.isoDate;
      o.textContent = w.label + (w.status ? '　[' + w.status + ']' : '');
      if (w.isoDate === defaultIsoDate) o.selected = true;
      sel.appendChild(o);
    });
  }

  /**
   * 用途：載入指定主日的完整資料。
   * Args:
   *   isoDate {string} 主日日期，yyyy-MM-dd。
   *   options {{keepMessage:boolean}=} 選填。`keepMessage:true` 時不清除
   *     目前顯示的訊息橫幅——`onSaveSuccess()` 剛顯示完「已儲存」之類的
   *     訊息、緊接著要呼叫這個函式重新整理畫面時要傳這個，否則訊息會
   *     被下面第一行的 `hideMessage()` 立刻清走（見 MESSAGE_MIN_VISIBLE_MS
   *     的註解）。使用者自己在下拉選單切換主日則不傳，維持原本「換頁
   *     就清訊息」的行為。
   * Returns:
   *   {void}
   */
  function loadWeek(isoDate, options) {
    var opts = options || {};
    if (!opts.keepMessage) hideMessage();
    setLoaded(false);
    beginRequest('載入中…');
    google.script.run
      .withSuccessHandler(function (resp) { onWeekLoaded(isoDate, resp); })
      .withFailureHandler(onApiFailure)
      .apiLoadWeek(isoDate);
  }

  function onWeekLoaded(isoDate, resp) {
    endRequest();
    if (!resp.ok) { setLoaded(false); showMessage('error', resp.error.message); return; }
    var data = resp.data;

    state.isoDate = isoDate;
    state.lastSavedAt = data.lastSavedAt;
    state.week = data.week;
    state.lists = data.lists;
    state.options = data.options;

    populateSelectOptions(document.getElementById('programTemplateSelect'), data.options.programTemplateIds);
    populateSelectOptions(document.getElementById('recitationSelect'), data.options.recitationOptions,
      function (v) { return v || '（留空＝自動）'; });
    populatePrayerHeadingOptions(data.options.prayerBlockHeadingOptions);
    document.getElementById('attCantoneseSubLabel').textContent = '粵語堂' + (data.options.cantoneseSubColumnLabel || '主堂');

    applyWeekFieldsToForm();
    renderAllLists();
    renderReadOnly(data.readOnly);
    renderStats(data.missing, data.warnings, data.lastSavedAt);
    renderConflictStat(data.rosterDiff);
    renderFillGridLink(data.fillGridUrl);
    renderProgramPreview(data.readOnly.program);
    setLoaded(true);
  }

  /**
   * 用途：顯示／隱藏頂部的「開啟本季填寫表」連結（第八輪）。
   *
   *   ⚠️ 網址是空字串（格子表未建立）時**隱藏整個按鈕**——顯示一條開
   *   不到的連結比不顯示更差，使用者會以為系統壞了。
   * Args:
   *   url {string} 直達季度填寫表的網址；空字串代表未建立。
   * Returns:
   *   {void}
   */
  function renderFillGridLink(url) {
    var link = document.getElementById('fillGridLink');
    if (!url) {
      link.classList.add('hidden');
      link.removeAttribute('href');
      return;
    }
    link.href = url;
    link.classList.remove('hidden');
  }

  function reloadRosterOnly() {
    if (!state.isoDate) return;
    if (state.inFlight > 0) return;
    hideMessage();
    beginRequest('讀取職事表中…');
    google.script.run
      .withSuccessHandler(onRosterReloaded)
      .withFailureHandler(onApiFailure)
      .apiLoadWeek(state.isoDate);
  }

  /**
   * 只更新唯讀區塊（事奉框、下週事奉、程序預覽）與統計，**不動可編輯
   * 表單**——理由跟這個按鈕原本的設計一致：使用者可能正在填寫、尚未
   * 儲存，這個按鈕的用途是核對職事表最新內容，不是重新載入整份資料。
   * 訊息文案由伺服器的 buildRosterReloadMessage_() 算好，直接顯示。
   */
  function onRosterReloaded(resp) {
    endRequest();
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    renderReadOnly(resp.data.readOnly);
    renderStats(resp.data.missing, resp.data.warnings, state.lastSavedAt);
    renderConflictStat(resp.data.rosterDiff);
    renderProgramPreview(resp.data.readOnly.program);
    var msg = resp.data.rosterReloadMessage;
    showMessage(msg.type, msg.text);
  }

  function buildSavePayload() {
    return {
      isoDate: state.isoDate,
      lastSavedAt: state.lastSavedAt,
      week: collectWeekFieldsFromForm(),
      announcements: state.lists.announcements,
      prayers: state.lists.prayers,
      fellowships: state.lists.fellowships,
      finance: state.lists.finance,
      dutyEdits: Object.keys(state.dutyEdits).map(function (k) { return state.dutyEdits[k]; })
    };
  }

  function setSaveButtonText(text) {
    document.getElementById('saveBtn').textContent = text;
  }

  /**
   * 用途：撳「儲存」的處理函式。
   *
   *   防止重複提交分兩層：按鈕在 `inFlight > 0` 時 `disabled`（視覺層，
   *   見 applyBusyState()），這裡再加 `if (state.inFlight > 0) return;`
   *   （邏輯層）——兩層都要有，因為鍵盤 Enter 或瀏覽器擴充功能有機會
   *   繞過 `disabled` 屬性直接觸發 click。
   * Returns:
   *   {void}
   */
  function saveWeek() {
    if (!state.isoDate) return;
    if (state.inFlight > 0) return;
    if (!state.loaded) {
      showMessage('error', '資料未載入成功，無法儲存');
      return;
    }
    hideMessage();
    setSaveButtonText('儲存中…');
    beginRequest('儲存中…');
    google.script.run
      .withSuccessHandler(onSaveSuccess)
      .withFailureHandler(onApiFailure)
      .apiSaveWeek(buildSavePayload());
  }

  /**
   * 失敗 → 紅色橫幅，伺服器已經給了講清楚原因的訊息（含 STALE 時的
   * 兩個時間、SCHEMA_OUTDATED 的落差摘要），前端原樣顯示即可。成功時
   * 的文案（綠色「已儲存，更新了 N 個欄位」或藍色「沒有偵測到任何
   * 改動」）由伺服器的 buildSaveResultMessage_() 算好，前端不再自己
   * 砌字串。顯示完訊息之後呼叫 loadWeek() 重新整理畫面，**一定要傳
   * `{ keepMessage: true }`**，否則訊息會被 loadWeek() 開頭的
   * hideMessage() 立刻清走（見 MESSAGE_MIN_VISIBLE_MS 的註解）。
   */
  function onSaveSuccess(resp) {
    endRequest();
    setSaveButtonText('儲存');
    if (!resp.ok) {
      showMessage('error', resp.error.message);
      return;
    }
    var msg = resp.data.message;
    showMessage(msg.type, msg.text);
    loadWeek(state.isoDate, { keepMessage: true });
  }

  // =====================================================================
  // 由職事表重新取數
  // =====================================================================

  /**
   * 用途：撳「由職事表重新取數」——**不會立即寫入**，只是去伺服器拿一份
   *   比對清單，然後彈出對話框讓使用者逐項勾選。真正的寫入要等撳「確定」。
   * Returns:
   *   {void}
   */
  function openFetchFromRosterDialog() {
    if (!state.isoDate) return;
    if (state.inFlight > 0) return;
    hideMessage();
    beginRequest('讀取職事表中…');
    google.script.run
      .withSuccessHandler(onFetchCandidatesLoaded)
      .withFailureHandler(onApiFailure)
      .apiGetRosterFetchCandidates(state.isoDate);
  }

  function onFetchCandidatesLoaded(resp) {
    endRequest();
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    state.fetchCandidates = resp.data.rows || [];
    renderFetchDialog();
    document.getElementById('fetchDialogBackdrop').classList.remove('hidden');
  }

  /**
   * 用途：渲染對話框內容。只列出 `CONFLICT` 與 `OVERRIDDEN` 的行——
   *   `FOLLOW` 已經自動處理好、`SAME` 根本沒有東西會變，兩者都沒有
   *   「要不要取數」這個選擇可言。`CONFLICT` 預設勾選、`OVERRIDDEN`
   *   預設不勾選（由伺服器算好的 `defaultChecked` 決定）。
   * Returns:
   *   {void}
   */
  function renderFetchDialog() {
    var body = document.getElementById('fetchDialogBody');
    var footnote = document.getElementById('fetchDialogFootnote');
    var confirmBtn = document.getElementById('fetchConfirmBtn');
    body.innerHTML = '';

    if (state.fetchCandidates.length === 0) {
      var empty = el('div', 'dialog-empty');
      empty.textContent = '週報與職事表一致，沒有需要取數的欄位。';
      body.appendChild(empty);
      footnote.classList.add('hidden');
      confirmBtn.classList.add('hidden');
      return;
    }
    footnote.classList.remove('hidden');
    confirmBtn.classList.remove('hidden');

    var table = el('table');
    table.innerHTML = '<thead><tr><th></th><th>崗位</th><th>位次</th><th>你的覆寫值</th><th>職事表現值</th></tr></thead>';
    var tbody = el('tbody');

    state.fetchCandidates.forEach(function (row, idx) {
      var tr = el('tr');
      if (row.status === 'CONFLICT') tr.classList.add('is-conflict');

      var tdCheck = el('td');
      var checkbox = el('input');
      checkbox.type = 'checkbox';
      checkbox.checked = Boolean(row.defaultChecked);
      checkbox.setAttribute('data-fetch-index', String(idx));
      tdCheck.appendChild(checkbox);
      tr.appendChild(tdCheck);

      [row.postLabel, String(row.slotIndex), row.bulletinName || '（空白）', row.rosterName || '（空白）']
        .forEach(function (text) {
          var td = el('td');
          td.textContent = text;
          tr.appendChild(td);
        });

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    body.appendChild(table);
  }

  function setAllFetchCheckboxes(checked) {
    var boxes = document.querySelectorAll('#fetchDialogBody input[type="checkbox"]');
    for (var i = 0; i < boxes.length; i++) boxes[i].checked = checked;
  }

  function closeFetchDialog() {
    document.getElementById('fetchDialogBackdrop').classList.add('hidden');
  }

  /**
   * 用途：撳對話框的「確定」——把勾選的欄位送去伺服器，改回跟隨職事表。
   * Returns:
   *   {void}
   */
  function confirmFetchFromRoster() {
    var selections = [];
    var boxes = document.querySelectorAll('#fetchDialogBody input[type="checkbox"]');
    for (var i = 0; i < boxes.length; i++) {
      if (!boxes[i].checked) continue;
      var row = state.fetchCandidates[Number(boxes[i].getAttribute('data-fetch-index'))];
      if (row) selections.push({ postId: row.postId, slotIndex: row.slotIndex });
    }

    closeFetchDialog();
    if (selections.length === 0) {
      showMessage('info', '沒有勾選任何欄位，沒有做任何改動。');
      return;
    }

    beginRequest('由職事表重新取數中…');
    google.script.run
      .withSuccessHandler(function (resp) {
        endRequest();
        if (!resp.ok) { showMessage('error', resp.error.message); return; }
        showMessage(resp.data.message.type, resp.data.message.text);
        // 重新載入才看得到新的名單與衝突狀態；一定要保留剛顯示的訊息。
        loadWeek(state.isoDate, { keepMessage: true });
      })
      .withFailureHandler(onApiFailure)
      .apiFetchFromRoster(state.isoDate, selections);
  }

  // =====================================================================
  // 程序表即時預覽
  // =====================================================================

  function schedulePreviewRefresh() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(refreshPreview, 350);
  }

  /**
   * 即時預覽用自己的 previewInFlight 計數器（beginPreview／endPreview），
   * **不呼叫** beginRequest()／endRequest()——預覽每次打字都會觸發，
   * 不可以停用整個介面，尤其不可以停用輸入框本身，否則使用者會打不了字。
   */
  function refreshPreview() {
    if (!state.isoDate) return;
    var draft = collectWeekFieldsFromForm();
    beginPreview();
    google.script.run
      .withSuccessHandler(function (resp) { endPreview(); if (resp.ok) renderProgramPreview(resp.data.rows); })
      .withFailureHandler(function () { endPreview(); /* 預覽失敗不打擾使用者，維持上一次的預覽內容 */ })
      .apiPreviewProgram(state.isoDate, draft);
  }

  // =====================================================================
  // 初始化
  // =====================================================================

  function wireStaticEvents() {
    document.getElementById('weekSelect').addEventListener('change', function (e) { loadWeek(e.target.value); });
    document.getElementById('saveBtn').addEventListener('click', saveWeek);
    document.getElementById('reloadRosterBtn').addEventListener('click', reloadRosterOnly);
    document.getElementById('statMissing').addEventListener('click', function () {
      document.getElementById('missingPanel').classList.toggle('hidden');
    });
    document.getElementById('statConflicts').addEventListener('click', function () {
      document.getElementById('conflictPanel').classList.toggle('hidden');
    });

    document.getElementById('fetchFromRosterBtn').addEventListener('click', openFetchFromRosterDialog);
    document.getElementById('fetchCancelBtn').addEventListener('click', closeFetchDialog);
    document.getElementById('fetchConfirmBtn').addEventListener('click', confirmFetchFromRoster);
    document.getElementById('fetchSelectAllBtn').addEventListener('click', function () { setAllFetchCheckboxes(true); });
    document.getElementById('fetchSelectNoneBtn').addEventListener('click', function () { setAllFetchCheckboxes(false); });

    var addButtons = document.querySelectorAll('[data-add-list]');
    for (var i = 0; i < addButtons.length; i++) {
      (function (btn) {
        btn.addEventListener('click', function () { addListItem(btn.getAttribute('data-add-list')); });
      })(addButtons[i]);
    }

    document.addEventListener('input', function (e) {
      var target = e.target;
      if (target && target.hasAttribute && target.hasAttribute('data-field')) {
        state.week[target.getAttribute('data-field')] = target.value;
        schedulePreviewRefresh();
      }
    });
  }

  /**
   * 用途：捕捉前端沒有被任何 try/catch 接住的例外（一般執行錯誤與未處理
   *   的 Promise rejection），顯示紅色橫幅並回報 ErrorLog——理由同
   *   onApiFailure()：Apps Script 執行紀錄看不到前端發生了什麼事，不記
   *   下來就沒有人知道。
   * Returns:
   *   {void}
   */
  function wireGlobalErrorHandlers() {
    window.onerror = function (message, source, lineno, colno, error) {
      var text = '前端發生未預期的錯誤：' + message;
      showMessage('error', text);
      reportClientError_(
        text,
        error && error.stack ? String(error.stack).split('\n').slice(0, 5).join('\n') : (source + ':' + lineno + ':' + colno),
        'window.onerror'
      );
      return false;
    };

    window.onunhandledrejection = function (event) {
      var reason = event && event.reason;
      var text = '前端發生未處理的錯誤：' + (reason && reason.message ? reason.message : String(reason));
      showMessage('error', text);
      reportClientError_(
        text,
        reason && reason.stack ? String(reason.stack).split('\n').slice(0, 5).join('\n') : '',
        'window.onunhandledrejection'
      );
    };
  }

  function init() {
    wireGlobalErrorHandlers();
    wireStaticEvents();
    document.getElementById('missingPanel').classList.add('hidden');
    document.getElementById('conflictPanel').classList.add('hidden');
    applyBusyState();
    beginRequest('載入中…');
    google.script.run
      .withSuccessHandler(onWeeksLoaded)
      .withFailureHandler(onApiFailure)
      .apiListWeeks();
  }

  function onWeeksLoaded(resp) {
    endRequest();
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    populateWeekSelect(resp.data.weeks, resp.data.defaultIsoDate);
    if (resp.data.defaultIsoDate) {
      loadWeek(resp.data.defaultIsoDate);
    } else {
      showMessage('error', '目前沒有任何主日資料。請先在試算表用選單「建立本季空白週報」建立骨架。');
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
