  /**
   * 用途：v3：開啟填寫介面時，系統剛自動建立了新季度（或者建立失敗）的那一句，放在頂部黃色橫幅。
   *   沒有就收起。
   * Args:
   *   text {string} 伺服器 `buildAutoCreateQuartersMessage_()` 的結果。
   * Returns:
   *   {void}
   */
  function renderAutoCreateNotice(text) {
    var bar = document.getElementById('autoCreateBar');
    var t = String(text || '').trim();
    bar.textContent = t;
    bar.classList.toggle('hidden', !t);
  }

  // BEGIN publish-window（v3：測試會把這一段抽出來在假 DOM 上執行，請保持自足；用到 state）
  /**
   * 用途：v3：按伺服器算好的發佈時窗，決定頂部「目前已發佈」那一行、發佈與寄出兩個勾選、
   *   「執行」能不能用。只有畫面上是「該週」（上一個主日翌日至該主日）才可以發佈或寄出；
   *   其他週顯示伺服器那一句說明。測試用的「模擬今日」亦講明。
   * Args:
   *   win {?{isCurrentWeek:boolean, notice:string, simulated:boolean, simulatedInvalid:boolean,
   *     todayIso:string}} `apiLoadWeek()` 的 `publishWindow`；沒有就當不在時窗。
   * Returns:
   *   {void}
   */
  function renderPublishWindow(win) {
    var w = win || { isCurrentWeek: false, notice: '' };
    state.publishWindow = w;
    var current = w.isCurrentWeek === true;
    document.getElementById('publishStatusBar').classList.toggle('hidden', !current);

    var parts = [];
    if (!current && w.notice) parts.push(String(w.notice));
    if (w.simulated === true) parts.push('（測試設定：系統現在當今日是 ' + String(w.todayIso || '') + '。正式使用前要清空。）');
    if (w.simulatedInvalid === true) parts.push('（測試用的「模擬今日」格式不對，已改用真正的今日。）');
    var notice = document.getElementById('publishWindowNotice');
    notice.textContent = parts.join('　');
    notice.classList.toggle('hidden', parts.length === 0);

    document.getElementById('doPublishCheck').disabled = !current;
    document.getElementById('doSendCheck').disabled = !current;
    document.getElementById('publishRunBtn').disabled = !current;
    document.getElementById('publishFileRow').classList.toggle('is-window-closed', !current);
    document.getElementById('publishSendRow').classList.toggle('is-window-closed', !current);
  }

  /**
   * 用途：v3：畫面上的主日是不是在發佈時窗之內（「執行」按鈕忙碌完之後要不要重新啟用，看這一個）。
   * Returns:
   *   {boolean}
   */
  function isPublishWindowOpen() {
    return Boolean(state.publishWindow && state.publishWindow.isCurrentWeek === true);
  }
  // END publish-window

  /**
   * 用途：v3：「複製連結」——把這一個主日的預覽連結複製到剪貼簿。瀏覽器不准用剪貼簿時退回舊方法，
   *   兩個都不行就選取連結文字，請使用者自己按 Ctrl+C。
   * Returns:
   *   {void}
   */
  function copyPreviewLink() {
    var url = state.previewUrl || '';
    if (!url) return;
    var done = document.getElementById('copyPreviewLinkDone');
    function ok() { done.textContent = '已複製'; done.classList.remove('hidden'); }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = url;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        var copied = document.execCommand('copy');
        document.body.removeChild(ta);
        if (copied) { ok(); return; }
      } catch (err) { /* 下面講明 */ }
      done.textContent = '瀏覽器不准自動複製，請選取上面的連結再按 Ctrl+C。';
      done.classList.remove('hidden');
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(ok, fallback);
        return;
      }
    } catch (err) { /* 退回舊方法 */ }
    fallback();
  }

  /**
   * 用途：v3：有未儲存的修改時，頂部出一句提醒，所有「儲存」按鈕加一圈黃色。
   *   判斷用 hasUnsavedWeekChanges()（與換週保護、「儲存」送甚麼同一套規則）。
   * Returns:
   *   {void}
   */
  function refreshUnsavedIndicator() {
    var dirty = hasUnsavedWeekChanges();
    document.getElementById('unsavedHint').classList.toggle('hidden', !dirty);
    var buttons = document.querySelectorAll('[data-save-button]');
    for (var i = 0; i < buttons.length; i++) buttons[i].classList.toggle('has-unsaved', dirty);
  }

  /**
   * 用途：按「由職事表重新取數」（v3：取代以前頂部的「重讀職事表（本主日，不覆寫）」）。
   *   重新讀取職事表最新內容、重畫兩個事奉框，講出你填的與職事表不同的崗位；不覆寫任何一格。
   *
   *   審查後修正 7：這個按鈕會按職事表最新內容重畫兩個事奉框，事奉框上未儲存的改動（改了的名字、
   *   「保留我的」、「還原」）會靜靜丟失。有這種改動時先用頁內確認對話框問一次；按「取消」甚麼都不做，
   *   亦不顯示訊息（與換週的確認同一做法：不是寫入，用不着「一格都沒有寫」那一句）。沒有改動時照舊直接讀。
   *   表單其他欄位本來就不受影響，不算在內。
   * Args: （無）
   * Returns:
   *   {void}
   */
  function reloadRosterOnly() {
    if (!state.isoDate) return;
    if (state.inFlight > 0) return;
    if (!hasUnsavedDutyEdits()) { startRosterReload(); return; }
    openConfirmDialog('由職事表重新取數', [RELOAD_ROSTER_DISCARD_DUTY_PROMPT], function (accepted) {
      if (accepted) startRosterReload();
    });
  }

  /**
   * 審查後修正 7：「重讀職事表」會重畫事奉框，事奉框有未儲存的改動時先問的一句。放在 reloadRosterOnly()
   * 之後（測試會把 reloadRosterOnly() 至 buildSavePayload() 這一段抽出來執行）。
   */
  var RELOAD_ROSTER_DISCARD_DUTY_PROMPT = '重新取數會按職事表最新內容重畫事奉框，你未儲存的事奉改動會丟失，確定嗎？';

  /**
   * 用途：真正送出「重讀職事表」的請求（`reloadRosterOnly()` 確認之後才叫）。
   * Args: （無）
   * Returns:
   *   {void}
   */
  function startRosterReload() {
    if (!state.isoDate || state.inFlight > 0) return;
    hideMessage();
    callServer('apiLoadWeek', [state.isoDate], onRosterReloaded, { busyText: '由職事表重新取數中…' });
  }

  /**
   * 只更新唯讀區塊（事奉框、下週事奉、程序預覽）與統計，**不動可編輯
   * 表單**——理由跟這個按鈕原本的設計一致：使用者可能正在填寫、尚未
   * 儲存，這個按鈕的用途是核對職事表最新內容，不是重新載入整份資料。
   * 訊息文案由伺服器的 buildRosterReloadMessage_() 算好，直接顯示。
   */
  function onRosterReloaded(resp) {
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    renderReadOnly(resp.data.readOnly);
    // D9：事奉框剛按職事表最新內容重畫，「載入時的名字」要跟着換，否則職事表換了人的格會被當成
    //    使用者改過而送上去（與 onWeekLoaded() 同一做法）。
    state.loadedDutyNames = dutyNameMap(state.dutyEdits);
    state.loadedNextDutyNames = dutyNameMap(state.nextWeekDutyEdits);
    renderStats(resp.data.missingSplit, resp.data.warnings, state.lastSavedAt);
    renderConflictStat(resp.data.rosterDiff);
    // v3：程序表用表單上的草稿重算（未儲存的程序增刪不可以被重畫走）。
    schedulePreviewRefresh();
    // v3：重新取數之後講出你填的與職事表不同的崗位（名字一律保留你填的）。
    var diffs = resp.data.dutyDiffs || [];
    renderDutyDiffNotice(diffs);
    var msg = resp.data.rosterReloadMessage;
    showMessage(msg.type, msg.text + (diffs.length > 0
      ? '　有 ' + diffs.length + ' 個崗位你填的名字與職事表不同，已保留你填的（見「本週事奉」上方）。'
      : '　你填的名字與職事表沒有不同。'));
  }

  /**
   * ⚠️ R-011：**四張清單與內容表接管的欄位一律不再送**。
   *
   *   後端 `assertContentSheetFieldsNotSubmitted_()` 會擋住帶內容的送出，
   *   但前端也要自己不送——兩邊都做，不是重複：後端擋的是「有人繞過介面」，
   *   前端不送的是「介面自己不要製造出一個會被拒絕的請求」。
   */
  function buildSavePayload() {
    // F1：只送使用者真的改過的欄位，另送它們載入時的值（baseWeek）。
    // 沒有改動的欄位一律不送，否則較早載入的分頁會把別處剛寫入的值蓋回舊值。
    var parts = diffWeekFields(collectWeekFieldsFromForm(), state.loadedWeek, CONTENT_SHEET_WEEK_FIELDS);

    return {
      isoDate: state.isoDate,
      lastSavedAt: state.lastSavedAt,
      payloadVersion: SAVE_PAYLOAD_VERSION,
      baseWeek: parts.baseWeek,
      week: parts.week,
      // D9：只送載入之後改過的格（與按了「保留我的」的格），每格帶載入時的名字 baseName。
      //    沒有改的格不送——以前整批送，會令衝突靜靜消失（FF-17），或把載入時的舊名字釘成覆寫（FF-26）。
      dutyEdits: changedDutyEdits(state.dutyEdits, state.loadedDutyNames),
      // R-040：送去後端之後，後端會用**下一個主日**的日期寫 DutyOverride。
      nextWeekDutyEdits: changedDutyEdits(state.nextWeekDutyEdits, state.loadedNextDutyNames)
    };
  }

  function setSaveButtonText(text) {
    document.getElementById('saveBtn').textContent = text;
    // v3：每一個區塊的「儲存」一併改字（都是同一個動作）。
    var buttons = document.querySelectorAll('[data-save-button]');
    for (var i = 0; i < buttons.length; i++) buttons[i].textContent = text;
  }

  /**
   * 用途：撳「儲存」的處理函式。
   *
   *   防止重複提交分兩層：按鈕在 `inFlight > 0` 時 `disabled`（視覺層，
   *   見 applyBusyState()），這裡再加 `if (state.inFlight > 0) return;`
   *   （邏輯層）——兩層都要有，因為鍵盤 Enter 或瀏覽器擴充功能有機會
   *   繞過 `disabled` 屬性直接觸發 click。
   * Returns:
   *   {void}
   */
  function saveWeek() {
    if (!state.isoDate) return;
    if (state.inFlight > 0) return;
    if (!state.loaded) {
      showMessage('error', '資料未載入成功，無法儲存');
      return;
    }
    hideMessage();
    setSaveButtonText('儲存中…');
    callServer('apiSaveWeek', [buildSavePayload()], onSaveSuccess, {
      busyText: '儲存中…',
      // 失敗時一定要把按鈕文字改回來，否則會一直寫著「儲存中…」，
      // 看起來像仍然在跑。
      onError: function (message) { setSaveButtonText('儲存'); showMessage('error', message); }
    });
  }

  /**
   * 失敗 → 紅色橫幅，伺服器已經給了講清楚原因的訊息（含 STALE 時的
   * 兩個時間、SCHEMA_OUTDATED 的落差摘要），前端原樣顯示即可。成功時
   * 的文案（綠色「已儲存，更新了 N 個欄位」；G16：欄位沒有改變而只更新了
   * 覆寫記錄時是綠色「已儲存。欄位內容沒有改變，只更新了 N 筆覆寫記錄……」；
   * 或藍色「沒有偵測到任何改動」）由伺服器的 buildSaveResultMessage_() 算好，前端不再自己
   * 砌字串。顯示完訊息之後呼叫 loadWeek() 重新整理畫面，**一定要傳
   * `{ keepMessage: true }`**，否則訊息會被 loadWeek() 開頭的
   * hideMessage() 立刻清走（見 showMessage() 的註解）。
   */
  function onSaveSuccess(resp) {
    setSaveButtonText('儲存');
    if (!resp.ok) {
      showMessage('error', resp.error.message);
      return;
    }
    var msg = resp.data.message;
    showMessage(msg.type, msg.text);
    loadWeek(state.isoDate, { keepMessage: true });

    // ⚠️ D-9：主日下拉的「待填 N 項」標籤要一併刷新。
    //    本來只有頂部徽章更新，下拉仍然顯示儲存之前那個數字——同一個狀態
    //    有兩個來源，而兩個對不上的時候，幹事會信下拉那個（它比較顯眼）。
    refreshWeekSelectorLabels();
  }

  /**
   * 用途：**D-9**——重新拿一次主日清單，只為了更新下拉的狀態標籤。
   *
   *   ⚠️ 用 `busy:'preview'`：這是一個背景刷新，不應該把整個介面鎖住。
   *   失敗也不出紅色橫幅——標籤舊咗一次不是錯誤，而剛剛那個儲存是成功的，
   *   彈一句紅色訊息只會令人以為儲存失敗。
   * Returns:
   *   {void}
   */
  function refreshWeekSelectorLabels() {
    callServer('apiListWeeks', [state.showArchived], function (resp) {
      if (!resp.ok || !resp.data) return;
      populateWeekSelectors(resp.data, state.isoDate);
    }, {
      busy: 'preview',
      onError: function () { /* 標籤舊咗一次不是錯誤，靜靜略過 */ }
    });
  }

  // =====================================================================
  // 由職事表重新取數
  // =====================================================================

  /**
   * 用途：撳「由職事表重新取數」——**不會立即寫入**，只是去伺服器拿一份
   *   比對清單，然後彈出對話框讓使用者逐項勾選。真正的寫入要等撳「確定」。
   * Returns:
   *   {void}
   */
  function openFetchFromRosterDialog() {
    if (!state.isoDate) return;
    if (state.inFlight > 0) return;
    hideMessage();
    callServer('apiGetRosterFetchCandidates', [state.isoDate], onFetchCandidatesLoaded,
      { busyText: '讀取職事表中…' });
  }

  function onFetchCandidatesLoaded(resp) {
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    state.fetchCandidates = resp.data.rows || [];
    renderFetchDialog();
    document.getElementById('fetchDialogBackdrop').classList.remove('hidden');
  }

  /**
   * 用途：渲染對話框內容。只列出 `CONFLICT` 與 `OVERRIDDEN` 的行——
   *   `FOLLOW` 已經自動處理好、`SAME` 根本沒有東西會變，兩者都沒有
   *   「要不要取數」這個選擇可言。`CONFLICT` 預設勾選、`OVERRIDDEN`
   *   預設不勾選（由伺服器算好的 `defaultChecked` 決定）。
   * Returns:
   *   {void}
   */
  function renderFetchDialog() {
    var body = document.getElementById('fetchDialogBody');
    var footnote = document.getElementById('fetchDialogFootnote');
    var confirmBtn = document.getElementById('fetchConfirmBtn');
    body.innerHTML = '';

    if (state.fetchCandidates.length === 0) {
      var empty = el('div', 'dialog-empty');
      empty.textContent = '沒有需要覆寫的格：你填的名字都與職事表相同，或者職事表未排定（未排定的會保留你填的）。';
      body.appendChild(empty);
      footnote.classList.add('hidden');
      confirmBtn.classList.add('hidden');
      return;
    }
    footnote.classList.remove('hidden');
    confirmBtn.classList.remove('hidden');

    var table = el('table');
    table.innerHTML = '<thead><tr><th></th><th>崗位</th><th>位次</th><th>你填的名字</th><th>職事表的名字</th></tr></thead>';
    var tbody = el('tbody');

    state.fetchCandidates.forEach(function (row, idx) {
      var tr = el('tr');
      if (row.status === 'CONFLICT') tr.classList.add('is-conflict');

      var tdCheck = el('td');
      var checkbox = el('input');
      checkbox.type = 'checkbox';
      checkbox.checked = Boolean(row.defaultChecked);
      checkbox.setAttribute('data-fetch-index', String(idx));
      tdCheck.appendChild(checkbox);
      tr.appendChild(tdCheck);

      [row.postLabel, String(row.slotIndex), row.bulletinName || '（空白）', row.rosterName || '（空白）']
        .forEach(function (text) {
          var td = el('td');
          td.textContent = text;
          tr.appendChild(td);
        });

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    body.appendChild(table);
  }

  function setAllFetchCheckboxes(checked) {
    var boxes = document.querySelectorAll('#fetchDialogBody input[type="checkbox"]');
    for (var i = 0; i < boxes.length; i++) boxes[i].checked = checked;
  }

  function closeFetchDialog() {
    document.getElementById('fetchDialogBackdrop').classList.add('hidden');
  }

  /**
   * 用途：第二批測試修正 G19：「由職事表重新取數」對話框按「取消」——關閉對話框，顯示
   *   與其他會寫入的確認對話框同一句。按「確定」之後關閉對話框的是 confirmFetchFromRoster()，
   *   不經這裏。
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function cancelFetchFromRoster() {
    // G25：處理中不可以關閉並講「一格都沒有寫」——請求可能已經送出。
    if (state.inFlight > 0) return;
    closeFetchDialog();
    showMessage('info', CANCELLED_NOTHING_WRITTEN_MESSAGE);
  }

  /**
   * 用途：撳對話框的「確定」——把勾選的欄位送去伺服器，改回跟隨職事表。
   * Returns:
   *   {void}
   */
  function confirmFetchFromRoster() {
    // G25：處理中（例如上一個動作沒有回應、正在等候）不可以再送。
    if (state.inFlight > 0) return;
    var selections = [];
    var boxes = document.querySelectorAll('#fetchDialogBody input[type="checkbox"]');
    for (var i = 0; i < boxes.length; i++) {
      if (!boxes[i].checked) continue;
      var row = state.fetchCandidates[Number(boxes[i].getAttribute('data-fetch-index'))];
      if (row) selections.push({ postId: row.postId, slotIndex: row.slotIndex });
    }

    closeFetchDialog();
    if (selections.length === 0) {
      showMessage('info', '沒有勾選任何欄位，沒有做任何改動。');
      return;
    }

    callServer('apiFetchFromRoster', [state.isoDate, selections], function (resp) {
      if (!resp.ok) { showMessage('error', resp.error.message); return; }
      showMessage(resp.data.message.type, resp.data.message.text);
      // 重新載入才看得到新的名單與衝突狀態；一定要保留剛顯示的訊息。
      loadWeek(state.isoDate, { keepMessage: true });
    }, { busyText: '以職事表覆寫中…' });
  }

  // =====================================================================
  // 程序表即時預覽
  // =====================================================================

  function schedulePreviewRefresh() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(refreshPreview, 350);
  }

  /**
   * 即時預覽用自己的 previewInFlight 計數器（beginPreview／endPreview），
   * **不呼叫** beginRequest()／endRequest()——預覽每次打字都會觸發，
   * 不可以停用整個介面，尤其不可以停用輸入框本身，否則使用者會打不了字。
   */
  function refreshPreview() {
    if (!state.isoDate) return;
    var draft = collectWeekFieldsFromForm();
    callServer('apiPreviewProgram', [state.isoDate, draft], function (resp) {
      if (resp.ok) renderProgramPreview(resp.data.displayRows || resp.data.rows);
    }, {
      busy: 'preview',
      // 預覽失敗不打擾使用者，維持上一次的預覽內容；但仍然要回報，
      // 否則「預覽一直不更新」這件事永遠沒有人知道。
      onError: function () {}
    });
  }

  // =====================================================================
  // 發佈及匯出（R-002 至 R-008）
  // =====================================================================

  /**
   * 用途：載入頂部狀態列與發佈區塊要用的資料。
   *
   *   ⚠️ 這一組資料不隨主日下拉改變，所以只在開頁時載入一次，之後
   *   只有「發佈成功」才重新載入。
   * Returns:
   *   {void}
   */
  function loadPublishPanel() {
    callServer('apiGetPublishStatus', [], onPublishPanelLoaded, {
      busy: 'none',
      // 狀態列載不到不應該擋住整個填寫介面——照樣寫一句，其餘功能照用。
      onError: function () {
        document.getElementById('publishStatusText').textContent = '發佈狀態載入失敗，其餘功能不受影響。';
      }
    });
  }

  function onPublishPanelLoaded(resp) {
    if (!resp || !resp.ok) {
      document.getElementById('publishStatusText').textContent = '發佈狀態載入失敗，其餘功能不受影響。';
      return;
    }
    state.publish.panel = resp.data;
    renderPublishStatus(resp.data.status);
    renderPublishGroups(resp.data.groupOptions, (resp.data.prefs || {}).groups || resp.data.defaultGroups);

    document.getElementById('doPublishCheck').checked = (resp.data.prefs || {}).doPublish === true;
    document.getElementById('doSendCheck').checked = (resp.data.prefs || {}).doSend === true;
    applyPublishSubStates();

    // 使用者測試期間的兩條保險（見 Index.html 開頭那兩個常駐橫幅的說明）：
    // 一律放在整頁最頂端，不藏在「發佈及匯出」區塊裏面。
    document.getElementById('dryRunTopBanner').classList.toggle('hidden', resp.data.dryRun !== true);

    var testBanner = document.getElementById('testModeTopBanner');
    var testText = String(resp.data.testModeBanner || '').trim();
    testBanner.textContent = testText;
    testBanner.classList.toggle('hidden', !testText);
  }

  /**
   * 用途：畫頂部那一行常駐狀態（R-008）。
   * Args:
   *   status {Object} `buildPublishStatusForWebApp_()` 的回傳值。
   * Returns:
   *   {void}
   */
  function renderPublishStatus(status) {
    var s = status || {};
    document.getElementById('publishStatusText').textContent = s.text || '';

    // ⚠️ 只有**一顆**連結，是正常的 HTML <a>——之前這裏同時放了兩顆
    // 文字重疊的按鈕（「開啟」＋「開啟目前已發佈的 PDF」），視覺上看
    // 起來像「開啟開啟目前已發佈的 PDF」，見 docs/已知bug類型.md
    // 事故二十六。用 `view`（新分頁開啟）而不是 `download`：手上不會
    // 多一個容易選錯、拿去重新上載的檔案。
    var link = document.getElementById('publishStatusLink');
    var canOpen = Boolean(s.hasMaster && s.links && s.links.view);
    link.classList.toggle('hidden', !canOpen);
    if (canOpen) link.href = s.links.view;

    var hint = document.getElementById('publishStatusHint');
    var needsSetup = !s.hasMaster;
    hint.classList.toggle('hidden', !needsSetup);
    if (needsSetup) {
      hint.textContent = '請先在試算表按「週報系統 ▸ 建立 master 發佈檔案」建立一次，之後那一條連結就永遠不變。';
    }
  }

  function renderPublishGroups(options, checkedKeys) {
    var box = document.getElementById('publishGroupOptions');
    box.innerHTML = '';
    var checked = checkedKeys || [];
    (options || []).forEach(function (opt) {
      var label = document.createElement('label');
      var input = document.createElement('input');
      input.type = 'checkbox';
      input.value = opt.key;
      input.setAttribute('data-publish-group', opt.key);
      input.checked = checked.indexOf(opt.key) !== -1;
      input.addEventListener('change', savePublishPrefs);
      label.appendChild(input);
      label.appendChild(document.createTextNode(opt.label));
      box.appendChild(label);
    });
  }

  function selectedPublishGroups() {
    return Array.prototype.map.call(
      document.querySelectorAll('[data-publish-group]:checked'),
      function (input) { return input.value; }
    );
  }

  /**
   * 用途：兩個勾選各自獨立（R-003），但沒有勾的那一段要看得出是停用的。
   * Returns:
   *   {void}
   */
  function applyPublishSubStates() {
    document.getElementById('publishFileRow').classList
      .toggle('is-disabled', !document.getElementById('doPublishCheck').checked);
    document.getElementById('publishSendRow').classList
      .toggle('is-disabled', !document.getElementById('doSendCheck').checked);
  }

  function savePublishPrefs() {
    callServer('apiSavePublishPrefs', [{
      doPublish: document.getElementById('doPublishCheck').checked,
      doSend: document.getElementById('doSendCheck').checked,
      groups: selectedPublishGroups()
    }], function () {}, {
      busy: 'none',
      // 記住勾選只是方便，存不到不用打擾使用者。
      onError: function () {}
    });
  }

  // BEGIN publish-run（測試會把這一段抽出來執行；用到的其他函式由測試提供替身）
  /**
   * 用途：把使用者選的 PDF 讀成 base64 存進 `state.publish`，並記下揀檔時的主日。
   *
   *   ⚠️ `FileReader.readAsDataURL()` 回的是 `data:application/pdf;base64,xxx`，
   *   要把逗號之前那一截切走才是純 base64。
   *
   *   ⚠️ 第二批測試修正 G9：讀檔是非同步的。揀檔之後、讀完之前換了主日的話，
   *   讀完那一刻畫面已經是另一週，這個 PDF 不屬於它——讀完時主日不同就丟棄，
   *   不放進 `state.publish`。`runPublish()` 另外再核對 `pdfIsoDate` 一次。
   * Args:
   *   event {Event} `change` 事件。
   * Returns:
   *   {void}
   * Raises:
   *   （無）讀檔失敗經訊息列顯示。
   */
  function onPublishPdfChosen(event) {
    var file = event.target.files && event.target.files[0];
    state.publish.pdfBase64 = '';
    state.publish.pdfName = '';
    state.publish.pdfIsoDate = '';
    document.getElementById('publishPdfName').textContent = '未選擇';
    if (!file) return;
    var chosenIsoDate = state.isoDate;

    var limitMb = (state.publish.panel && state.publish.panel.maxPdfMb) || 10;
    if (file.size > limitMb * 1024 * 1024) {
      // 前端先擋一次純粹是為了不要白白上載幾 MB；真正把關的是後端
      // `validateUploadedPdf_()`——只擋前端等於沒有擋。
      showMessage('error', '這個檔案有 ' + (Math.round(file.size / 1024 / 1024 * 100) / 100)
        + ' MB，超過上限 ' + limitMb + ' MB。請在 Word 另存 PDF 時選擇較低的圖片解析度。');
      event.target.value = '';
      return;
    }

    var reader = new FileReader();
    reader.onload = function () {
      // G9：讀完時已經換了主日 → 丟棄，畫面維持「未選擇」。
      if (state.isoDate !== chosenIsoDate) return;
      var text = String(reader.result || '');
      var comma = text.indexOf(',');
      state.publish.pdfBase64 = comma === -1 ? '' : text.slice(comma + 1);
      state.publish.pdfName = file.name;
      state.publish.pdfIsoDate = chosenIsoDate;
      document.getElementById('publishPdfName').textContent = file.name;
    };
    reader.onerror = function () {
      showMessage('error', '讀取這個 PDF 檔案時出錯，請重新選擇一次。');
    };
    reader.readAsDataURL(file);
  }

  /**
   * 用途：撳「執行」。第一次呼叫不帶 `confirmed`，讓後端決定要不要出
   *   確認視窗。
   *
   *   第二批測試修正 G9：要發佈時，已選的 PDF 一定要是在目前這個主日揀的
   *   （`state.publish.pdfIsoDate === state.isoDate`），否則拒絕，一個請求都不送。
   * Args:
   *   confirmed {boolean} 幹事是否已經勾了「仍然要發佈」那一格。
   * Returns:
   *   {void}
   * Raises:
   *   （無）拒絕與伺服器錯誤都經訊息列與確認視窗顯示。
   */
  function runPublish(confirmed) {
    if (!state.isoDate) { showMessage('error', '未選擇主日，無法執行。'); return; }
    // G25：處理中（包括沒有回應之後那 20 秒等候）不可以再送一次。發佈前檢查視窗在
    // #mainContent 以外，遮罩擋不到，只靠按鈕停用不夠（勾選格曾經會把按鈕重新啟用）。
    if (state.inFlight > 0) return;

    var doPublish = document.getElementById('doPublishCheck').checked;
    var doSend = document.getElementById('doSendCheck').checked;
    if (!doPublish && !doSend) {
      showMessage('error', '請至少勾選「發佈到 master 連結」或「寄出」其中一項，然後再按執行。');
      return;
    }
    if (doPublish && !state.publish.pdfBase64) {
      showMessage('error', '勾選了「發佈到 master 連結」，但尚未選擇 PDF 檔案。'
        + '請先按「下載 Word」，用 Word 開啟核對，另存為 PDF，然後在這裏選那個 PDF。');
      return;
    }
    if (doPublish && state.publish.pdfIsoDate !== state.isoDate) {
      // G9：確認視窗是 modal，會蓋住訊息列，所以視窗內也寫一份。
      showMessage('error', PUBLISH_PDF_WEEK_CHANGED_MESSAGE);
      showPublishConfirmError(PUBLISH_PDF_WEEK_CHANGED_MESSAGE);
      return;
    }

    hideMessage();
    setPublishButtonsBusy(true, doPublish ? '發佈中…' : '寄出中…');
    // G19 補充：由發佈前檢查視窗送出（confirmed）之後，那個視窗的「取消」不再代表「沒有做」。
    if (confirmed === true) state.publish.confirmSent = true;

    var publishPayload = {
      isoDate: state.isoDate,
      doPublish: doPublish,
      doSend: doSend,
      pdfBase64: doPublish ? state.publish.pdfBase64 : '',
      pdfName: state.publish.pdfName,
      groups: selectedPublishGroups(),
      customEmails: document.getElementById('publishCustomEmails').value,
      confirmed: confirmed === true,
      // v3：寄出時一併附上這個主日最新已儲存的 Word（伺服器先確定有那個檔，沒有就一封都不寄）。
      attachWord: doSend && document.getElementById('attachWordCheck').checked === true
    };

    callServer('apiRunPublish', [publishPayload], function (resp) {
      setPublishButtonsBusy(false);
      onPublishDone(resp);
    }, {
      busyText: doPublish ? '發佈中…' : '寄出中…',
      // ⚠️ 失敗一定要（1）把按鈕還原、（2）**在確認視窗之內**顯示紅字。
      // 視窗是 modal，蓋住了下面那條訊息列——錯誤寫在下面等於沒有寫。
      onError: function (message) {
        setPublishButtonsBusy(false);
        showPublishConfirmError(message);
        showPublishResult(message, true);
        showMessage('error', message);
      }
    });
  }

  /** G9：已選的 PDF 是在另一個主日揀的，拒絕發佈時的提示。 */
  var PUBLISH_PDF_WEEK_CHANGED_MESSAGE = '揀檔之後換了主日，請重新揀這一週的 PDF。';
  // END publish-run

  /**
   * 用途：撳下去之後立即停用兩顆「執行／確認發佈」按鈕並改文字，成功或
   *   失敗都要還原（第 3 部分）。
   *
   *   ⚠️ 這是防重複的**第一道**防線，不是唯一一道：後端另外有指令碼鎖
   *   與「N 秒內同一主日不再產生新版本」的判斷。只擋前端等於沒有擋。
   * Args:
   *   busy {boolean} 是否忙碌中。
   *   text {string=} 忙碌時要顯示的按鈕文字。
   * Returns:
   *   {void}
   */
  function setPublishButtonsBusy(busy, text) {
    var runBtn = document.getElementById('publishRunBtn');
    var okBtn = document.getElementById('publishConfirmOkBtn');
    // v3：不在發佈時窗之內（不是該週）一律停用，忙碌完亦不可以重新啟用。
    runBtn.disabled = busy === true || !isPublishWindowOpen();
    runBtn.textContent = busy ? (text || '處理中…') : '執行';
    okBtn.disabled = busy === true
      ? true
      : !document.getElementById('publishForcedCheck').checked;
    okBtn.textContent = busy ? (text || '處理中…') : (state.publish.confirmButton || '確認發佈');
  }

  /**
   * 用途：在發佈前檢查視窗**之內**顯示一段紅色錯誤訊息。
   * Args:
   *   message {string} 空字串代表清走。
   * Returns:
   *   {void}
   */
  function showPublishConfirmError(message) {
    var box = document.getElementById('publishConfirmError');
    box.textContent = message || '';
    box.classList.toggle('hidden', !message);
  }

  /**
   * 用途：「執行」發佈／寄出的回應處理。需要確認時打開發佈前檢查視窗，
   *   並帶上伺服器按這次動作算好的字眼（F7：只寄出時不出現「發佈」）。
   * Args:
   *   resp {{ok:boolean, data:Object, error:Object}} `apiRunPublish` 的回應。
   * Returns:
   *   {void}
   */
  function onPublishDone(resp) {
    // 伺服器層的失敗（例外、權限）——訊息同時放在視窗內與訊息列，
    // 因為視窗是 modal，只寫訊息列的話會被蓋住。
    if (!resp.ok) {
      showPublishConfirmError(resp.error.message);
      showPublishResult(resp.error.message, true);
      showMessage('error', resp.error.message);
      return;
    }

    var data = resp.data;
    if (!data.ok && data.reason === 'NEEDS_CONFIRM') {
      openPublishConfirm(data.lines, data.labels);
      return;
    }
    if (!data.ok) {
      // 業務層的拒絕（揀錯檔案、拿不到鎖、格式不對……）。同樣要在視窗內
      // 顯示——這一段訊息正正是使用者最需要看到的那一句。
      showPublishConfirmError(data.message || '未能執行。');
      showPublishResult(data.message || '未能執行。', true);
      showMessage('error', data.message || '未能執行。');
      return;
    }

    closePublishConfirm();
    showPublishResult((data.lines || []).join('\n'), false);
    showMessage('info', data.duplicate
      ? '剛才已經發佈過（第 ' + data.published.versionNo + ' 版），這一次沒有再產生新版本。'
      : (data.published ? '已發佈第 ' + data.published.versionNo + ' 版。' : '已完成。'));

    // 發佈成功之後才需要刷新狀態列；只寄出不會改變「目前已發佈」那一行，
    // 不過一併刷新也無害，而且 `SENT` 欄位可能有更新。
    loadPublishPanel();
  }

  // BEGIN publish-result（測試會把這一段連同 load-week 抽出來在假 DOM 上執行，請保持自足）
  /**
   * 用途：在發佈區塊下面顯示一次發佈／寄出的結果（或錯誤）。
   * Args:
   *   text {string} 要顯示的內容（多行用換行分隔，以 textContent 顯示）。
   *   isError {boolean=} `true` 時用紅色樣式。
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function showPublishResult(text, isError) {
    var box = document.getElementById('publishResult');
    box.textContent = text;
    box.classList.remove('hidden');
    box.classList.toggle('is-error', isError === true);
  }

  /**
   * 用途：清空並收起發佈區塊的結果。
   * Args: （無）
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function clearPublishResult() {
    var box = document.getElementById('publishResult');
    box.textContent = '';
    box.classList.add('hidden');
    box.classList.remove('is-error');
  }

  /**
   * 用途：清走已選的 PDF（記憶體內的內容、檔名、揀檔時的主日），檔案選擇框
   *   清空，旁邊改回「未選擇」。
   *
   *   ⚠️ 檔案選擇框一定要清空：不清的話，再揀同一個檔案瀏覽器不會觸發
   *   `change`，`onPublishPdfChosen()` 根本不會執行。
   * Args: （無）
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function clearChosenPublishPdf() {
    state.publish.pdfBase64 = '';
    state.publish.pdfName = '';
    state.publish.pdfIsoDate = '';
    document.getElementById('publishPdfInput').value = '';
    document.getElementById('publishPdfName').textContent = '未選擇';
  }

  /**
   * 用途：第二批測試修正 G3／G9：載入另一個主日時，收起上一個主日的發佈／寄出
   *   結果，並清走已選的 PDF。
   *
   *   ⚠️ 發佈區塊標題寫著「主日：新的日期」，下面卻仍然掛著上一個主日的
   *   「已記錄 1 個收件人」，幹事會以為新的那一週已經寄出（G3）；已選的 PDF
   *   也仍然在，勾發佈就會把上一週的 PDF 當成這一週發佈出去（G9）。兩者都只屬於
   *   那一個主日，所以按日期判斷：日期不同就清走；同一個主日重新載入（例如
   *   儲存、發佈、還原、重設之後 `loadWeek(state.isoDate, {keepMessage:true})`）
   *   就保留，免得剛顯示的結果與剛揀的 PDF 被緊接的重新載入清走。
   * Args:
   *   previousIsoDate {?string} 目前畫面上的主日（`state.isoDate`；第一次載入是空）。
   *   nextIsoDate {string} 將要載入的主日。
   * Returns:
   *   {boolean} 有沒有清走。
   * Raises:
   *   （無）
   */
  function resetPublishPanelIfWeekChanged(previousIsoDate, nextIsoDate) {
    if (String(previousIsoDate || '') === String(nextIsoDate || '')) return false;
    clearPublishResult();
    clearChosenPublishPdf();
    return true;
  }
  // END publish-result

  /**
   * 用途：打開發佈前檢查視窗。
   * Args:
   *   lines {string[]} 伺服器排好的內容行。
   *   labels {{title:string, checkbox:string, confirmButton:string}=} 伺服器
   *     按「這次做甚麼」算好的字眼（F7：只寄出時不可以出現「發佈」）。
   * Returns:
   *   {void}
   */
  function openPublishConfirm(lines, labels) {
    var l = labels || { title: '發佈前檢查', checkbox: '我明白以上情況，仍然要發佈', confirmButton: '確認發佈' };
    document.getElementById('publishConfirmTitle').textContent = l.title;
    document.getElementById('publishForcedLabel').textContent = l.checkbox;
    state.publish.confirmButton = l.confirmButton;
    document.getElementById('publishConfirmOkBtn').textContent = l.confirmButton;
    var body = document.getElementById('publishConfirmBody');
    body.textContent = (lines || []).join('\n');
    showPublishConfirmError('');
    document.getElementById('publishForcedCheck').checked = false;
    document.getElementById('publishConfirmOkBtn').disabled = true;
    // G19 補充：每次打開都是一個新的確認，未送出。
    state.publish.confirmSent = false;
    document.getElementById('publishConfirmBackdrop').classList.remove('hidden');
  }

  function closePublishConfirm() {
    showPublishConfirmError('');
    document.getElementById('publishConfirmBackdrop').classList.add('hidden');
  }

  /**
   * 用途：第二批測試修正 G19：發佈前檢查視窗按「取消」——關閉視窗，顯示與其他會寫入的
   *   確認對話框同一句（沒有發佈、沒有寄出）。成功之後關閉視窗的是 onPublishDone()，
   *   不經這裏。
   *
   *   G19 補充：這個視窗與其他確認對話框不同，按了「確認發佈」之後仍然開着（失敗、沒有回應、
   *   伺服器回 ok:false 都寫在視窗之內），「取消」是唯一關閉它的方法。已經送出過
   *   （state.publish.confirmSent）就只關閉視窗，頁頂保留原本那一句（例如「這個動作可能已經
   *   完成」）——那時可能已經發佈或寄出了一部分，講「一格都沒有寫」與事實相反。
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function cancelPublishConfirm() {
    // G25：「確認發佈」已經送出、仍在處理（或者沒有回應、正在等候）時，不可以關閉視窗並講
    // 「一格都沒有寫」——那時可能已經發佈或寄出。按鈕亦已停用（applyBusyState()）。
    if (state.inFlight > 0) return;
    closePublishConfirm();
    if (state.publish.confirmSent) return;
    showMessage('info', CANCELLED_NOTHING_WRITTEN_MESSAGE);
  }

  /**
   * 用途：下載這一期的 Word 檔（R-005）。
   *
   *   後端回 base64，前端還原成 Blob 再觸發下載——Apps Script 的
   *   `google.script.run` 傳不了二進位，所以一定要經 base64。
   * Returns:
   *   {void}
   */
  function downloadWord() {
    if (!state.isoDate) { showMessage('error', '未選擇主日，無法下載。'); return; }
    if (state.inFlight > 0) return;
    hideMessage();
    // v3（Ivan 測試結果 A 第 16 項）：有未儲存的修改時先問要哪一個版本。草稿不會存到雲端硬碟。
    if (!hasUnsavedWeekChanges()) { startWordDownload(null); return; }
    openChoiceDialog('下載 Word', [
      '這一頁有未儲存的修改。',
      '「已儲存的版本」：用最後一次儲存的內容產生，並更新雲端硬碟上的最新 Word。',
      '「包括未儲存修改的版本（草稿）」：連同畫面上未儲存的修改一齊產生，只下載，不存到雲端硬碟，亦不會儲存你的修改。'
    ], { ok: '已儲存的版本', alt: '包括未儲存修改的版本（草稿）' }, function (choice) {
      if (choice === 'ok') startWordDownload(null);
      else if (choice === 'alt') startWordDownload(buildSavePayload());
    });
  }

  /**
   * 用途：真正向伺服器要 Word。`draft` 是 null＝已儲存的版本；否則是與「儲存」同一個形狀的草稿
   *   （只取週欄位與事奉格，伺服器不寫任何東西）。
   * Args:
   *   draft {?Object}
   * Returns:
   *   {void}
   */
  function startWordDownload(draft) {
    var args = draft ? [state.isoDate, { draft: { week: draft.week, dutyEdits: draft.dutyEdits,
      nextWeekDutyEdits: draft.nextWeekDutyEdits } }] : [state.isoDate];
    callServer('apiDownloadBulletinDocx', args, function (resp) {
      if (!resp.ok) { showMessage('error', resp.error.message); return; }
      triggerBinaryDownload(resp.data.base64, resp.data.fileName,
        'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      if (resp.data.wordFile) renderWordFileInfo(resp.data.wordFile);
      var done = downloadWordMessage(resp.data);
      showMessage(done.type, done.text);
    }, { busyText: draft ? '產生 Word 草稿中…' : '產生 Word 檔中…' });
  }

  /**
   * 用途：2026-10-28（Ivan 測試結果 B 第 4 項）：「開啟預覽」與「預覽這個版本」＝產生 Word、存到雲端硬碟
   *   （原地更新同一個檔案），再用新分頁開啟雲端硬碟的 Word 檢視器，與下載的 Word 完全一樣。
   *   新分頁一定要在按鈕的 click 之內同步開（`window.open`），否則瀏覽器會當作彈出視窗擋掉；伺服器回來
   *   之後才把網址放進去。擋了就在按鈕旁邊出一條連結。
   *   有未儲存的修改時（只限「開啟預覽」）先問要哪一個版本，與「下載 Word」一樣。
   * Args:
   *   options {?{snapshotId:string}} 有 `snapshotId`＝看那一個版本；null＝看這一期。
   * Returns:
   *   {void}
   */
  function openWordPreview(options) {
    if (!state.isoDate) { showMessage('error', '未選擇主日，無法預覽。'); return; }
    if (state.inFlight > 0) return;
    hideMessage();
    var snapshotId = options && options.snapshotId ? String(options.snapshotId) : '';
    if (snapshotId || !hasUnsavedWeekChanges()) {
      startWordPreview(snapshotId ? { snapshotId: snapshotId } : {});
      return;
    }
    openChoiceDialog('開啟預覽', [
      '這一頁有未儲存的修改。',
      '「已儲存的版本」：用最後一次儲存的內容產生，並更新雲端硬碟上的最新 Word。',
      '「包括未儲存修改的版本（草稿）」：連同畫面上未儲存的修改一齊產生，另存為「草稿預覽」，不會儲存你的修改。'
    ], { ok: '已儲存的版本', alt: '包括未儲存修改的版本（草稿）' }, function (choice) {
      if (choice === 'ok') startWordPreview({});
      else if (choice === 'alt') {
        var draft = buildSavePayload();
        startWordPreview({ draft: { week: draft.week, dutyEdits: draft.dutyEdits,
          nextWeekDutyEdits: draft.nextWeekDutyEdits } });
      }
    });
  }

  /**
   * 用途：真正向伺服器要 Word 預覽，並把網址放進同步開好的新分頁。
   * Args:
   *   serverOptions {{draft:?Object, snapshotId:?string}} 原樣傳給 `apiOpenWordPreview`。
   * Returns:
   *   {void}
   */
  function startWordPreview(serverOptions) {
    var fallback = document.getElementById('wordPreviewFallbackLink');
    fallback.classList.add('hidden');
    fallback.removeAttribute('href');
    var win = null;
    try { win = window.open('', '_blank'); } catch (e) { win = null; }
    if (win) {
      try { win.document.title = '產生 Word 預覽中…'; win.document.body.textContent = '產生 Word 預覽中，請稍候…'; } catch (e2) { /* 跨來源時寫不到，不緊要 */ }
    }
    var busy = serverOptions.snapshotId ? '產生這個版本的 Word 預覽中…'
      : (serverOptions.draft ? '產生 Word 草稿預覽中…' : '產生 Word 預覽中…');
    callServer('apiOpenWordPreview', [state.isoDate, serverOptions], function (resp) {
      if (!resp.ok) {
        if (win) { try { win.close(); } catch (e3) { /* 已關 */ } }
        showMessage('error', resp.error.message);
        return;
      }
      var url = resp.data.url;
      if (resp.data.wordFile && resp.data.kind === 'SAVED') renderWordFileInfo(resp.data.wordFile);
      var opened = false;
      if (win) { try { win.location.href = url; opened = true; } catch (e4) { opened = false; } }
      if (!opened) {
        fallback.href = url;
        fallback.classList.remove('hidden');
      }
      var label = resp.data.kind === 'SNAPSHOT' ? '這個版本的 Word 預覽'
        : (resp.data.kind === 'DRAFT' ? 'Word 草稿預覽（包括未儲存的修改）' : '這一期最新的 Word');
      var warn = (resp.data.warnings && resp.data.warnings.length) ? ('（' + resp.data.warnings.length + ' 項提示，見下面的警告）') : '';
      showMessage('success', (opened ? '已在新分頁開啟' : '已產生') + label + '：' + resp.data.fileName + warn
        + (opened ? '' : '。瀏覽器擋了新分頁，請按「開啟預覽」旁邊的連結。'));
    }, { busyText: busy });
  }

  function triggerBinaryDownload(base64, fileName, mimeType) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

    var url = URL.createObjectURL(new Blob([bytes], { type: mimeType }));
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // 立刻釋放會令部分瀏覽器來不及開始下載，延後一拍。
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  // =====================================================================
  // R-034：兩層主日選單（季度 → 主日）
  // =====================================================================

  /**
   * 用途：勾選／取消勾選「顯示已封存」之後重新載入季度清單（R-035）。
   * Returns:
   *   {void}
   */
  function onShowArchivedChanged() {
    state.showArchived = document.getElementById('showArchivedCheck').checked === true;
    callServer('apiListWeeks', [state.showArchived], onWeeksLoaded, { busyText: '載入中…' });
  }

  /**
   * 用途：畫出（或者收起）「目前沒有未封存的季度」那一句提示（R-035）。
   *
   *   ⚠️ 這一句是這一條功能最重要的防線。沒有它的話，十月回來打開系統
   *   會見到一個**空白的季度下拉**，完全看不出「資料仍然在，只是被封存了」
   *   ——那會令人以為系統把整年的資料弄丟了。
   * Args:
   *   data {Object} `apiListWeeks()` 的 `data`。
   * Returns:
   *   {void}
   */
  function renderQuarterEmptyHint(data) {
    var hint = document.getElementById('quarterEmptyHint');
    var text = (data && data.emptyHint) ? data.emptyHint : '';
    if (!text) {
      hint.classList.add('hidden');
      hint.textContent = '';
      return;
    }
    hint.textContent = text;
    hint.classList.remove('hidden');
  }

  /**
   * 用途：把伺服器送過來的兩層清單存起來，並把兩個下拉都畫好。
   *
   *   ⚠️ 伺服器拿不到 `quarters`（例如季度全部被排除）時要退回舊的一層
   *   清單，不可以令整個下拉變空——切不到主日等於整個介面用不了。
   * Args:
   *   data {Object} `apiListWeeks()` 的 `data`。
   *   defaultIsoDate {?string} 預設落點。
   * Returns:
   *   {void}
   */
  function populateWeekSelectors(data, defaultIsoDate) {
    var quarters = (data && data.quarters) || [];
    state.quarters = quarters;

    if (quarters.length === 0) {
      document.getElementById('quarterSelect').innerHTML = '';
      populateWeekSelect((data && data.weeks) || [], defaultIsoDate);
      return;
    }

    var qSel = document.getElementById('quarterSelect');
    qSel.innerHTML = '';
    quarters.forEach(function (q) {
      var o = el('option');
      o.value = q.quarterId;
      o.textContent = q.label + '（' + q.weeks.length + ' 個主日）';
      qSel.appendChild(o);
    });

    syncSelectorsTo(defaultIsoDate);
  }

  /**
   * 用途：在兩層清單裏找一個主日屬於哪一季。
   * Args:
   *   isoDate {?string} 主日日期。
   * Returns:
   *   {?string} 找不到回 null。
   */
  function quarterIdOfIsoDate(isoDate) {
    if (!isoDate) return null;
    var quarters = state.quarters || [];
    for (var i = 0; i < quarters.length; i++) {
      for (var j = 0; j < quarters[i].weeks.length; j++) {
        if (quarters[i].weeks[j].isoDate === isoDate) return quarters[i].quarterId;
      }
    }
    return null;
  }

  /**
   * 用途：把兩個下拉對準某一個主日。直接跳轉（例如由網址帶主日參數、或者
   *   程式碼直接呼叫 `loadWeek()`）之後就是靠這一個把季度下拉一併校正。
   *
   *   ⚠️ 這個函式**只改下拉的顯示**，不會觸發載入。切換主日一律走
   *   `loadWeek()`，兩件事分開才不會互相引發無限迴圈。
   * Args:
   *   isoDate {?string} 要對準的主日。
   * Returns:
   *   {void}
   */
  function syncSelectorsTo(isoDate) {
    var quarters = state.quarters || [];
    if (quarters.length === 0) return;

    var quarterId = quarterIdOfIsoDate(isoDate);
    if (quarterId === null) quarterId = quarters[0].quarterId;

    var qSel = document.getElementById('quarterSelect');
    if (qSel.value !== quarterId) qSel.value = quarterId;

    renderWeekOptionsForQuarter(quarterId, isoDate);
  }

  /**
   * 用途：畫出某一季的主日下拉選項，每一項帶狀態標記。
   * Args:
   *   quarterId {string} 季度 ID。
   *   selectedIsoDate {?string} 要選中的主日；不屬於這一季就選第一項。
   * Returns:
   *   {void}
   */
  function renderWeekOptionsForQuarter(quarterId, selectedIsoDate) {
    var group = null;
    (state.quarters || []).forEach(function (q) { if (q.quarterId === quarterId) group = q; });

    var sel = document.getElementById('weekSelect');
    sel.innerHTML = '';
    if (group === null) return;

    var hasSelected = false;
    group.weeks.forEach(function (w) {
      var o = el('option');
      o.value = w.isoDate;
      o.textContent = w.selectorLabel || w.label;
      if (w.isoDate === selectedIsoDate) { o.selected = true; hasSelected = true; }
      sel.appendChild(o);
    });
    if (!hasSelected && group.weeks.length > 0) sel.selectedIndex = 0;
  }

  /**
   * 用途：把兩層清單攤平成一條由早到遲的主日陣列，供上一個／下一個箭嘴
   *   跨季移動用。
   * Returns:
   *   {Object[]}
   */
  function flatWeeksInOrder() {
    var all = [];
    (state.quarters || []).forEach(function (q) {
      q.weeks.forEach(function (w) { all.push(w); });
    });
    all.sort(function (a, b) {
      if (a.isoDate < b.isoDate) return -1;
      if (a.isoDate > b.isoDate) return 1;
      return 0;
    });
    return all;
  }

  /**
   * 用途：上一個／下一個主日。到季度邊界時自動跨到上／下一季。
   * Args:
   *   step {number} `-1` 上一個、`+1` 下一個。
   * Returns:
   *   {void}
   */
  function stepWeek(step) {
    var all = flatWeeksInOrder();
    if (all.length === 0) return;

    var index = -1;
    for (var i = 0; i < all.length; i++) {
      if (all[i].isoDate === state.isoDate) { index = i; break; }
    }
    if (index === -1) return;

    var next = index + step;
    if (next < 0 || next >= all.length) {
      showMessage('info', step < 0 ? '已經是最早的一個主日。' : '已經是最後一個主日。');
      return;
    }
    var target = all[next].isoDate;
    confirmWeekChange(function () { loadWeek(target); }, function () { syncSelectorsTo(state.isoDate); });
  }

  /**
   * 用途：主日下拉一改，載入選中的那一週（有未儲存的改動先問一次）。
   * Args:
   *   isoDate {string} 下拉選中的主日。
   * Returns:
   *   {void}
   */
  function onWeekSelectChanged(isoDate) {
    confirmWeekChange(function () { loadWeek(isoDate); }, function () { syncSelectorsTo(state.isoDate); });
  }

  /**
   * 用途：季度下拉一改，就把主日下拉換成該季，並載入該季第一個主日
   *   （有未儲存的改動先問一次；取消就把兩個下拉改回目前這一週）。
   * Returns:
   *   {void}
   */
  function onQuarterChanged() {
    var quarterId = document.getElementById('quarterSelect').value;
    confirmWeekChange(function () {
      renderWeekOptionsForQuarter(quarterId, null);
      var sel = document.getElementById('weekSelect');
      if (sel.options.length > 0) loadWeek(sel.options[0].value);
    }, function () { syncSelectorsTo(state.isoDate); });
  }

  // =====================================================================
  // R-036：職事表未有資料的黃色橫幅與「補抓空白的事奉欄位」
  // =====================================================================

  /**
   * 用途：畫出（或收起）職事表未有資料的黃色橫幅。
   * Args:
   *   banner {?Object} `{show:boolean, text:string}`；沒有就當不顯示。
   * Returns:
   *   {void}
   */
  function renderRosterGapBanner(banner) {
    var bar = document.getElementById('rosterGapBar');
    if (!banner || banner.show !== true) {
      bar.classList.add('hidden');
      bar.textContent = '';
      return;
    }
    bar.textContent = banner.text || '';
    bar.classList.remove('hidden');
  }

  /**
   * 用途：把本季在職事表已經有、而週報仍然空白的事奉格補抓回來。
   *
   *   ⚠️ 職事表仍然找不到**不是**錯誤——伺服器會回 `ok`、`rosterFound`
   *   為 false 加一句說明，這裏用一般提示（不是紅色）顯示。
   * Returns:
   *   {void}
   */
  function backfillRoster() {
    if (!state.quarterId) {
      showMessage('error', '未知道目前是哪一季，請先揀一個主日。');
      return;
    }
    callServer('apiBackfillRoster', [state.quarterId], function (resp) {
      if (!resp.ok) { showMessage('error', resp.error.message); return; }
      var data = resp.data;
      showMessage(data.rosterFound === true ? 'success' : 'info', data.message);
      // 補抓之後事奉欄位與橫幅都可能變了，重新載入這一期。
      if (state.isoDate) loadWeek(state.isoDate, { keepMessage: true });
    }, { busyText: '補抓空白欄位中…' });
  }

  // =====================================================================
  // 初始化
  // =====================================================================

  function wireStaticEvents() {
    document.getElementById('weekSelect').addEventListener('change', function (e) { onWeekSelectChanged(e.target.value); });
    document.getElementById('quarterSelect').addEventListener('change', onQuarterChanged);
    document.getElementById('showArchivedCheck').addEventListener('change', onShowArchivedChanged);
    document.getElementById('prevWeekBtn').addEventListener('click', function () { stepWeek(-1); });
    document.getElementById('nextWeekBtn').addEventListener('click', function () { stepWeek(1); });
    document.getElementById('backfillRosterBtn').addEventListener('click', backfillRoster);
    document.getElementById('saveBtn').addEventListener('click', saveWeek);
    // v3：每一個可以輸入的區塊右上角都有一粒「儲存」，與頂部那一粒同一個動作（儲存整個主日）。
    var sectionSaves = document.querySelectorAll('[data-save-button]');
    for (var si = 0; si < sectionSaves.length; si++) {
      if (sectionSaves[si].id === 'saveBtn') continue;
      sectionSaves[si].addEventListener('click', function () { saveWeek(); });
    }
    document.getElementById('copyPreviewLinkBtn').addEventListener('click', function () { copyPreviewLink(); });
    // v3：程序表「＋」加一項的小表格。
    document.getElementById('programAddOkBtn').addEventListener('click', confirmProgramAdd);
    document.getElementById('programAddCancelBtn').addEventListener('click', closeProgramAddForm);
    document.getElementById('statMissing').addEventListener('click', function () {
      document.getElementById('missingPanel').classList.toggle('hidden');
    });
    // D-11：警告徽章與另外兩個看齊。
    document.getElementById('statWarnings').addEventListener('click', function () {
      document.getElementById('warningsPanel').classList.toggle('hidden');
    });
    document.getElementById('statConflicts').addEventListener('click', function () {
      document.getElementById('conflictPanel').classList.toggle('hidden');
    });

    // v3：「由職事表重新取數」＝重新讀取職事表、講出你填的與職事表不同的崗位，不覆寫任何一格；
    //    「以職事表覆寫我的修改…」才會把你改過的名字改回職事表的名字（先列出、勾選、確定）。
    document.getElementById('fetchFromRosterBtn').addEventListener('click', function () { reloadRosterOnly(); });
    document.getElementById('overwriteFromRosterBtn').addEventListener('click', function () { openFetchFromRosterDialog(); });
    document.getElementById('fetchCancelBtn').addEventListener('click', cancelFetchFromRoster);
    document.getElementById('fetchConfirmBtn').addEventListener('click', confirmFetchFromRoster);
    document.getElementById('fetchSelectAllBtn').addEventListener('click', function () { setAllFetchCheckboxes(true); });
    document.getElementById('fetchSelectNoneBtn').addEventListener('click', function () { setAllFetchCheckboxes(false); });

    // ---- 發佈及匯出 ----
    document.getElementById('doPublishCheck').addEventListener('change', function () {
      applyPublishSubStates();
      savePublishPrefs();
    });
    document.getElementById('doSendCheck').addEventListener('change', function () {
      applyPublishSubStates();
      savePublishPrefs();
    });
    document.getElementById('publishPdfInput').addEventListener('change', onPublishPdfChosen);
    document.getElementById('publishRunBtn').addEventListener('click', function () { runPublish(false); });
    document.getElementById('downloadWordBtn').addEventListener('click', downloadWord);
    document.getElementById('previewLink').addEventListener('click', function () { openWordPreview(null); });
    document.getElementById('snapshotPreviewLink').addEventListener('click', function () {
      var id = selectedSnapshotId();
      if (id) openWordPreview({ snapshotId: id });
    });
    // 階段 2：版本記錄（摺疊區塊打開時才向伺服器取）。
    document.getElementById('snapshotPanel').addEventListener('toggle', function () {
      if (isSnapshotPanelOpen() && state.isoDate && state.snapshotsLoadedFor !== state.isoDate) loadSnapshotPanel();
    });
    document.getElementById('resetWeekBtn').addEventListener('click', onResetWeekClicked);
    // v3：版本下拉＋三粒按鈕（預覽是一條連結，揀版本時更新）。
    document.getElementById('snapshotSelect').addEventListener('change', function () {
      document.getElementById('snapshotDiffBox').classList.add('hidden');
      updateSnapshotButtons();
    });
    document.getElementById('snapshotDiffBtn').addEventListener('click', function () {
      var id = selectedSnapshotId();
      if (id) onSnapshotDiffClicked(id);
    });
    document.getElementById('snapshotRestoreBtn').addEventListener('click', function () {
      var id = selectedSnapshotId();
      if (id) onSnapshotRestoreClicked(id);
    });
    document.getElementById('confirmOkBtn').addEventListener('click', function () {
      // G25：處理中不算數（按鈕已停用；這裏是第二道）。
      if (state.inFlight > 0) return;
      settleConfirmDialog(true);
    });
    document.getElementById('confirmCancelBtn').addEventListener('click', function () { settleConfirmDialog(false); });
    // v3：三選一對話框的第三粒。
    document.getElementById('confirmAltBtn').addEventListener('click', function () {
      if (state.inFlight > 0) return;
      chooseConfirmDialogAlt();
    });
    document.addEventListener('keydown', onConfirmDialogKeydown);
    document.getElementById('publishConfirmCancelBtn').addEventListener('click', cancelPublishConfirm);
    document.getElementById('publishConfirmOkBtn').addEventListener('click', function () { runPublish(true); });
    // 勾了那一格才可以撳「確認發佈」——R-006／R-007 明文要求。
    document.getElementById('publishForcedCheck').addEventListener('change', function (e) {
      // G25：處理中不可以因為勾了一下就重新啟用「確認發佈」。
      document.getElementById('publishConfirmOkBtn').disabled = state.inFlight > 0 || !e.target.checked;
    });

    // ⚠️ R-011 起，四張清單改由內容表輸入，「新增一則…」那幾顆按鈕已經由
    // Index.html 移走，所以這裡不再綁事件。`addListItem()` 等函式保留，
    // 日後如果有某一張表要改回可編輯，接返上去即可。

    document.addEventListener('input', function (e) {
      var target = e.target;
      if (target && target.hasAttribute && target.hasAttribute('data-field')) {
        state.week[target.getAttribute('data-field')] = target.value;
        var changedField = target.getAttribute('data-field');
        if (changedField === 'FLOWER_THIS_WEEK' || changedField === 'FLOWER_NEXT_WEEK') {
          renderFlowerHints(state.flowerRoster);
        }
        schedulePreviewRefresh();
      }
      // v3：任何輸入（包括事奉框）之後更新「有未儲存的修改」提示。
      refreshUnsavedIndicator();
    });
    // v3：下拉（程序範本、誦讀）改了、以及按了「還原」「保留我的」「×」等按鈕之後，亦更新提示。
    //    用 setTimeout 等那一下按鈕自己的處理做完才判斷。
    document.addEventListener('change', function () { refreshUnsavedIndicator(); });
    document.addEventListener('click', function () { setTimeout(function () { refreshUnsavedIndicator(); }, 0); });
    // v3：有未儲存的修改而離開或重新整理頁面時，瀏覽器先問一次（嵌入框不准時就沒有提示，不影響其他功能）。
    window.addEventListener('beforeunload', function (e) {
      if (!hasUnsavedWeekChanges()) return undefined;
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
  }

  /**
   * 用途：捕捉前端沒有被任何 try/catch 接住的例外（一般執行錯誤與未處理
   *   的 Promise rejection），顯示紅色橫幅並回報 ErrorLog——理由同
   *   callServer() 的失敗處理：Apps Script 執行紀錄看不到前端發生了什麼事，不記
   *   下來就沒有人知道。
   * Returns:
   *   {void}
   */
  function wireGlobalErrorHandlers() {
    window.onerror = function (message, source, lineno, colno, error) {
      var text = '前端發生未預期的錯誤：' + message;
      showMessage('error', text);
      reportClientError_(
        text,
        error && error.stack ? String(error.stack).split('\n').slice(0, 5).join('\n') : (source + ':' + lineno + ':' + colno),
        'window.onerror'
      );
      return false;
    };

    window.onunhandledrejection = function (event) {
      var reason = event && event.reason;
      var text = '前端發生未處理的錯誤：' + (reason && reason.message ? reason.message : String(reason));
      showMessage('error', text);
      reportClientError_(
        text,
        reason && reason.stack ? String(reason.stack).split('\n').slice(0, 5).join('\n') : '',
        'window.onunhandledrejection'
      );
    };
  }

  function init() {
    wireGlobalErrorHandlers();
    wireStaticEvents();
    document.getElementById('missingPanel').classList.add('hidden');
    document.getElementById('conflictPanel').classList.add('hidden');
    applyBusyState();
    loadPublishPanel();
    // v3：第一次載入時順手檢查職事表有沒有新季度（有就自動建立該季週報與內容表）。
    callServer('apiListWeeks', [state.showArchived, { autoCreate: true }], onWeeksLoaded,
      { busyText: '載入中…（順便檢查職事表有沒有新的季度）' });
  }

  function onWeeksLoaded(resp) {
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    renderAutoCreateNotice(resp.data.autoCreateNotice);
    renderQuarterEmptyHint(resp.data);
    populateWeekSelectors(resp.data, resp.data.defaultIsoDate);
    if (resp.data.defaultIsoDate) {
      loadWeek(resp.data.defaultIsoDate);
    } else if (resp.data.emptyHint) {
      // ⚠️ 「全部季度都封存咗」與「一條資料都沒有」是兩件事，
      //    訊息要分得出——前者撳一下勾選格就見得返。
      showMessage('info', resp.data.emptyHint);
    } else {
      showMessage('error', '目前沒有任何主日資料。請先在試算表用選單「建立本季空白週報」建立骨架。');
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
