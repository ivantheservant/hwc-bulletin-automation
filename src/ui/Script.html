<script>
(function () {
  'use strict';

  // 目前這個主日的完整狀態。刻意不用 localStorage／sessionStorage——
  // 重新整理頁面就是要重新從伺服器讀最新資料，不應該有任何本地殘留狀態。
  //
  // `loaded`：只有 apiLoadWeek() 成功過才是 true。載入失敗時表單全部
  // 空白，若這時候仍然可以儲存，就會把工作表上既有的內容全部覆蓋成
  // 空白——所以「儲存」按鈕的可用狀態完全跟著這個旗標走，見 applyBusyState()。
  //
  // `inFlight`：目前進行中的「會令使用者等待、要停用介面」的請求數
  // （載入、儲存、重新讀取職事表）。**刻意是計數器，不是 boolean**——
  // 理論上同一時間可能有一個以上的這類請求排隊，用 boolean 會在其中
  // 一個結束時把整個忙碌狀態誤關掉。
  //
  // `previewInFlight`：即時預覽（apiPreviewProgram）自己的忙碌計數器，
  // 刻意跟 `inFlight` 分開——預覽每次打字都會觸發，不可以停用整個介面
  // （尤其不可以停用輸入框本身，否則使用者會打不了字），只顯示一個
  // 小小的「更新中」提示。
  var state = {
    isoDate: null,
    // R-035：有沒有勾「顯示已封存」。⚠️ 刻意不記進 localStorage——
    // 重新整理頁面就應該回到預設（只看未封存那幾季），見 state 的說明。
    showArchived: false,
    // R-034：兩層下拉的資料（季度 → 主日）與目前這一期屬於哪一季。
    quarters: [],
    quarterId: null,
    lastSavedAt: null,
    loaded: false,
    inFlight: 0,
    previewInFlight: 0,
    week: {},
    // F1：表單各欄位「載入完成那一刻」的值（機器鍵 → 值）。儲存時只送跟它
    // 不同的欄位，並把它們的載入值當作 `baseWeek` 一併送去後端做三方比較。
    // ⚠️ 不可以拿 `state.week` 代替——`state.week` 在使用者打字時會跟著改。
    loadedWeek: {},
    // 階段 1：後端算好的職事表獻花名字，獻花欄位旁邊的提示用。
    flowerRoster: { thisWeek: '', nextWeek: '' },
    // 階段 2：版本記錄區塊現時載入的是哪一個主日（null＝還沒載入或需要重新載入）。
    snapshotsLoadedFor: null,
    // 階段 3：講員表格現況（apiGetSpeakerFormStatus 的結果）。
    speakerForm: null,
    lists: { announcements: [], prayers: [], fellowships: [], finance: [] },
    // 第六輪：事奉框每一格目前的值，鍵是「崗位#位次」。儲存時整批送回
    // 伺服器，由 computeDutyOverridePlan_() 決定哪幾格真的需要寫
    // DutyOverride（與職事表現值相同的格子不會產生記錄）。
    dutyEdits: {},
    // R-040：下週事奉那一框的編輯。**刻意與 dutyEdits 分開**——共用一個
    // map 的話，同一個崗位在兩框各有一格，後者會蓋走前者，而後端亦分不出
    // 應該用哪一個主日去寫。
    nextWeekDutyEdits: {},
    // 換週保護：載入完成那一刻兩個事奉框各格的名字（鍵同上面兩個 edits map），
    // 之後使用者有沒有改動，就是拿 edits map 與這兩份比。
    loadedDutyNames: {},
    loadedNextDutyNames: {},
    // 「由職事表重新取數」對話框目前列出的候選項目。
    fetchCandidates: [],
    // R-038：「季度作業」區塊的現況（季度、DRY_RUN、內容表）。
    // ⚠️ 第一次展開才拿——每次開介面都拿一次，是為一個一季用一次的
    // 區塊付每日的代價。`null` 代表「未拿過」，不是「拿不到」。
    quarterOps: null,
    // R-002 至 R-008：發佈及匯出。`pdfBase64` 是使用者剛選的 PDF，
    // **刻意只放在記憶體、不寫任何本地儲存**——重新整理頁面就要重新選
    // 一次檔案，比起「以為上次選的還在、其實發佈了一個舊 PDF」安全得多。
    // `pdfIsoDate` 是揀那個 PDF 時畫面上的主日（G9）：換了主日就不可以拿它發佈。
    publish: { pdfBase64: '', pdfName: '', pdfIsoDate: '', panel: null, confirmButton: '' },
    options: { programTemplateIds: [], recitationOptions: [], prayerBlockHeadingOptions: [], cantoneseSubColumnLabel: '主堂' }
  };

  var LIST_DEFS = {
    announcements: {
      containerId: 'announcementsList',
      fields: [{ key: 'TEXT', type: 'textarea', placeholder: '家事報告內容' }]
    },
    prayers: {
      containerId: 'prayersList',
      fields: [{ key: 'TEXT', type: 'textarea', placeholder: '代禱事項內容' }]
    },
    fellowships: {
      containerId: 'fellowshipsList',
      fields: [
        { key: 'FELLOWSHIP_NAME', type: 'text', placeholder: '團契' },
        { key: 'MEETING_DATE', type: 'text', placeholder: '日期' },
        { key: 'MEETING_TIME', type: 'text', placeholder: '時間' },
        { key: 'CONTENT', type: 'text', placeholder: '週會內容' }
      ]
    },
    finance: {
      containerId: 'financeList',
      fields: [
        { key: 'ROW_LABEL', type: 'text', placeholder: '項目' },
        { key: 'COL_SPECIAL_OVERSEAS', type: 'text', placeholder: '特殊海外奉獻' },
        { key: 'COL_HARDSHIP', type: 'text', placeholder: '慈惠' }
      ]
    }
  };

  var previewTimer = null;

  // =====================================================================
  // 小工具
  // =====================================================================

  function escapeHtml(text) {
    return String(text === null || text === undefined ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function el(tag, className) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    return node;
  }

  // BEGIN message-bar
  /**
   * 顯示頂部訊息橫幅。`type` 是 `'success'`／`'info'`／`'error'` 其中一個
   * （對應 Style.html 的 `.message-bar.xxx`）。
   *
   * 三種訊息一律常駐，右邊都有一個「×」：保留到使用者按「×」、或者
   * 開始做下一個動作（各動作開頭都會呼叫 `hideMessage()`）為止，不會自己
   * 消失。事故經過：成功訊息原本幾秒後自己淡出，使用者的視線還沒有從按鈕
   * 移到橫幅，訊息已經不見，等於沒有回饋（見 docs/已知bug類型.md「成功訊息
   * 被緊接的重新載入清走」）。
   * Args:
   *   type {string} `'success'`／`'info'`／`'error'`。
   *   text {string} 訊息內容（一律用 textContent 顯示）。
   * Returns:
   *   {void}
   */
  function showMessage(type, text) {
    var bar = document.getElementById('messageBar');
    bar.className = 'message-bar ' + type;
    bar.innerHTML = '';

    var textSpan = el('span');
    textSpan.textContent = text;
    bar.appendChild(textSpan);

    var closeBtn = el('button', 'message-bar-close');
    closeBtn.type = 'button';
    closeBtn.textContent = '×';
    closeBtn.setAttribute('aria-label', '關閉');
    closeBtn.addEventListener('click', hideMessage);
    bar.appendChild(closeBtn);

    bar.classList.remove('hidden');
  }

  /**
   * 用途：收起頂部訊息橫幅（按「×」，或者各動作開始時呼叫）。
   * Args: （無）
   * Returns:
   *   {void}
   */
  function hideMessage() {
    document.getElementById('messageBar').classList.add('hidden');
  }
  // END message-bar

  /** `lastSavedAt` 一律是伺服器 canonicalSaveToken_() 正規化過的字串，前端直接顯示即可，不需要自己解析。 */
  function formatTimestamp(v) {
    return v ? v : '（尚未儲存）';
  }

  /** `apiLoadWeek()` 成功才可以撳「儲存」——理由見 state.loaded 的註解。實際的按鈕停用邏輯統一在 applyBusyState()。 */
  function setLoaded(isLoaded) {
    state.loaded = isLoaded;
    applyBusyState();
  }

  /**
   * 用途：全域忙碌狀態的**唯一**顯示邏輯。`state.inFlight`／
   *   `state.previewInFlight` 兩個計數器有變動之後，一律呼叫這個函式
   *   套用到畫面，不要在別的地方另外直接操作 disabled／樣式——避免
   *   「兩個地方各自決定同一顆按鈕能不能撳」這種容易兜不攏的寫法。
   *
   *   | 狀態 | 表現 |
   *   |---|---|
   *   | `inFlight > 0` | 頂部忙碌指示列、主日下拉／「儲存」／「重新讀取職事表」全部停用、內容區加半透明遮罩 |
   *   | `inFlight === 0` 且 `loaded === false` | 只停用「儲存」，其餘可用 |
   *   | `inFlight === 0` 且 `loaded === true` | 全部可用 |
   *
   *   即時預覽的忙碌（`previewInFlight`）完全不影響上面這些——只控制
   *   一個小提示的顯示與否，輸入框永遠不會因為預覽而被停用。
   * Returns:
   *   {void}
   */
  function applyBusyState() {
    var busy = state.inFlight > 0;

    var busyBar = document.getElementById('busyBar');
    if (busy) busyBar.classList.remove('hidden'); else busyBar.classList.add('hidden');

    var mainContent = document.getElementById('mainContent');
    if (busy) mainContent.classList.add('is-busy'); else mainContent.classList.remove('is-busy');

    document.getElementById('weekSelect').disabled = busy;
    document.getElementById('quarterSelect').disabled = busy;
    document.getElementById('showArchivedCheck').disabled = busy;
    document.getElementById('prevWeekBtn').disabled = busy;
    document.getElementById('nextWeekBtn').disabled = busy;
    document.getElementById('backfillRosterBtn').disabled = busy;
    document.getElementById('reloadRosterBtn').disabled = busy;
    document.getElementById('fetchFromRosterBtn').disabled = busy || !state.loaded;
    document.getElementById('saveBtn').disabled = busy || !state.loaded;
    // F9：頁內確認對話框的兩粒按鈕，處理中一併停用。
    document.getElementById('confirmOkBtn').disabled = busy;
    document.getElementById('confirmCancelBtn').disabled = busy;

    var previewIndicator = document.getElementById('previewBusyIndicator');
    if (state.previewInFlight > 0) previewIndicator.classList.remove('hidden');
    else previewIndicator.classList.add('hidden');
  }

  function setBusyText(text) {
    document.getElementById('busyBarText').textContent = text;
  }

  /**
   * 用途：發出一個「會停用整個介面」的請求前呼叫。
   *
   *   ⚠️ 只由 `callServer()` 呼叫，不要在別處直接叫（唯一例外是它的補救
   *   recoverAfterNoResponse()，同一支函式內成對呼叫，見第二批測試修正 G13）。它跟
   *   `endRequest()` 必須成對，而「成對」這件事以前靠每一個處理函式
   *   自己記得在最前面減一次——只要有一個分支提早 `return`，或者有
   *   一個呼叫忘了寫失敗處理，`inFlight` 就會卡住、介面永遠停用。
   *   現在改為由 `callServer()` 一處負責，成功、失敗、逾時三條路徑
   *   都經同一個 `settle()`，所以只可能減一次，也不可能漏。
   * Args:
   *   text {string} 忙碌指示列要顯示的文字（例如「載入中…」）。
   * Returns:
   *   {void}
   */
  function beginRequest(text) {
    state.inFlight++;
    setBusyText(text);
    applyBusyState();
  }

  function endRequest() {
    state.inFlight = Math.max(0, state.inFlight - 1);
    applyBusyState();
  }

  /** 即時預覽自己的忙碌計數器，跟 beginRequest()／endRequest() 分開，理由見 state 的註解。 */
  function beginPreview() {
    state.previewInFlight++;
    applyBusyState();
  }

  function endPreview() {
    state.previewInFlight = Math.max(0, state.previewInFlight - 1);
    applyBusyState();
  }

  // =====================================================================
  // callServer()：**全部**伺服器呼叫的唯一入口
  // =====================================================================
  //
  // ⚠️ 為什麼一定要統一：`google.script.run` 的 `withFailureHandler` 是
  // 可以不寫的，而不寫的後果是**後端拋的錯全部人間蒸發**——使用者只會
  // 見到轉圈結束、視窗還開著、甚麼都沒有發生，然後再按一次。實際發生過
  // 的事故正正是這樣（見 docs/已知bug類型.md 事故二十五）。
  //
  // 而且 `google.script.run` **沒有逾時**：伺服器那一邊如果卡住（拿不到
  // 鎖、Drive 慢、6 分鐘上限），成功與失敗兩個處理函式都不會被呼叫，
  // 介面就永遠停在忙碌狀態。所以這裏自己加一個計時器。
  //
  // 每一個呼叫都經這裏，就只有一處會寫漏。

  // BEGIN call-server（測試會把這一段抽出來執行；用到的其他函式由測試提供替身）
  /**
   * 用途：讀出 Config `WEBAPP_CALL_TIMEOUT_SEC`（由 doGet 放進
   *   `#app` 的 data 屬性）。讀不到就用 120 秒。
   * Returns:
   *   {number} 毫秒。
   */
  function serverCallTimeoutMs() {
    var raw = document.getElementById('app').getAttribute('data-call-timeout-sec');
    var seconds = parseInt(raw, 10);
    if (!(seconds > 0)) seconds = 120;
    return seconds * 1000;
  }

  /**
   * 用途：把失敗（例外或逾時）整理成一句人看得懂、而且**看得到後端訊息**
   *   的文字。
   *
   *   ⚠️ 只取前 300 字：後端的例外訊息可能很長（含堆疊），整段塞進一條
   *   橫幅會把畫面推爆，反而看不到重點。完整內容在 `ErrorLog`。
   * Args:
   *   fnName {string} 伺服器函式名稱。
   *   err {*} 例外物件。
   * Returns:
   *   {string}
   */
  /**
   * 用途：把例外的堆疊縮成頭 5 行，供 `ErrorLog.DETAIL` 用。
   *   ⚠️ 只可以放技術性內容，不可以夾帶電郵或表單完整內容。
   * Args:
   *   err {*} 例外物件。
   * Returns:
   *   {string}
   */
  function stackSummary(err) {
    if (!err || !err.stack) return '';
    return String(err.stack).split('\n').slice(0, 5).join('\n');
  }

  function describeServerFailure(fnName, err) {
    var raw = (err && err.message) ? String(err.message) : String(err);
    if (raw.length > 300) raw = raw.slice(0, 300) + '…（訊息過長，完整內容請看 ErrorLog）';
    return '呼叫伺服器失敗（' + fnName + '）：' + raw;
  }

  /**
   * 用途：第二批測試修正 G13：寫入類動作的清單，以及「伺服器沒有回應」之後要重新
   *   載入哪些區塊。鍵是伺服器函式名稱，值是重新載入的種類：
   *     keepForm：只有儲存。不等候、不重新載入，表單上的改動與未儲存的狀態保留，
   *       「儲存」即時可以再按（見下面的說明）；
   *     week：重新載入這一個主日，並刷新主日下拉的標籤；
   *     publish：同 week，另外重新載入頁頂「目前已發佈」；
   *     speakerForm：重新載入「講員表格」區塊；
   *     quarterOps：重新載入「季度作業」區塊；
   *     quarterImport：同 quarterOps，另外重新載入這一個主日。
   *   每一種重新載入的，就是該動作成功之後會刷新的區塊（發佈另加這一個主日，
   *   版本記錄內有「已發佈」一段）。
   *
   *   儲存不重新載入（docs/待確認事項.md FF-13）：儲存其實沒有到達伺服器的話，重新
   *   載入會把幹事畫面上未儲存的改動換走；其實已經完成的話，再按一次「儲存」會被
   *   樂觀鎖擋下（STALE，「這一週的資料在你載入之後被改過」），不會重複寫入。
   *
   *   刻意不在清單內的：讀取類（載入、預覽、差異、報告、現況），以及
   *     apiDownloadBulletinDocx：Word 檔要經瀏覽器下載，沒有回應就是沒有收到檔案，要再按一次；
   *     apiSavePublishPrefs：只是記住勾選，失敗也不打擾使用者；
   *     apiLogClientError：回報錯誤本身。
   *   後三個另列在 NOT_READ_ONLY_OUTSIDE_RECOVERY（G17：逾時訊息與讀取類不同）。
   *   新增一個會寫入的 api 函式時要在這裏加一行；tests/writeaction.test.js 把
   *   Script.html 用到的每一個 api 名稱分成寫入與讀取兩類，漏了分類會失敗。
   */
  var WRITE_ACTION_RECOVERY = {
    apiSaveWeek: 'keepForm',
    apiRestoreWeekSnapshot: 'week',
    apiResetWeek: 'week',
    apiRunContentImport: 'week',
    apiFetchFromRoster: 'week',
    apiBackfillRoster: 'week',
    apiRunPublish: 'publish',
    apiCreateSpeakerForm: 'speakerForm',
    apiRefreshSpeakerFormDates: 'speakerForm',
    apiRunCreateWeeks: 'quarterOps',
    apiRunContentSheetBuild: 'quarterOps',
    apiRunContentSheetInvite: 'quarterOps',
    apiRunQuarterContentImport: 'quarterImport'
  };

  /**
   * 用途：第二批測試修正 G13：「伺服器沒有回應（api 名稱），」之後的一句（可能已經
   *   完成、重新載入了甚麼、要先看哪裏），按重新載入的種類分。每一個種類都要有一句
   *   （測試逐個核對）。
   */
  var NO_RESPONSE_CHECK_HINTS = {
    keepForm: '儲存可能已經完成，你的改動仍在畫面上。請再按一次「儲存」：如果系統說「這一週的資料在你載入之後被改過」，即是上一次已經存好，重新載入這一週就會見到。',
    week: '這個動作可能已經完成。系統已重新載入這一個主日，請先看「最後儲存時間」和「版本記錄」，確認未完成才再做一次。',
    publish: '這個動作可能已經完成。系統已重新載入這一個主日，請先看「最後儲存時間」和「版本記錄」，確認未完成才再做一次。',
    speakerForm: '這個動作可能已經完成。系統已重新載入講員表格的現況，請先看「講員表格」區塊，確認未完成才再做一次。',
    quarterOps: '這個動作可能已經完成。系統已重新載入季度作業的現況，請先看「季度作業」區塊，確認未完成才再做一次。',
    quarterImport: '這個動作可能已經完成。系統已重新載入這一個主日和季度作業的現況，請先看「季度作業」區塊，確認未完成才再做一次。'
  };

  /**
   * 用途：第二批測試修正 G13：沒有回應之後，等多久才重新載入（毫秒）。
   *
   *   伺服器在前端收到連線錯誤之後往往仍在處理：2026-10-22 那一次，前端在第 17 秒
   *   收到 HTTP 502，伺服器在第 27.6 秒才完成還原。即時重新載入會讀到未完成的內容，
   *   幹事看見「最後儲存時間」未變，就會再做一次，正正是要避免的事。等候期間介面
   *   維持忙碌，不可以再按。暫時寫在這裏，是否改成 Config 見 docs/待確認事項.md FF-11。
   */
  var NO_RESPONSE_RELOAD_DELAY_MS = 20000;

  /** 第二批測試修正 G13：寫入類動作沒有回應時，ErrorLog 的 CLIENT_ERROR 內容後面加的一句。 */
  var NO_RESPONSE_LOG_NOTE = '（連線錯誤，動作可能已完成）';

  /** 第二批測試修正 G13：看來是連線／傳輸問題的錯誤訊息（見 isNoResponseFailure()）。 */
  var NO_RESPONSE_PATTERN = /NetworkError|HTTP\s*5\d\d|time(d)?\s*out|Failed to fetch|Connection failure/i;

  /**
   * 用途：第二批測試修正 G13：這個伺服器函式是不是寫入類；是的話回傳「沒有回應」
   *   之後要重新載入的種類。
   * Args:
   *   fnName {string} 伺服器函式名稱。
   * Returns:
   *   {string} WRITE_ACTION_RECOVERY 的值；讀取類回空字串。
   * Raises:
   *   （無）
   */
  function writeActionRecoveryKind(fnName) {
    return Object.prototype.hasOwnProperty.call(WRITE_ACTION_RECOVERY, fnName) ? WRITE_ACTION_RECOVERY[fnName] : '';
  }

  /**
   * 用途：第二批測試修正 G17：不在 WRITE_ACTION_RECOVERY 內、但不是純讀取的三個 api，
   *   以及它們逾時時用哪一句（見 describeCallTimeout()）：
   *     download：apiDownloadBulletinDocx。伺服器會把這一期的 Word 原地更新到雲端硬碟
   *       （同一個檔案，連結不變）、記下檔案 ID 與 AuditLog，內容有變時存一個版本；但幹事
   *       要的檔案經瀏覽器下載，沒有回應就是沒有收到。再按一次只會再原地更新同一個檔案。
   *     quiet：apiSavePublishPrefs（記住勾選）、apiLogClientError（回報錯誤本身）。會寫入，
   *       但失敗不打擾使用者，逾時照舊用「可能已經做了」那一句，只記 ErrorLog。
   *   其餘不在 WRITE_ACTION_RECOVERY 內的 api 都是讀取類。
   */
  var NOT_READ_ONLY_OUTSIDE_RECOVERY = {
    apiDownloadBulletinDocx: 'download',
    apiSavePublishPrefs: 'quiet',
    apiLogClientError: 'quiet'
  };

  /**
   * 用途：第二批測試修正 G17：這個伺服器函式屬哪一類。
   * Args:
   *   fnName {string} 伺服器函式名稱。
   * Returns:
   *   {string} 'write'（WRITE_ACTION_RECOVERY 內）、'download'、'quiet'
   *     （NOT_READ_ONLY_OUTSIDE_RECOVERY 內），其餘是 'read'。
   * Raises:
   *   （無）
   */
  function serverCallKind(fnName) {
    if (writeActionRecoveryKind(fnName)) return 'write';
    if (Object.prototype.hasOwnProperty.call(NOT_READ_ONLY_OUTSIDE_RECOVERY, fnName)) {
      return NOT_READ_ONLY_OUTSIDE_RECOVERY[fnName];
    }
    return 'read';
  }

  /**
   * 用途：第二批測試修正 G17：callServer() 自己逾時（serverCallTimeoutMs() 之內沒有回應）
   *   的訊息，按 serverCallKind() 分。
   *
   *   以前一律講「這一次的動作可能已經做了、也可能沒有做」。唯讀的載入（例如講員表格現況）
   *   逾時也這樣講，幹事會以為改了東西，所以讀取類改講「沒有改動任何東西」；下載 Word 講
   *   沒有下載到。寫入類與 quiet 照舊（寫入類給使用者看的是 describeNoResponseFailure()，
   *   這一句只記入 ErrorLog）。
   * Args:
   *   fnName {string} 伺服器函式名稱。
   *   seconds {number} 逾時秒數（serverCallTimeoutMs() 換算）。
   * Returns:
   *   {{text:string, showAsIs:boolean}} `showAsIs` 是 true 時，訊息原樣顯示，不在前面加
   *     「呼叫伺服器失敗（…）：」（讀取類與下載的一句已經寫了函式名稱）。
   * Raises:
   *   （無）
   */
  function describeCallTimeout(fnName, seconds) {
    var kind = serverCallKind(fnName);
    if (kind === 'read') {
      return {
        text: '伺服器在 ' + seconds + ' 秒內沒有回應（' + fnName + '）。'
          + '這是讀取資料，沒有改動任何東西；請稍後重新載入頁面再試。',
        showAsIs: true
      };
    }
    if (kind === 'download') {
      return {
        text: '伺服器在 ' + seconds + ' 秒內沒有回應（' + fnName + '），Word 檔沒有下載到；'
          + '請稍後再按一次「下載 Word」。伺服器可能已經更新了雲端硬碟上這一期的最新 Word，'
          + '再按一次只會原地更新同一個檔案，不會多出一份。',
        showAsIs: true
      };
    }
    return {
      text: '伺服器在 ' + seconds + ' 秒內沒有回應。這一次的動作可能已經做了、也可能沒有做，'
        + '請先看試算表的 ErrorLog 與 Apps Script 的「執行項目」確認，不要直接再按一次。',
      showAsIs: false
    };
  }

  /**
   * 用途：第二批測試修正 G13：判斷一個失敗看來是不是連線／傳輸問題（伺服器沒有回應），
   *   而不是伺服器明確回傳的錯誤。
   *
   *   google.script.run 遇到 HTTP 502 之類的連線錯誤時，失敗處理收到的是瀏覽器那一邊
   *   的錯誤（例如「NetworkError: Connection failure due to HTTP 502」），伺服器卻可能
   *   仍在處理、之後亦可能已經完成。伺服器明確回傳的錯誤（例如 STALE、驗證失敗）經
   *   withApiResult_() 變成 ok:false，由成功處理接收，不會來到這裏；來到失敗處理而又
   *   有一句不屬於連線問題的訊息，是伺服器拋出的例外，照舊當作失敗。
   * Args:
   *   err {*} 失敗處理收到的錯誤；callServer() 自己的逾時錯誤帶 noResponse:true。
   * Returns:
   *   {boolean} 帶 noResponse:true、沒有任何訊息，或者訊息符合 NO_RESPONSE_PATTERN
   *     （NetworkError、HTTP 5xx、timeout／timed out、Failed to fetch、Connection failure）
   *     就是 true。
   * Raises:
   *   （無）
   */
  function isNoResponseFailure(err) {
    if (err && err.noResponse === true) return true;
    var raw = '';
    if (typeof err === 'string') raw = err;
    else if (err && typeof err.message === 'string') raw = err.message;
    if (raw.trim() === '') return true;
    return NO_RESPONSE_PATTERN.test(raw);
  }

  /**
   * 用途：第二批測試修正 G13：寫入類動作「伺服器沒有回應」時給使用者看的一句。
   * Args:
   *   fnName {string} 伺服器函式名稱（寫在括號內，方便對照 ErrorLog）。
   *   kind {string} writeActionRecoveryKind() 的結果（必須是 NO_RESPONSE_CHECK_HINTS 的鍵）。
   * Returns:
   *   {string}
   * Raises:
   *   （無）
   */
  function describeNoResponseFailure(fnName, kind) {
    return '伺服器沒有回應（' + fnName + '），' + NO_RESPONSE_CHECK_HINTS[kind];
  }

  /**
   * 用途：第二批測試修正 G13：寫入類動作（儲存除外，見 WRITE_ACTION_RECOVERY）沒有
   *   回應之後的補救。先等 NO_RESPONSE_RELOAD_DELAY_MS（伺服器可能仍在處理），
   *   期間整個介面維持忙碌、
   *   不可以再按；時間到才顯示訊息，並重新載入成功時會刷新的區塊。
   *
   *   重新載入這一個主日一律是同一個主日、帶 keepMessage：剛顯示的訊息要留着，
   *   發佈區的結果與已選的 PDF 亦不會被換週清理清走（見
   *   resetPublishPanelIfWeekChanged()）。主日用失敗那一刻畫面上的那一個；等候
   *   期間介面停用，換不到另一週。
   * Args:
   *   kind {string} writeActionRecoveryKind() 的結果。
   *   message {string} describeNoResponseFailure() 的結果。
   *   deliver {function():void} 顯示訊息（呼叫點自訂的 onError，或者頁頂訊息列）。
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function recoverAfterNoResponse(kind, message, deliver) {
    var isoDate = state.isoDate;
    beginRequest('伺服器沒有回應，等候 ' + Math.round(NO_RESPONSE_RELOAD_DELAY_MS / 1000)
      + ' 秒讓伺服器完成，然後重新載入…');
    setTimeout(function () {
      endRequest();
      deliver();
      var reloadsQuarterOps = kind === 'quarterOps' || kind === 'quarterImport';
      // 季度作業在頁面很下面，頁頂的訊息看不到，區塊內也寫一份（同 showQuarterOpsMessage()）。
      if (reloadsQuarterOps) showQuarterOpsMessage('error', message);
      if ((kind === 'week' || kind === 'publish' || kind === 'quarterImport') && isoDate) {
        loadWeek(isoDate, { keepMessage: true });
        refreshWeekSelectorLabels();
      }
      if (kind === 'publish') loadPublishPanel();
      if (kind === 'speakerForm') loadSpeakerFormStatus();
      if (reloadsQuarterOps) refreshQuarterOpsPanel();
    }, NO_RESPONSE_RELOAD_DELAY_MS);
  }

  /**
   * 用途：**所有**伺服器呼叫的唯一入口。統一處理忙碌狀態、逾時、失敗顯示。
   * Args:
   *   fnName {string} 伺服器端的 api* 函式名稱。
   *   args {Array} 參數陣列。
   *   onOk {function(*):void} 成功時的處理（收到伺服器回傳值）。
   *   options {{busy:(string|undefined), busyText:(string|undefined),
   *            onError:(function(string,*):void|undefined),
   *            noReport:(boolean|undefined)}=}
   *     `busy`：`'request'`（預設，停用整個介面）／`'preview'`（只顯示
   *     小小的「更新中」）／`'none'`（完全不動忙碌狀態）。
   *     `onError`：自訂失敗處理；不提供就顯示紅色訊息列。
   *     `noReport`：不要把這次失敗回報去 ErrorLog（只有回報本身那一個
   *     呼叫要用，否則會無限遞迴）。
   *   第二批測試修正 G13：寫入類（WRITE_ACTION_RECOVERY 內的）失敗而看來是沒有回應
   *   （isNoResponseFailure()，包括這裏自己的逾時）時，`onError`／訊息列收到的是
   *   describeNoResponseFailure() 那一句，要等 NO_RESPONSE_RELOAD_DELAY_MS 之後才收到，
   *   之後自動重新載入（見 recoverAfterNoResponse()）；儲存（keepForm）例外，即時收到、
   *   不重新載入。其餘失敗照舊。
   *   第二批測試修正 G17：這裏自己的逾時，訊息按 describeCallTimeout()：讀取類講「這是讀取
   *   資料，沒有改動任何東西」，下載 Word 講沒有下載到，兩者原樣顯示並記入 ErrorLog，
   *   不排重新載入。
   * Returns:
   *   {void}
   * Raises:
   *   （無）同步拋出的例外一律當作失敗處理。
   */
  function callServer(fnName, args, onOk, options) {
    var opts = options || {};
    var mode = opts.busy || 'request';
    var settled = false;
    var timer = null;

    if (mode === 'request') beginRequest(opts.busyText || '處理中…');
    else if (mode === 'preview') beginPreview();

    function release() {
      if (mode === 'request') endRequest();
      else if (mode === 'preview') endPreview();
    }

    // ⚠️ 每一條路徑（成功、失敗、逾時）都經過這裏，所以忙碌狀態一定只
    // 會解除一次，也不會漏。逾時之後才回來的那一個回應會被 settled 擋掉。
    function settle(handler) {
      return function (value) {
        if (settled) return;
        settled = true;
        if (timer) { clearTimeout(timer); timer = null; }
        release();
        handler(value);
      };
    }

    var fail = settle(function (err) {
      // G13：寫入類動作沒有回應（例如 HTTP 502）不等於沒有做——伺服器可能仍在處理，
      // 之後亦可能已經完成。訊息改講「可能已經完成」，等一會再重新載入給使用者核對。
      var recoveryKind = writeActionRecoveryKind(fnName);
      if (recoveryKind && isNoResponseFailure(err)) {
        var noResponseMessage = describeNoResponseFailure(fnName, recoveryKind);
        // 回報即時送出（不等那一段等候），ErrorLog 保留原本的錯誤內容。
        if (!opts.noReport) {
          reportClientError_(describeServerFailure(fnName, err) + NO_RESPONSE_LOG_NOTE, stackSummary(err), fnName);
        }
        var deliverNoResponse = function () {
          if (opts.onError) opts.onError(noResponseMessage, err);
          else showMessage('error', noResponseMessage);
        };
        // 儲存：不等、不重新載入，表單上的改動留着讓幹事再按一次（FF-13）。
        if (recoveryKind === 'keepForm') {
          deliverNoResponse();
          return;
        }
        recoverAfterNoResponse(recoveryKind, noResponseMessage, deliverNoResponse);
        return;
      }
      // G17：讀取類與下載的逾時訊息已經寫了函式名稱，原樣顯示、原樣記入 ErrorLog。
      var message = (err && err.noResponse === true && err.showAsIs === true)
        ? err.message : describeServerFailure(fnName, err);
      if (opts.onError) opts.onError(message, err);
      else showMessage('error', message);
      if (!opts.noReport) {
        reportClientError_(message, stackSummary(err), fnName);
      }
    });

    timer = setTimeout(function () {
      var timeout = describeCallTimeout(fnName, Math.round(serverCallTimeoutMs() / 1000));
      var timeoutErr = new Error(timeout.text);
      // G13：逾時同樣是「沒有回應」，寫入類動作走同一條補救。
      timeoutErr.noResponse = true;
      timeoutErr.showAsIs = timeout.showAsIs;
      fail(timeoutErr);
    }, serverCallTimeoutMs());

    try {
      var runner = google.script.run
        .withSuccessHandler(settle(function (resp) { onOk(resp); }))
        .withFailureHandler(fail);
      runner[fnName].apply(runner, args || []);
    } catch (err) {
      fail(err);
    }
  }

  /**
   * 用途：把前端捕捉到的錯誤回報到伺服器 ErrorLog（SOURCE='CLIENT'）。
   *   刻意不等回應、也不處理失敗——回報錯誤這件事本身失敗了，不應該再
   *   跳一個新的錯誤橫幅打斷使用者。`detail` 只能放堆疊摘要這類技術性
   *   內容，不可以夾帶電郵或表單完整內容。
   * Args:
   *   message {string}　detail {string}　functionName {string}
   * Returns:
   *   {void}
   */
  function reportClientError_(message, detail, functionName) {
    // ⚠️ `noReport: true` 是必須的：回報失敗時如果又去回報一次，就會
    // 變成無限遞迴。`onError` 也刻意吞掉——回報錯誤這件事本身失敗了，
    // 不應該再跳一個新的錯誤橫幅打斷使用者。
    callServer('apiLogClientError',
      [{ message: message, detail: detail, functionName: functionName }],
      function () {},
      { busy: 'none', noReport: true, onError: function () {} });
  }
  // END call-server

  // =====================================================================
  // 唯讀區塊
  // =====================================================================

  function renderReadOnly(readOnly) {
    adoptReadOnlyFields(readOnly);
    var meta = document.getElementById('rosterMeta');
    var parts = [
      '特別主日：' + escapeHtml(readOnly.special ? readOnly.special.title : '（無）'),
      '程序範本：' + escapeHtml(readOnly.templateId || '（無）'),
      '職事表版本：' + escapeHtml(readOnly.rosterVersionUsed === null || readOnly.rosterVersionUsed === undefined
        ? '（尚未生成）' : String(readOnly.rosterVersionUsed))
    ];
    meta.innerHTML = parts.join('　');
    if (!readOnly.rosterIsOfficial) {
      var warn = el('strong');
      warn.style.color = '#b3261e';
      warn.textContent = '　⚠ 職事表尚未正式發出，內容可能仍會變動';
      meta.appendChild(warn);
    }

    renderEditableDutyBox(readOnly.dutyBoxPage1);
    renderNextWeekDutyBox(readOnly);
    applyBaptismPanelVisibility(readOnly.isBaptismSunday === true);

    // R-041：誦讀下拉旁邊的「目前自動值」。由後端算好——月份分組是
    // Config 改得到的，前端自己算一次就會有第二個真相來源。
    // 階段 1：獻花欄位旁邊的職事表提示。輸入時的更新見下面的 input 監聽。
    state.flowerRoster = readOnly.flowerRoster || { thisWeek: '', nextWeek: '' };
    renderFlowerHints(state.flowerRoster);

    var autoHint = document.getElementById('recitationAutoHint');
    autoHint.textContent = readOnly.recitationAuto
      ? ('目前自動值：' + readOnly.recitationAuto)
      : '';

    // R-044：詩班項目名稱留空時，顯示範本現時會印的那一個。
    var choirInput = document.getElementById('choirLabelInput');
    if (choirInput) {
      var choirRow = (readOnly.program || []).filter(function (r) {
        return String(r.content || '') === String(state.week.CHOIR_TITLE || '')
          && String(state.week.CHOIR_TITLE || '') !== '';
      })[0];
      choirInput.placeholder = choirRow ? ('預設：' + choirRow.itemName) : '留空就用範本預設值';
    }
  }

  /**
   * 用途：**R-040**——渲染「下週事奉」，可編輯。
   *
   *   ⚠️ 改的是**下一個主日**那一筆 `DutyOverride`，所以收集出來的編輯
   *   要另外送（`nextWeekDutyEdits`），不可以混入 `dutyEdits`——混入的話
   *   後端會用這一週的日期去寫，兩個畫面各存一筆，外表完全正常，
   *   只是永遠對不上。
   *
   *   ⚠️ 下一季未建立時**不可以扮成空白可編輯**：填了會寫進一個沒有週報
   *   的主日，之後沒有人見得到。改為顯示伺服器算好那一句提示。
   * Args:
   *   readOnly {Object} `apiLoadWeek()` 回傳的 `readOnly`。
   * Returns:
   *   {void}
   */
  function renderNextWeekDutyBox(readOnly) {
    var container = document.getElementById('nextWeekDutyBody');
    var notice = document.getElementById('nextWeekDutyNotice');
    container.innerHTML = '';
    state.nextWeekDutyEdits = {};

    document.getElementById('nextWeekDutyDate').textContent =
      readOnly.nextWeekIsoDate ? ('下一個主日：' + readOnly.nextWeekIsoDate) : '';

    if (readOnly.nextWeekEditable !== true) {
      notice.textContent = readOnly.nextWeekNotice || '下一個主日暫時未有職事表資料。';
      notice.classList.remove('hidden');
      return;
    }
    notice.classList.add('hidden');

    (readOnly.nextWeekDuty || []).forEach(function (row) {
      var rowEl = el('div', 'duty-row');
      if (row.status === 'CONFLICT') rowEl.classList.add('is-conflict');
      else if (row.hasOverride) rowEl.classList.add('is-overridden');

      var labelEl = el('div', 'duty-row-label');
      labelEl.textContent = row.label;
      rowEl.appendChild(labelEl);

      var slotsWrap = el('div', 'duty-row-slots');
      (row.slots || []).forEach(function (slot) {
        slotsWrap.appendChild(buildDutySlotRow(slot, rowEl, state.nextWeekDutyEdits));
      });
      rowEl.appendChild(slotsWrap);
      container.appendChild(rowEl);
    });
  }

  // =====================================================================
  // 內容表接管的七個區塊（R-011）
  // =====================================================================

  /**
   * 由內容表接管、填寫介面不可以再編輯的 `BulletinWeeks` 欄位。
   *
   * ⚠️ 前端這一份只影響**外觀**（把輸入框設成唯讀）。真正的防線在後端
   * `assertContentSheetFieldsNotSubmitted_()`——只擋前端等於沒有擋，
   * 任何人開瀏覽器主控台就可以直接呼叫 `apiSaveWeek()`。
   */
  // ⚠️ 這一份**不是**寫死的清單，是 apiLoadWeek() 送過來的
  //    readOnly.readOnlyFields.week（單一真相來源見 Constants.gs 的
  //    CONTENT_SHEET_READONLY_FIELDS）。前端自己寫一份的話，後端加了一個
  //    唯讀欄位而前端沒有跟，那一欄就會看起來可以改、一按儲存又被整次拒絕。
  //
  //    初值刻意是空陣列而不是一份備份清單：拿不到伺服器那一份時，寧可
  //    「介面看起來可以改但後端擋住」，也不要「用一份可能過期的清單去
  //    決定哪幾欄唯讀」。後端是真正的把關（見
  //    assertContentSheetFieldsNotSubmitted_()），前端只是省一趟冤枉路。
  var CONTENT_SHEET_WEEK_FIELDS = [];

  /**
   * 用途：把伺服器送過來的唯讀欄位清單記下來。每次載入都會叫一次。
   * Args:
   *   readOnly {Object} apiLoadWeek() 回傳的 readOnly 物件。
   */
  function adoptReadOnlyFields(readOnly) {
    var fields = (readOnly && readOnly.readOnlyFields) || null;
    if (!fields || !Array.isArray(fields.week)) {
      CONTENT_SHEET_WEEK_FIELDS = [];
      return;
    }
    CONTENT_SHEET_WEEK_FIELDS = fields.week.slice();
  }

  /**
   * 用途：把內容表接管的欄位設成唯讀，並在每個區塊上方渲染那一行狀態
   *   （最後匯入時間 ＋ 兩個按鈕）。
   * Args:
   *   contentSheet {{exists:boolean, quarterId:string, fileUrl:string,
   *                 lastImportedAt:string}} `apiLoadWeek()` 回傳的同名欄位。
   */
  function applyContentSheetReadOnly(contentSheet) {
    var info = contentSheet || { exists: false, fileUrl: '', lastImportedAt: '' };

    CONTENT_SHEET_WEEK_FIELDS.forEach(function (key) {
      var elm = document.querySelector('[data-field="' + key + '"]');
      if (!elm) return;
      elm.readOnly = true;
      elm.classList.add('is-readonly');
      elm.title = '本欄內容來自內容表，請到內容表修改後按「重新匯入」。';
    });

    var bars = document.querySelectorAll('[data-content-sheet-bar]');
    for (var i = 0; i < bars.length; i++) {
      renderContentSheetBar(bars[i], info);
    }
  }

  /**
   * 用途：渲染一個區塊上方那一行。三種狀態的文案完全不同（未建立內容表／
   *   已建立但未匯入／已匯入）。
   */
  function renderContentSheetBar(bar, info) {
    bar.innerHTML = '';
    bar.classList.add('content-sheet-bar');

    if (!info.exists) {
      var warn = el('span');
      warn.textContent = '本區內容來自內容表　｜　本季尚未建立內容表';
      bar.appendChild(warn);
      var hint = el('span', 'hint');
      // ⚠️ R-038：整條例行流程都做得到，所以指返落面那一個區塊，
      //    不再叫幹事轉去試算表選單。
      hint.textContent = '　請在下面「季度作業」區塊撳「建立／刷新本季內容表」。';
      bar.appendChild(hint);
      return;
    }

    var label = el('span');
    label.textContent = '本區內容來自內容表，最後匯入：'
      + (info.lastImportedAt ? info.lastImportedAt : '尚未匯入過');
    bar.appendChild(label);

    var openLink = el('a', 'btn btn-small');
    openLink.href = info.fileUrl;
    openLink.target = '_blank';
    openLink.rel = 'noopener';
    openLink.textContent = '開啟內容表';
    bar.appendChild(openLink);

    // ⚠️ 這一粒的範圍是**這一個主日**，不是整季。整季匯入在「季度作業」
    //    區塊。兩者範圍不同是刻意的，不是重複——所以名稱與提示都要講明
    //    範圍，否則幹事分不出撳邊一粒（見 docs/已知bug類型.md 事故四十五）。
    var oneWeekBtn = makeSmallButton('重新匯入（只限這一個主日）', function () { startContentImport(); });
    oneWeekBtn.title = '只匯入目前選住的這一個主日。'
      + '要整季一次過匯入，請用下面「季度作業」區塊的「從內容表匯入（整季）」。';
    bar.appendChild(oneWeekBtn);
  }

  // BEGIN confirm-dialog（F9：測試會把這一段抽出來在假 DOM 上執行，請保持自足）
  /**
   * 用途：目前正在等待回應的頁內確認對話框的回呼；`null` 代表沒有對話框開著。
   *   放在閉包內的單一變數，同一時間只會有一個確認對話框。
   */
  var confirmDialogCallback = null;

  /**
   * 用途：第二批測試修正 G15：會改資料的確認對話框按「取消」（或 Esc）之後顯示的一句。
   *   重設這一週、還原到這個版本、季度作業共用這一個，字眼只有一處。
   */
  var CANCELLED_NOTHING_WRITTEN_MESSAGE = '已取消，一格都沒有寫。';

  /**
   * 用途：顯示頁內確認對話框，取代瀏覽器原生的確認視窗。
   *
   *   語意與原生確認視窗相同：按「確定」回傳 `true`，按「取消」或 Esc 回傳
   *   `false`——呼叫方在 `false` 時一格都不可以寫。預設焦點在「取消」，
   *   手快按 Enter 也不會寫入。內文逐行用 `textContent` 填入，絕不使用
   *   `innerHTML`（內文含伺服器傳來的使用者資料，例如講題、姓名）。
   * Args:
   *   title {string} 對話框標題。
   *   lines {string[]} 內文，每個元素一行；空字串代表空行。
   *   onResult {function(boolean):void} 使用者按下按鈕之後呼叫一次。
   * Returns:
   *   {void}
   */
  function openConfirmDialog(title, lines, onResult) {
    // 萬一上一個對話框還開著（正常不會發生），先當作取消，免得回呼遺失。
    if (confirmDialogCallback) settleConfirmDialog(false);

    document.getElementById('confirmDialogTitle').textContent = title;
    var body = document.getElementById('confirmDialogBody');
    body.textContent = '';
    (lines || []).forEach(function (line) {
      var row = el('div', 'confirm-line');
      row.textContent = line;
      body.appendChild(row);
    });

    confirmDialogCallback = onResult;
    document.getElementById('confirmDialogBackdrop').classList.remove('hidden');
    document.getElementById('confirmCancelBtn').focus();
  }

  /**
   * 用途：關閉頁內確認對話框並把結果交給呼叫方。先清掉回呼再呼叫，
   *   避免回呼內再開對話框時被誤當成「上一個還開著」。
   * Args:
   *   accepted {boolean} `true` 代表按了「確定」。
   * Returns:
   *   {void}
   */
  function settleConfirmDialog(accepted) {
    var callback = confirmDialogCallback;
    confirmDialogCallback = null;
    document.getElementById('confirmDialogBackdrop').classList.add('hidden');
    if (callback) callback(accepted === true);
  }

  /**
   * 用途：確認對話框開著時，Esc 等於按「取消」。
   * Args:
   *   event {{key:string}} 鍵盤事件。
   * Returns:
   *   {void}
   */
  function onConfirmDialogKeydown(event) {
    if (!confirmDialogCallback) return;
    if (event && event.key === 'Escape') settleConfirmDialog(false);
  }
  // END confirm-dialog

  /**
   * 用途：「重新匯入」按鈕——先取差異預覽，確認之後才真的寫入。
   *
   *   ⚠️ 兩步都走伺服器端**同一組**函式（`previewContentImport_()` ／
   *   `applyContentImport_()`），與試算表選單那個入口完全一樣。
   */
  function startContentImport() {
    if (!state.isoDate) return;
    if (state.inFlight > 0) return;
    hideMessage();
    callServer('apiPreviewContentImport', [state.isoDate], onContentImportPreviewed,
      { busyText: '計算差異中…' });
  }

  /**
   * 用途：「重新匯入」預覽回來之後的處理：沒有改動就只顯示訊息；有改動就
   *   打開頁內確認對話框，使用者按「確定」才叫執行 API（F9：不再用原生
   *   確認視窗）。取消就一格都不寫。
   * Args:
   *   resp {{ok:boolean, data:Object, error:Object}} `apiPreviewContentImport` 的回應。
   * Returns:
   *   {void}
   */
  function onContentImportPreviewed(resp) {
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    if (!resp.data.ok) { showMessage('error', resp.data.message); return; }

    var summary = resp.data.summary;
    var changeCount = summary.added + summary.updated + summary.removed;
    if (changeCount === 0) {
      showMessage('info', '內容表與週報現況一致，沒有任何改動。');
      return;
    }

    var confirmLines = resp.data.lines.concat(['', '確定要匯入嗎？']);
    openConfirmDialog('由內容表匯入', confirmLines, function (accepted) {
      if (!accepted) {
        showMessage('info', '已取消，沒有寫入任何資料。');
        return;
      }
      callServer('apiRunContentImport', [state.isoDate], onContentImportDone, { busyText: '匯入中…' });
    });
  }

  function onContentImportDone(resp) {
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    if (!resp.data.ok) { showMessage('error', resp.data.message); return; }
    showMessage('success', '匯入完成。' + resp.data.lines[2]);
    loadWeek(state.isoDate, { keepMessage: true });
    // 匯入會令這一週的待填數字改變：主日下拉的「待填 N 項」標籤一併刷新（與儲存之後同一做法）。
    refreshWeekSelectorLabels();
  }

  /**
   * 用途：按這一週是不是浸禮合堂，決定要不要顯示副框那一段。
   *
   *   ⚠️ **只是隱藏，不是停用、更不是清空**：面板內六個輸入框仍然在 DOM
   *   內，仍然會被 collectWeekFields() 讀出來、原樣送回伺服器存返。如果
   *   隱藏時順手把值清走，幹事把某一週的範本由浸禮改成平常再改返，
   *   原本填好的受浸名單就會靜靜不見。
   *
   *   判斷用的是伺服器算好的 `readOnly.isBaptismSunday`，不是前端自己拿
   *   `templateId` 去跟字面值比——範本 ID 只准有一個真相來源。
   * Args:
   *   isBaptism {boolean}
   * Returns:
   *   （無）
   */
  function applyBaptismPanelVisibility(isBaptism) {
    var panel = document.getElementById('baptismPanel');
    if (!panel) return;
    panel.classList.toggle('hidden', !isBaptism);
  }

  /**
   * 用途：把第 1 頁事奉框渲染成**可編輯**的一格格輸入框（第六輪）。
   *
   *   每個崗位每個位次一個輸入框，預設值是 `slot.bulletinName`——那是
   *   **未套尊稱的原始姓名**，不是版面上印的「陳大文弟兄」。用原始姓名
   *   才能安全來回：輸入框的內容會原樣存進 `DutyOverride.OVERRIDE_NAME`，
   *   如果放的是已加尊稱的顯示文字，幹事什麼都不改直接儲存，就會產生
   *   一個「陳大文弟兄」的覆寫，之後再也對不上 PersonDisplay 的姓名，
   *   尊稱反而不見了。
   *
   *   改動過的格子（`hasOverride`）左邊有一條橙色直線與「還原」按鈕；
   *   `CONFLICT` 的格子用紅底，並列出三個值（覆寫當時的職事表值、
   *   職事表現值、你的覆寫值）。
   * Args:
   *   rows {Object[]} `apiLoadWeek()` 回傳的 `readOnly.dutyBoxPage1`。
   * Returns:
   *   {void}
   */
  function renderEditableDutyBox(rows) {
    var container = document.getElementById('dutyBoxPage1Body');
    container.innerHTML = '';
    state.dutyEdits = {};

    if (!rows || rows.length === 0) {
      var empty = el('div', 'hint');
      empty.textContent = '（沒有事奉資料）';
      container.appendChild(empty);
      return;
    }

    rows.forEach(function (row) {
      var rowEl = el('div', 'duty-row');
      if (row.status === 'CONFLICT') rowEl.classList.add('is-conflict');
      else if (row.hasOverride) rowEl.classList.add('is-overridden');

      var labelEl = el('div', 'duty-row-label');
      labelEl.textContent = row.label;
      rowEl.appendChild(labelEl);

      var slotsWrap = el('div', 'duty-row-slots');
      (row.slots || []).forEach(function (slot) {
        slotsWrap.appendChild(buildDutySlotRow(slot, rowEl, state.dutyEdits));
      });
      rowEl.appendChild(slotsWrap);

      container.appendChild(rowEl);
    });
  }

  /**
   * 用途：渲染事奉框內的一格（一個崗位的一個位次）。
   * Args:
   *   slot {Object} `buildDutyBoxSlotDetail_()` 的輸出。
   *   rowEl {HTMLElement} 整行的容器，用來即時加／減橙色標示。
   * Returns:
   *   {HTMLElement}
   */
  function buildDutySlotRow(slot, rowEl, editsMap) {
    var wrap = el('div', 'duty-slot');
    var key = slot.postId + '#' + slot.slotIndex;
    // ⚠️ R-040：本週與下週兩個事奉框共用這一支，但**各自一個 edits map**
    //    ——共用一個的話，下週那一格會蓋走本週同一個崗位那一格。
    var edits = editsMap || state.dutyEdits;
    edits[key] = { postId: slot.postId, slotIndex: slot.slotIndex, name: slot.bulletinName };

    // ⚠️ R-039：**逐格**標示「已覆寫」。本來只有整行有橙色左邊，
    //    而一行可以有幾格（例如司事 #1 #2 #3）——幹事分不出係邊一格
    //    自己改過。CONFLICT 的紅底維持原狀，不改。
    if (slot.status !== 'CONFLICT' && slot.hasOverride) {
      wrap.classList.add('is-overridden');
      wrap.title = '這一格是人手覆寫的（職事表現值：'
        + (slot.rosterName || '（未排定）') + '）。撳「還原」可以改回跟隨職事表。';
    }

    var input = el('input');
    input.type = 'text';
    input.value = slot.bulletinName || '';
    input.placeholder = slot.rosterName ? '' : '（職事表未排定）';

    var restoreBtn = makeSmallButton('還原', function () {
      input.value = slot.rosterName || '';
      edits[key].name = input.value;
      refreshSlotMarkers();
    });
    restoreBtn.title = '把這一格改回職事表現時的值';

    function refreshSlotMarkers() {
      var changed = String(input.value || '').trim() !== String(slot.rosterName || '').trim();
      restoreBtn.classList.toggle('hidden', !changed);
      // 整行只要有任何一格跟職事表不同就加橙色標示。CONFLICT 的紅底
      // 由伺服器算好，前端不會即時改變它——衝突與否要重新載入才知道。
      if (!rowEl.classList.contains('is-conflict')) {
        var anyChanged = Array.prototype.some.call(rowEl.querySelectorAll('input[type="text"]'), function (other) {
          return other.dataset.rosterName !== undefined
            && String(other.value || '').trim() !== String(other.dataset.rosterName || '').trim();
        });
        rowEl.classList.toggle('is-overridden', anyChanged);
      }
    }

    input.dataset.rosterName = slot.rosterName || '';
    input.addEventListener('input', function () {
      edits[key].name = input.value;
      refreshSlotMarkers();
      // R-039：改到與職事表不同就即時加上逐格標示。
      if (!wrap.classList.contains('is-conflict')) {
        wrap.classList.toggle('is-overridden',
          String(input.value || '').trim() !== String(slot.rosterName || '').trim());
      }
    });

    wrap.appendChild(input);

    var rosterHint = el('span', 'duty-slot-roster');
    rosterHint.textContent = '職事表：' + (slot.rosterName || '（未排定）');
    wrap.appendChild(rosterHint);

    wrap.appendChild(restoreBtn);
    restoreBtn.classList.toggle('hidden', !slot.hasOverride);

    if (slot.status === 'CONFLICT') {
      var detail = el('div', 'duty-conflict-detail');
      detail.textContent = '⚠ 職事表在你覆寫之後又改過　'
        + '覆寫當時職事表＝' + (slot.rosterValueAtOverride || '（空白）')
        + '　職事表現值＝' + (slot.rosterName || '（空白）')
        + '　你的覆寫值＝' + (slot.bulletinName || '（空白）');
      wrap.appendChild(detail);
    }

    return wrap;
  }

  function renderDutyTable(tbodyId, rows) {
    var tbody = document.getElementById(tbodyId);
    tbody.innerHTML = '';
    (rows || []).forEach(function (r) {
      var tr = el('tr');
      var tdLabel = el('td');
      tdLabel.textContent = r.label;
      var tdText = el('td', r.isPending ? 'pending' : '');
      tdText.textContent = r.text || '（待填）';
      tr.appendChild(tdLabel);
      tr.appendChild(tdText);
      tbody.appendChild(tr);
    });
    if (!rows || rows.length === 0) {
      var tr = el('tr');
      var td = el('td');
      td.colSpan = 2;
      td.textContent = '（沒有資料）';
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
  }

  function renderProgramPreview(rows) {
    var tbody = document.getElementById('programPreviewBody');
    tbody.innerHTML = '';
    (rows || []).forEach(function (r) {
      var tr = el('tr');
      [r.itemName, r.content, r.fullWidth ? '' : r.posture].forEach(function (text) {
        var td = el('td');
        td.textContent = text || '';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  // =====================================================================
  // 可編輯欄位
  // =====================================================================

  function applyWeekFieldsToForm() {
    var fields = document.querySelectorAll('[data-field]');
    for (var i = 0; i < fields.length; i++) {
      var fieldEl = fields[i];
      var key = fieldEl.getAttribute('data-field');
      fieldEl.value = state.week[key] || '';
    }
  }

  function collectWeekFieldsFromForm() {
    var week = {};
    var fields = document.querySelectorAll('[data-field]');
    for (var i = 0; i < fields.length; i++) {
      var fieldEl = fields[i];
      week[fieldEl.getAttribute('data-field')] = fieldEl.value;
    }
    return week;
  }

  // BEGIN flower-hint（測試會把這一段抽出來在假 DOM 上執行，請保持自足）
  /**
   * 用途：算出獻花欄位旁邊那一行灰色提示。純函式。
   *   職事表的名字由後端算好（`readOnly.flowerRoster`，與「留空就帶入」
   *   同一個 `rosterFlowerName_()`），這裏只負責按欄位現值挑哪一句，
   *   不自己從職事表重算名字。
   *     - 職事表沒有名字 → 不顯示提示；
   *     - 欄位留空或與職事表相同 → 「職事表：X（留空就用職事表的名字）」；
   *     - 欄位已改成別的 → 「已改，職事表是：X」。
   * Args:
   *   rosterName {string} 職事表 `FLOWER` 崗位的名字；沒有就傳空字串。
   *   currentValue {string} 輸入框現時的值。
   * Returns:
   *   {string} 提示文字；不需要提示時回空字串。
   */
  function flowerHintText(rosterName, currentValue) {
    var roster = String(rosterName === null || rosterName === undefined ? '' : rosterName).trim();
    if (roster === '') return '';
    var current = String(currentValue === null || currentValue === undefined ? '' : currentValue).trim();
    if (current === '' || current === roster) {
      return '職事表：' + roster + '（留空就用職事表的名字）';
    }
    return '已改，職事表是：' + roster;
  }

  /**
   * 用途：按目前兩個獻花輸入框的值，重畫兩行提示（用 `textContent`，名字
   *   是資料，不經 `innerHTML`）。
   * Args:
   *   flowerRoster {?Object} `{ thisWeek, nextWeek }`，後端算好的職事表名字；
   *     沒有就當兩個都空白。
   * Returns:
   *   {void}
   */
  function renderFlowerHints(flowerRoster) {
    var roster = flowerRoster || {};
    var pairs = [
      { field: 'FLOWER_THIS_WEEK', hintId: 'flowerThisHint', name: roster.thisWeek },
      { field: 'FLOWER_NEXT_WEEK', hintId: 'flowerNextHint', name: roster.nextWeek }
    ];
    var inputs = document.querySelectorAll('[data-field]');
    pairs.forEach(function (pair) {
      var value = '';
      for (var i = 0; i < inputs.length; i++) {
        if (inputs[i].getAttribute('data-field') === pair.field) { value = inputs[i].value; break; }
      }
      document.getElementById(pair.hintId).textContent = flowerHintText(pair.name, value);
    });
  }
  // END flower-hint

  // BEGIN snapshot-panel（測試會把這一段抽出來在假 DOM 上執行，請保持自足）
  /**
   * 用途：版本列表上方的一行：時間｜由誰｜原因。純函式。
   * Args:
   *   version {{createdAt:string, createdBy:string, reasonLabel:string}} 後端的一個版本。
   * Returns:
   *   {string}
   */
  function snapshotMetaText(version) {
    return [version.createdAt || '（時間不明）', version.createdBy || '（未知使用者）', version.reasonLabel || '']
      .join('｜');
  }

  /**
   * 用途：差異表裏一個值怎樣顯示。純函式。
   *   空白的欄位顯示「（空白）」，沒有覆寫的事奉框／欄位顯示「（沒有覆寫）」。
   * Args:
   *   kind {string} `FIELD`、`DUTY` 或 `FIELD_OVERRIDE`。
   *   value {string} 後端給的值。
   * Returns:
   *   {string}
   */
  function snapshotValueText(kind, value) {
    var text = String(value === null || value === undefined ? '' : value);
    if (text !== '') return text;
    return kind === 'FIELD' ? '（空白）' : '（沒有覆寫）';
  }

  /**
   * 用途：只有 `https://drive.google.com/` 開頭的網址才畫成連結（後端由檔案 ID
   *   砌出來的），其他一律不畫。純函式。
   * Args:
   *   url {string}
   * Returns:
   *   {boolean}
   */
  function isDriveUrl(url) {
    return String(url || '').indexOf('https://drive.google.com/') === 0;
  }

  /**
   * 用途：畫出版本列表。名稱、時間、摘要一律 `textContent`。
   * Args:
   *   list {Element} `<ul>`。
   *   versions {Object[]} `apiListWeekSnapshots` 的 `versions`。
   *   handlers {{onDiff:function(string):void, onRestore:function(string):void}}
   * Returns:
   *   {void}
   */
  function renderSnapshotList(list, versions, handlers) {
    list.innerHTML = '';
    versions.forEach(function (version) {
      var item = el('li', 'snapshot-item');

      var meta = el('div', 'snapshot-meta');
      meta.textContent = snapshotMetaText(version);
      item.appendChild(meta);

      var summary = el('div', 'snapshot-summary');
      summary.textContent = version.summary || '';
      item.appendChild(summary);

      if (isDriveUrl(version.docUrl)) {
        var link = el('a', 'snapshot-doc-link');
        link.textContent = '開啟 Word 檔';
        link.setAttribute('href', version.docUrl);
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener');
        item.appendChild(link);
      }

      var buttons = el('div', 'snapshot-buttons');
      var diffBtn = el('button', 'btn btn-small');
      diffBtn.type = 'button';
      diffBtn.textContent = '看差異';
      diffBtn.addEventListener('click', function () { handlers.onDiff(version.snapshotId); });
      buttons.appendChild(diffBtn);
      var restoreBtn = el('button', 'btn btn-small');
      restoreBtn.type = 'button';
      restoreBtn.textContent = '還原到這個版本';
      restoreBtn.addEventListener('click', function () { handlers.onRestore(version.snapshotId); });
      buttons.appendChild(restoreBtn);
      item.appendChild(buttons);

      list.appendChild(item);
    });
  }

  /**
   * 用途：畫出這個主日的發佈記錄（標明「已發佈」）。
   * Args:
   *   box {Element}
   *   published {{versionNo:number, publishedAt:string, archiveUrl:string, forced:boolean}[]}
   * Returns:
   *   {void}
   */
  function renderPublishedList(box, published) {
    box.innerHTML = '';
    if (!published || published.length === 0) return;
    var title = el('div', 'snapshot-published-title');
    title.textContent = '已發佈';
    box.appendChild(title);
    published.forEach(function (row) {
      var line = el('div', 'snapshot-published-row');
      var text = el('span');
      text.textContent = '第 ' + row.versionNo + ' 版｜' + (row.publishedAt || '（時間不明）')
        + (row.forced ? '｜強制發佈' : '') + '｜';
      line.appendChild(text);
      if (isDriveUrl(row.archiveUrl)) {
        var link = el('a');
        link.textContent = '開啟存檔副本';
        link.setAttribute('href', row.archiveUrl);
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener');
        line.appendChild(link);
      } else {
        var none = el('span');
        none.textContent = '（沒有存檔副本）';
        line.appendChild(none);
      }
      box.appendChild(line);
    });
  }

  /**
   * 用途：畫出差異表。
   * Args:
   *   body {Element} `<tbody>`。
   *   rows {{kind:string, label:string, snapshotValue:string, currentValue:string}[]}
   * Returns:
   *   {void}
   */
  function renderDiffRows(body, rows) {
    body.innerHTML = '';
    if (rows.length === 0) {
      var tr = el('tr');
      var td = el('td');
      td.setAttribute('colspan', '3');
      td.textContent = '這個版本與現在的內容一樣。';
      tr.appendChild(td);
      body.appendChild(tr);
      return;
    }
    rows.forEach(function (row) {
      var tr = el('tr');
      [row.label, snapshotValueText(row.kind, row.snapshotValue), snapshotValueText(row.kind, row.currentValue)]
        .forEach(function (text) {
          var td = el('td');
          td.textContent = text;
          tr.appendChild(td);
        });
      body.appendChild(tr);
    });
  }

  /**
   * 用途：還原確認對話框的內容行。純函式。
   * Args:
   *   diff {{createdAt:string, reasonLabel:string, rows:Object[], noteLine:string}}
   *     `apiDiffWeekSnapshot` 的結果。
   *   hasUnsavedChanges {boolean} 表單或事奉框有沒有未儲存的改動。
   * Returns:
   *   {string[]}
   */
  function buildRestoreDialogLines(diff, hasUnsavedChanges) {
    var lines = ['版本：' + (diff.createdAt || '（時間不明）') + '（' + diff.reasonLabel + '）', ''];
    if (diff.rows.length === 0) {
      lines.push('這個版本與現在的內容一樣，沒有東西需要還原。');
    } else {
      lines.push('還原會改動以下 ' + diff.rows.length + ' 項：');
      diff.rows.slice(0, 30).forEach(function (row) {
        lines.push('　' + row.label + '：現在「' + snapshotValueText(row.kind, row.currentValue)
          + '」→ 還原成「' + snapshotValueText(row.kind, row.snapshotValue) + '」');
      });
      if (diff.rows.length > 30) {
        lines.push('　（其餘 ' + (diff.rows.length - 30) + ' 項請先按「看差異」查看。）');
      }
    }
    lines.push('');
    if (hasUnsavedChanges) {
      lines.push('這一週的表單有未儲存的改動，還原後會丟失這些改動。');
      lines.push('');
    }
    lines.push(diff.noteLine);
    return lines;
  }

  /**
   * 用途：「重設這一週」確認對話框的內容行。純函式。
   * Args:
   *   hasUnsavedChanges {boolean} 表單或事奉框有沒有未儲存的改動。
   * Returns:
   *   {string[]}
   */
  function buildResetDialogLines(hasUnsavedChanges) {
    var lines = [
      '重設這一週會：',
      '1. 先自動存一個版本，之後可以在版本記錄還原；',
      '2. 這一週所有人手填的欄位改回建立時的預設值（例如序樂的範本預設值）；',
      '3. 這一週的事奉框覆寫（包括上一週「下週事奉」改到這一週的）、在介面改過的內容表欄位（例如講題、讀經經文）全部停用（不刪行）；',
      '4. 如果本季已有內容表，由內容表重新匯入這一週；',
      '5. 職事表一格都不會改；已發佈的 PDF、已寄出的郵件、已產生的 Word 檔都不受影響。'
    ];
    if (hasUnsavedChanges) {
      lines.push('');
      lines.push('這一週的表單有未儲存的改動，重設後會丟失這些改動。');
    }
    return lines;
  }

  // =====================================================================
  // 第二批階段 2：版本記錄（這一個主日）
  //
  // ⚠️ 版本列表、差異、還原、重設全部由伺服器算好——前端不自己比對欄位、
  //    不自己決定哪些欄位會被還原（那是 planWeekSnapshotRestore_() 的事）。
  // ⚠️ 確認一律用頁內對話框 openConfirmDialog()，不用瀏覽器原生確認視窗。
  // =====================================================================

  /**
   * 用途：版本記錄區塊現時是不是展開。
   * Returns:
   *   {boolean}
   */
  function isSnapshotPanelOpen() {
    return document.getElementById('snapshotPanel').open === true;
  }

  /**
   * 用途：改寫版本記錄區塊的狀態行（載入中、共幾個版本、失敗原因）。
   * Args:
   *   text {string}
   * Returns:
   *   {void}
   */
  function setSnapshotStatus(text) {
    document.getElementById('snapshotStatus').textContent = text;
  }

  /**
   * 用途：向伺服器取這一個主日的版本記錄並畫出來。換週之後才回來的回應丟掉
   *   （否則會把上一週的版本畫在這一週下面）。
   * Returns:
   *   {void}
   */
  function loadSnapshotPanel() {
    if (!state.isoDate) return;
    var requestedDate = state.isoDate;
    setSnapshotStatus('載入版本記錄中…');
    callServer('apiListWeekSnapshots', [requestedDate], function (resp) {
      if (requestedDate !== state.isoDate) return;
      if (!resp.ok) { setSnapshotStatus('版本記錄載入失敗：' + resp.error.message); return; }
      var data = resp.data;
      renderPublishedList(document.getElementById('snapshotPublished'), data.published);
      renderSnapshotList(document.getElementById('snapshotList'), data.versions, {
        onDiff: onSnapshotDiffClicked,
        onRestore: onSnapshotRestoreClicked
      });
      if (data.versions.length === 0) {
        setSnapshotStatus('這一個主日還沒有任何版本。');
      } else if (data.totalCount > data.shownCount) {
        setSnapshotStatus('共 ' + data.totalCount + ' 個版本，列表只顯示最新 ' + data.shownCount + ' 個；舊版本不會刪除。');
      } else {
        setSnapshotStatus('共 ' + data.totalCount + ' 個版本。');
      }
      state.snapshotsLoadedFor = requestedDate;
    }, {
      busy: 'preview',
      onError: function (message) { setSnapshotStatus('版本記錄載入失敗：' + message); }
    });
  }

  /**
   * 用途：載入了新的一週（或儲存、還原、重設之後重新載入）時，讓版本記錄
   *   區塊跟著更新：展開的就重新向伺服器取，摺疊的先清空，打開時才取。
   * Returns:
   *   {void}
   */
  function refreshSnapshotPanel() {
    state.snapshotsLoadedFor = null;
    document.getElementById('snapshotDiffBox').classList.add('hidden');
    if (isSnapshotPanelOpen()) {
      loadSnapshotPanel();
      return;
    }
    renderSnapshotList(document.getElementById('snapshotList'), [], { onDiff: onSnapshotDiffClicked, onRestore: onSnapshotRestoreClicked });
    renderPublishedList(document.getElementById('snapshotPublished'), []);
    setSnapshotStatus('');
  }

  /**
   * 用途：「看差異」——取得差異並顯示在區塊內的差異表。
   * Args:
   *   snapshotId {string}
   * Returns:
   *   {void}
   */
  function onSnapshotDiffClicked(snapshotId) {
    if (!state.isoDate) return;
    hideMessage();
    callServer('apiDiffWeekSnapshot', [state.isoDate, snapshotId], function (resp) {
      if (!resp.ok) { showMessage('error', resp.error.message); return; }
      var diff = resp.data;
      document.getElementById('snapshotDiffTitle').textContent =
        '版本 ' + (diff.createdAt || '（時間不明）') + '（' + diff.reasonLabel + '）與現在的差異';
      renderDiffRows(document.getElementById('snapshotDiffBody'), diff.rows);
      document.getElementById('snapshotDiffBox').classList.remove('hidden');
    }, { busyText: '比較中…' });
  }

  /**
   * 用途：「還原到這個版本」——先取最新的差異，用頁內對話框給使用者確認，
   *   確定之後才呼叫還原；成功就重新載入這一週。按「取消」就一格都不寫，並顯示
   *   CANCELLED_NOTHING_WRITTEN_MESSAGE（G15）。
   * Args:
   *   snapshotId {string}
   * Returns:
   *   {void}
   * Raises:
   *   （無）伺服器錯誤經訊息列顯示。
   */
  function onSnapshotRestoreClicked(snapshotId) {
    if (!state.isoDate) return;
    hideMessage();
    var isoDate = state.isoDate;
    callServer('apiDiffWeekSnapshot', [isoDate, snapshotId], function (resp) {
      if (!resp.ok) { showMessage('error', resp.error.message); return; }
      var diff = resp.data;
      openConfirmDialog('還原到這個版本', buildRestoreDialogLines(diff, hasUnsavedWeekChanges()), function (confirmed) {
        if (!confirmed) {
          showMessage('info', CANCELLED_NOTHING_WRITTEN_MESSAGE);
          return;
        }
        callServer('apiRestoreWeekSnapshot',
          [{ isoDate: isoDate, snapshotId: snapshotId, lastSavedAt: diff.lastSavedAt }],
          function (restored) {
            if (!restored.ok) { showMessage('error', restored.error.message); return; }
            showMessage(restored.data.message.type, restored.data.message.text);
            loadWeek(isoDate, { keepMessage: true });
            refreshWeekSelectorLabels();
          }, { busyText: '還原中…' });
      });
    }, { busyText: '比較中…' });
  }

  /**
   * 用途：「重設這一週…」——用頁內對話框列出會發生的五件事，確定之後才呼叫
   *   重設；成功就重新載入這一週。按「取消」就一格都不寫，並顯示
   *   CANCELLED_NOTHING_WRITTEN_MESSAGE（G15）。
   * Args: （無）
   * Returns:
   *   {void}
   * Raises:
   *   （無）伺服器錯誤經訊息列顯示。
   */
  function onResetWeekClicked() {
    if (!state.isoDate || !state.loaded) return;
    hideMessage();
    var isoDate = state.isoDate;
    var lastSavedAt = state.lastSavedAt;
    openConfirmDialog('重設這一週', buildResetDialogLines(hasUnsavedWeekChanges()), function (confirmed) {
      if (!confirmed) {
        showMessage('info', CANCELLED_NOTHING_WRITTEN_MESSAGE);
        return;
      }
      callServer('apiResetWeek', [{ isoDate: isoDate, lastSavedAt: lastSavedAt }], function (resp) {
        if (!resp.ok) { showMessage('error', resp.error.message); return; }
        showMessage(resp.data.message.type, resp.data.message.text);
        loadWeek(isoDate, { keepMessage: true });
        refreshWeekSelectorLabels();
      }, { busyText: '重設中…' });
    });
  }

  // BEGIN speaker-form（測試會把這一段抽出來在假 DOM 上執行，請保持自足）
  /**
   * 用途：算出「講員表格」區塊要顯示什麼。純函式。
   *   連結只接受 `https://docs.google.com/forms/` 開頭的網址（講員表格的固定連結與
   *   編輯連結都是這個開頭），其他一律不畫成連結。
   * Args:
   *   status {{created:boolean, url:string, editUrl:string, triggerCount:?number,
   *     triggerOk:boolean, folderConfigured:boolean, weeksAhead:number}} 後端的現況。
   * Returns:
   *   {{created:boolean, statusText:string, triggerText:string, triggerOk:boolean,
   *     fillUrl:string, editUrl:string}}
   */
  function speakerFormPanelModel(status) {
    var prefix = 'https://docs.google.com/forms/';
    function safe(url) { return String(url || '').indexOf(prefix) === 0 ? String(url) : ''; }

    if (!status.created) {
      return {
        created: false, fillUrl: '', editUrl: '', triggerOk: false, triggerText: '',
        statusText: status.folderConfigured
          ? '還沒有建立講員表格。建立之後，把固定的填寫連結交給講員收藏即可（只限教會帳戶填寫）。'
          : '還沒有建立講員表格，而且 Config 還沒有設定表格要放的資料夾（SPEAKER_FORM_FOLDER_ID，留空會用內容表的資料夾）。'
      };
    }

    var triggerText;
    if (status.triggerCount === null || status.triggerCount === undefined) {
      triggerText = '觸發器：查不到（可能還沒有授權）。';
    } else if (status.triggerCount === 1) {
      triggerText = '觸發器：正常（剛好 1 個）。';
    } else if (status.triggerCount === 0) {
      triggerText = '⚠️ 觸發器：沒有安裝，講員的答案不會寫進週報。';
    } else {
      triggerText = '⚠️ 觸發器：有 ' + status.triggerCount + ' 個，同一份答案會被處理 ' + status.triggerCount + ' 次。';
    }
    return {
      created: true, fillUrl: safe(status.url), editUrl: safe(status.editUrl),
      triggerOk: status.triggerOk === true, triggerText: triggerText,
      statusText: '講員表格已建立。日期選項列出從今日起的 ' + status.weeksAhead + ' 個主日，每個星期一與「建立本季週報」之後會自動更新。'
    };
  }

  /**
   * 用途：按現況畫出「講員表格」區塊（只動文字、連結與按鈕的顯示，全部 `textContent`）。
   * Args:
   *   status {Object} 後端的現況，見 `speakerFormPanelModel()`。
   * Returns:
   *   {void}
   */
  function renderSpeakerFormPanel(status) {
    var model = speakerFormPanelModel(status);
    document.getElementById('speakerFormStatus').textContent = model.statusText;
    document.getElementById('speakerFormTrigger').textContent = model.triggerText;

    document.getElementById('speakerFormCreateBtn').classList[model.created ? 'add' : 'remove']('hidden');
    document.getElementById('speakerFormCreated').classList[model.created ? 'remove' : 'add']('hidden');

    var fill = document.getElementById('speakerFormLink');
    var edit = document.getElementById('speakerFormEditLink');
    [[fill, model.fillUrl], [edit, model.editUrl]].forEach(function (pair) {
      if (pair[1]) {
        pair[0].setAttribute('href', pair[1]);
        pair[0].classList.remove('hidden');
      } else {
        pair[0].removeAttribute('href');
        pair[0].classList.add('hidden');
      }
    });
    document.getElementById('speakerFormCopyBtn').classList[model.fillUrl ? 'remove' : 'add']('hidden');
  }

  /**
   * 用途：「建立講員表格」確認對話框的內容行。純函式。
   * Args: （無）
   * Returns:
   *   {string[]}
   */
  function buildSpeakerFormCreateDialogLines() {
    return [
      '將會建立一個長期使用的講員表格（不是每季一個），連結固定。',
      '1. 只有教會帳戶登入才可以填，並自動收集已驗證的電郵，也不會讓人看到別人的答案；',
      '2. 表格放進 Config 指定的 Shared Drive 資料夾；',
      '3. 講員填的「讀經經文」「證道講題」會直接寫進該主日的週報；「講員」只作核對，不會改事奉框；',
      '4. 會安裝一個表單提交觸發器，把答案交給系統處理。',
      '部署新版本之後，需要由部署者按試算表選單「週報系統 ▸ 重新授權（新增權限之後用）」重新授權一次（表單權限），否則建立會失敗。'
    ];
  }
  /**
   * 用途：把文字複製到剪貼簿。先用 `navigator.clipboard`（有些嵌入環境會被擋），
   *   失敗再退回隱藏的 textarea 加 `execCommand('copy')`。
   * Args:
   *   text {string} 要複製的文字。
   *   nav {Object} `navigator`。
   *   doc {Object} `document`。
   *   onDone {function(boolean):void} 成功傳 `true`，兩種方法都失敗傳 `false`。
   * Returns:
   *   {void}
   */
  function copyTextToClipboard(text, nav, doc, onDone) {
    function fallback() {
      var area = doc.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      doc.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = doc.execCommand('copy') === true; } catch (err) { ok = false; }
      doc.body.removeChild(area);
      onDone(ok);
    }
    if (nav && nav.clipboard && nav.clipboard.writeText) {
      nav.clipboard.writeText(text).then(function () { onDone(true); }, fallback);
      return;
    }
    fallback();
  }
