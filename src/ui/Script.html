  // =====================================================================
  // 第二批階段 3：講員表格
  //
  // ⚠️ 建立、刷新都由伺服器做；前端只負責顯示現況、確認、呼叫。
  //    確認一律用頁內對話框 openConfirmDialog()，不用瀏覽器原生確認視窗。
  // =====================================================================

  /**
   * 用途：向伺服器取講員表格現況並畫出來（不用 FormApp，沒授權 forms 範圍也看得到）。
   * Returns:
   *   {void}
   */
  function loadSpeakerFormStatus() {
    callServer('apiGetSpeakerFormStatus', [], function (resp) {
      if (!resp.ok) {
        document.getElementById('speakerFormStatus').textContent = '講員表格現況載入失敗：' + resp.error.message;
        return;
      }
      state.speakerForm = resp.data;
      renderSpeakerFormPanel(resp.data);
    }, {
      busy: 'preview',
      onError: function (message) {
        document.getElementById('speakerFormStatus').textContent = '講員表格現況載入失敗：' + message;
      }
    });
  }

  /**
   * 用途：「建立講員表格」——先用頁內對話框講明會發生什麼，確定之後才建立。
   * Returns:
   *   {void}
   */
  function onSpeakerFormCreateClicked() {
    hideMessage();
    openConfirmDialog('建立講員表格', buildSpeakerFormCreateDialogLines(), function (confirmed) {
      if (!confirmed) return;
      callServer('apiCreateSpeakerForm', [], function (resp) {
        if (!resp.ok) { showMessage('error', resp.error.message); return; }
        var result = resp.data;
        if (!result.ok) { showMessage('error', result.message); return; }
        showMessage(result.warnings.length > 0 ? 'error' : 'success',
          result.message + (result.warnings.length > 0 ? '　⚠️ ' + result.warnings.join('　') : ''));
        loadSpeakerFormStatus();
      }, { busyText: '建立講員表格中…' });
    });
  }

  /**
   * 用途：「刷新日期選項」。
   * Returns:
   *   {void}
   */
  function onSpeakerFormRefreshClicked() {
    hideMessage();
    callServer('apiRefreshSpeakerFormDates', [], function (resp) {
      if (!resp.ok) { showMessage('error', resp.error.message); return; }
      showMessage(resp.data.ok ? 'success' : 'error', resp.data.message);
    }, { busyText: '更新日期選項中…' });
  }

  /**
   * 用途：「複製填寫連結」。
   * Returns:
   *   {void}
   */
  function onSpeakerFormCopyClicked() {
    var url = state.speakerForm ? String(state.speakerForm.url || '') : '';
    if (!url) { showMessage('error', '還沒有填寫連結。'); return; }
    copyTextToClipboard(url, window.navigator, document, function (ok) {
      // 兩種方法都複製不到時，把連結直接顯示出來讓人手複製，不要靜靜失敗。
      if (ok) showMessage('success', '已複製填寫連結。');
      else showMessage('info', '瀏覽器不讓網頁複製，請手動複製這條連結：' + url);
    });
  }

  // BEGIN word-file（測試會把這一段抽出來在假 DOM 上執行，請保持自足）
  /**
   * 用途：畫出「雲端硬碟上這個主日的最新 Word」那一行：一條開啟最新檔案的
   *   連結，加一條開啟所在資料夾的連結；從未產生過就只顯示一句文字。
   *
   *   連結只接受 `https://drive.google.com/` 開頭的網址（後端由檔案／資料夾
   *   ID 砌出來的）；其他一律不畫成連結。名稱與時間用 `textContent`，
   *   不經 `innerHTML`。
   * Args:
   *   wordFile {?Object} 後端的 `wordFile`（`{url, folderUrl, fileName, generatedAt}`）；
   *     從未產生過就是 `null`。
   * Returns:
   *   {void}
   */
  function renderWordFileInfo(wordFile) {
    var text = document.getElementById('wordFileInfoText');
    var link = document.getElementById('wordFileLink');
    var folderLink = document.getElementById('wordFolderLink');
    var drivePrefix = 'https://drive.google.com/';

    function hideLink(a) {
      a.classList.add('hidden');
      a.removeAttribute('href');
    }

    var url = wordFile ? String(wordFile.url || '') : '';
    if (!wordFile || url.indexOf(drivePrefix) !== 0) {
      text.textContent = '這一週還未產生過 Word 檔';
      link.textContent = '';
      hideLink(link);
      hideLink(folderLink);
      return;
    }

    text.textContent = '';
    var name = String(wordFile.fileName || '');
    var stamp = String(wordFile.generatedAt || '');
    var detail = name + (stamp ? (name ? '，' : '') + '最後產生：' + stamp : '');
    link.textContent = '開啟最新 Word 檔' + (detail ? '（' + detail + '）' : '');
    link.setAttribute('href', url);
    link.classList.remove('hidden');

    var folderUrl = String(wordFile.folderUrl || '');
    if (folderUrl.indexOf(drivePrefix) === 0) {
      folderLink.setAttribute('href', folderUrl);
      folderLink.classList.remove('hidden');
    } else {
      hideLink(folderLink);
    }
  }

  /**
   * 用途：「下載 Word」完成之後要顯示哪一句。純函式。
   *   Word 已經下載成功，存雲端失敗只是附帶的警告（後端 `code` 以 `WORD_`
   *   開頭），所以訊息類型是 `error` 但文字仍先講「已產生」。
   * Args:
   *   data {Object} `apiDownloadBulletinDocx()` 回傳的 `data`。
   * Returns:
   *   {{type:string, text:string}}
   */
  function downloadWordMessage(data) {
    var base = '已產生 ' + data.fileName + '，請在瀏覽器的下載清單查看。';
    var storeWarnings = (data.warnings || []).filter(function (w) {
      return String(w && w.code || '').indexOf('WORD_') === 0;
    });
    if (storeWarnings.length > 0) {
      return {
        type: 'error',
        text: base + '　⚠️ ' + storeWarnings.map(function (w) { return w.message; }).join('　')
      };
    }
    return {
      type: 'info',
      text: base + (data.wordFile ? '　雲端硬碟上的最新版也已更新。' : '')
    };
  }
  // END word-file

  // BEGIN week-diff
  /**
   * 用途：比對表單現值與載入時的值，算出儲存要送的 `week`（只含改過的欄位）
   *   與 `baseWeek`（這些欄位載入時的值）。純函式，不碰 DOM、不碰 `state`。
   *
   *   ⚠️ 沒有出現在 `loaded` 的鍵，載入值當作空字串（與後端 `fieldsEqual_()`
   *   「空值＝空字串」一致），不是「沒有改動」。
   * Args:
   *   current {Object} 表單現值（機器鍵 → 值）。
   *   loaded {Object} 載入完成時的表單值（機器鍵 → 值）。
   *   skipKeys {string[]} 不可以送的鍵（內容表接管的欄位）。
   * Returns:
   *   {{week:Object, baseWeek:Object}} 兩者的鍵完全相同。
   */
  function diffWeekFields(current, loaded, skipKeys) {
    var week = {};
    var baseWeek = {};
    var skip = skipKeys || [];
    Object.keys(current || {}).forEach(function (key) {
      if (skip.indexOf(key) !== -1) return;
      var nowValue = current[key] === null || current[key] === undefined ? '' : String(current[key]);
      var loadedValue = loaded && loaded[key] !== null && loaded[key] !== undefined ? String(loaded[key]) : '';
      if (nowValue === loadedValue) return;
      week[key] = nowValue;
      baseWeek[key] = loadedValue;
    });
    return { week: week, baseWeek: baseWeek };
  }
  // END week-diff

  // BEGIN week-switch-guard（測試會把這一段連同 week-diff 抽出來在假環境上執行，請保持自足）
  /**
   * 用途：把事奉框的編輯表（鍵 `postId#slotIndex`）攤成「鍵 → 名字」，
   *   好交給 `diffWeekFields()` 比對。
   * Args:
   *   edits {Object} `state.dutyEdits` 或 `state.nextWeekDutyEdits`。
   * Returns:
   *   {Object<string,string>}
   */
  function dutyNameMap(edits) {
    var map = {};
    Object.keys(edits || {}).forEach(function (key) { map[key] = edits[key].name; });
    return map;
  }

  /**
   * 用途：這一週的表單或事奉框有沒有未儲存的改動。三處都重用
   *   `diffWeekFields()`（與「儲存」判斷改動用的是同一支），不另寫一套。
   * Args: （無，讀 `state` 與表單）
   * Returns:
   *   {boolean}
   */
  function hasUnsavedWeekChanges() {
    if (!state.loaded) return false;
    var fields = diffWeekFields(collectWeekFieldsFromForm(), state.loadedWeek, CONTENT_SHEET_WEEK_FIELDS);
    var duty = diffWeekFields(dutyNameMap(state.dutyEdits), state.loadedDutyNames, []);
    var nextDuty = diffWeekFields(dutyNameMap(state.nextWeekDutyEdits), state.loadedNextDutyNames, []);
    return Object.keys(fields.week).length + Object.keys(duty.week).length
      + Object.keys(nextDuty.week).length > 0;
  }

  /**
   * 用途：換週（下拉、上一個、下一個、換季）之前的保護：有未儲存的改動就先用
   *   頁內對話框問一次，沒有就直接做。
   * Args:
   *   proceed {function():void} 確定要換週時做的事。
   *   revert {function():void} 按取消時做的事（把下拉改回目前這一週）。
   * Returns:
   *   {void}
   */
  function confirmWeekChange(proceed, revert) {
    if (!hasUnsavedWeekChanges()) { proceed(); return; }
    openConfirmDialog('換週', ['這一週有未儲存的改動，換週會丟失這些改動。確定要換週嗎？'], function (accepted) {
      if (accepted) proceed(); else revert();
    });
  }
  // END week-switch-guard

  function populateSelectOptions(selectEl, options, labelFn) {
    selectEl.innerHTML = '';
    (options || []).forEach(function (opt) {
      var o = el('option');
      o.value = opt;
      o.textContent = labelFn ? labelFn(opt) : opt;
      selectEl.appendChild(o);
    });
  }

  function populatePrayerHeadingOptions(options) {
    var dl = document.getElementById('prayerBlockHeadingOptions');
    dl.innerHTML = '';
    (options || []).forEach(function (v) {
      var o = el('option');
      o.value = v;
      dl.appendChild(o);
    });
  }

  // =====================================================================
  // 可增刪清單（家事報告／代禱／團契／財政）
  // =====================================================================

  /**
   * ⚠️ R-011 起，這四張清單**全部改由內容表輸入**，這裡一律唯讀顯示。
   *   編輯要去內容表，然後按區塊上方的「重新匯入」。
   *
   *   刻意保留 `buildListRow()` 等可編輯的實作（暫時沒有呼叫方）——
   *   日後如果有某一張表要改回可編輯，改一個分支就得，不用重寫。
   */
  function renderList(type) {
    var def = LIST_DEFS[type];
    var container = document.getElementById(def.containerId);
    container.innerHTML = '';
    state.lists[type].forEach(function (item) {
      container.appendChild(buildReadOnlyListRow(def, item));
    });
    if (state.lists[type].length === 0) {
      var empty = el('div', 'hint');
      empty.textContent = '（本週未有資料。內容由內容表輸入，填好之後按上方的「重新匯入」。）';
      container.appendChild(empty);
    }
  }

  /**
   * 用途：把清單一項渲染成**唯讀**一行。
   */
  function buildReadOnlyListRow(def, item) {
    var row = el('div', 'repeatable-row readonly-row');
    var fieldsWrap = el('div', 'repeatable-row-fields');
    def.fields.forEach(function (f) {
      var cell = el('div', 'readonly-value');
      cell.textContent = (item[f.key] === null || item[f.key] === undefined || item[f.key] === '')
        ? '—' : String(item[f.key]);
      fieldsWrap.appendChild(cell);
    });
    row.appendChild(fieldsWrap);
    return row;
  }

  function buildListRow(type, def, item, idx) {
    var row = el('div', 'repeatable-row');

    var fieldsWrap = el('div', 'repeatable-row-fields');
    def.fields.forEach(function (f) {
      var inputEl = el(f.type === 'textarea' ? 'textarea' : 'input');
      if (f.type !== 'textarea') inputEl.type = 'text';
      if (f.type === 'textarea') inputEl.rows = 2;
      inputEl.placeholder = f.placeholder;
      inputEl.value = item[f.key] || '';
      inputEl.addEventListener('input', function () { item[f.key] = inputEl.value; });
      fieldsWrap.appendChild(inputEl);
    });
    row.appendChild(fieldsWrap);

    var actions = el('div', 'repeatable-row-actions');
    actions.appendChild(makeSmallButton('↑ 上移', function () { moveListItem(type, idx, -1); }));
    actions.appendChild(makeSmallButton('↓ 下移', function () { moveListItem(type, idx, 1); }));
    actions.appendChild(makeSmallButton('刪除', function () { removeListItem(type, idx); }, true));
    row.appendChild(actions);

    return row;
  }

  function makeSmallButton(label, onClick, danger) {
    var btn = el('button', 'btn btn-small' + (danger ? ' btn-danger' : ''));
    btn.type = 'button';
    btn.textContent = label;
    btn.addEventListener('click', onClick);
    return btn;
  }

  function moveListItem(type, idx, delta) {
    var arr = state.lists[type];
    var target = idx + delta;
    if (target < 0 || target >= arr.length) return;
    var tmp = arr[idx];
    arr[idx] = arr[target];
    arr[target] = tmp;
    renderList(type);
  }

  function removeListItem(type, idx) {
    state.lists[type].splice(idx, 1);
    renderList(type);
  }

  function addListItem(type) {
    var def = LIST_DEFS[type];
    var blank = { seqNo: null };
    def.fields.forEach(function (f) { blank[f.key] = ''; });
    state.lists[type].push(blank);
    renderList(type);
  }

  function renderAllLists() {
    Object.keys(LIST_DEFS).forEach(function (type) { renderList(type); });
  }

  // =====================================================================
  // 頂部統計與待填清單
  // =====================================================================

  /**
   * 用途：更新頂部「待填／警告／最後儲存時間」三個標籤與待填清單面板。
   *
   *   第二批測試修正 G14：面板逐行顯示用伺服器合併好的 `panel`（人數各格合併成一行，
   *   與寄出前檢查、本季待填清單一致）；徽章與面板標題的數字照舊數 `required`／
   *   `optional`（按格數計，與寄出前檢查「未填欄位（N 項）」相同）。
   * Args:
   *   missingSplit {{required:Object[], optional:Object[],
   *     panel:{required:Object[], optional:Object[]}}} 伺服器
   *     `missingSplitForWebApp_()` 的結果。
   *   warnings {Object[]} 警告清單。
   *   lastSavedAt {string} 伺服器正規化過的最後儲存時間。
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function renderStats(missingSplit, warnings, lastSavedAt) {
    // ⚠️ D-10：徽章那個數字**只數「一定要填」那一段**。
    //    獻花、翻譯這類正常就是空白的欄位永遠清不掉，一個永遠不會變零的
    //    數字等於沒有數字。它們仍然在下面的清單列出來，只是不計入。
    //
    //    F6：分成「一定要填」與「通常空白」由**伺服器**（`splitMissingList_()`）
    //    算好送來，這裏不再自己 filter——自己分一次就是第三份分類，
    //    日後兩邊判斷不同，同一週的數字就會在不同畫面對不上。
    var split = missingSplit || { required: [], optional: [], panel: { required: [], optional: [] } };
    var required = split.required || [];
    var optional = split.optional || [];

    document.getElementById('statMissing').textContent = '待填 ' + required.length + ' 項'
      + (optional.length > 0 ? '（另有 ' + optional.length + ' 項通常空白）' : '');
    document.getElementById('statWarnings').textContent = '警告 ' + (warnings ? warnings.length : 0) + ' 項';
    document.getElementById('statSaved').textContent = '最後儲存時間：' + formatTimestamp(lastSavedAt);
    // G14：面板的行用 panel（人數一行），數字用原本的清單（按格數計）。
    renderMissingPanel(split.panel, required.length, optional.length);
    renderWarningsPanel(warnings);
  }

  /**
   * 用途：**D-11**——「警告 N 項」撳開之後的清單。
   *
   *   ⚠️ 本來這個徽章不可以撳、也沒有 title，所以警告的內容**完全看不到**
   *   ——只見到一個數字，而數字本身講不出任何東西。與「待填」「衝突」
   *   兩個徽章看齊。
   * Args:
   *   warnings {Object[]} `apiLoadWeek()` 回傳的 `warnings`。
   * Returns:
   *   {void}
   */
  function renderWarningsPanel(warnings) {
    var panel = document.getElementById('warningsPanel');
    var list = warnings || [];
    if (list.length === 0) {
      panel.innerHTML = '（目前沒有警告）';
      return;
    }
    panel.innerHTML = '<ul>' + list.map(function (w) {
      var code = w.code ? ('<code>' + escapeHtml(w.code) + '</code>　') : '';
      return '<li>' + code + escapeHtml(w.message || String(w)) + '</li>';
    }).join('') + '</ul>';
  }

  /**
   * 用途：更新頂部「衝突 N 項」與可展開的分歧清單。有衝突時整個標籤
   *   變紅色——衝突跟「待填」不是同一種嚴重程度，要一眼分得出來。
   * Args:
   *   rosterDiff {Object} `apiLoadWeek()` 回傳的 `rosterDiff`。
   * Returns:
   *   {void}
   */
  function renderConflictStat(rosterDiff) {
    var diff = rosterDiff || { conflictCount: 0, rows: [] };
    var statEl = document.getElementById('statConflicts');
    statEl.textContent = '衝突 ' + diff.conflictCount + ' 項';
    statEl.classList.toggle('stat-conflict', diff.conflictCount > 0);

    var panel = document.getElementById('conflictPanel');
    var conflicts = (diff.rows || []).filter(function (r) { return r.status === 'CONFLICT'; });
    if (conflicts.length === 0) {
      panel.innerHTML = '（週報與職事表沒有衝突）';
      return;
    }
    panel.innerHTML =
      '<div><strong>職事表在你覆寫之後又改過的欄位：</strong></div><ul>'
      + conflicts.map(function (r) {
        return '<li>' + escapeHtml(r.postLabel) + ' #' + r.slotIndex
          + '　覆寫當時職事表＝' + escapeHtml(r.rosterValueAtOverride || '（空白）')
          + '　職事表現值＝' + escapeHtml(r.rosterName || '（空白）')
          + '　週報現值＝' + escapeHtml(r.bulletinName || '（空白）')
          + '</li>';
      }).join('')
      + '</ul><div>本系統不會改動職事表。如果週報的版本才是正確的，請自行到職事表更正。</div>';
  }

  /**
   * 用途：「待填 N 項」展開之後的清單面板，分「一定要填」與「通常空白」兩段。
   *
   *   第二批測試修正 G14：每一行來自伺服器合併好的清單（人數各格合併成一行
   *   「人數：N 格未填（上週崇拜人數由內容表輸入）」，字眼由伺服器
   *   attendanceMissingSummaryText_() 算好），標題括號內的數字由呼叫方按格數傳入，
   *   不數行數。
   * Args:
   *   lists {{required:Object[], optional:Object[]}} 顯示用的兩段清單，每項 {label, reason}。
   *   requiredCount {number} 一定要填的項數（按格數計）。
   *   optionalCount {number} 通常空白的項數（按格數計）。
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function renderMissingPanel(lists, requiredCount, optionalCount) {
    var panel = document.getElementById('missingPanel');
    var req = lists.required || [];
    var opt = lists.optional || [];

    if (requiredCount === 0 && optionalCount === 0) {
      panel.innerHTML = '（目前沒有待填項目）';
      return;
    }

    function itemsHtml(items) {
      return '<ul>' + items.map(function (m) {
        return '<li>' + escapeHtml(m.label) + '：' + escapeHtml(m.reason) + '</li>';
      }).join('') + '</ul>';
    }

    var html = '';
    // ⚠️ D-10：兩段刻意都列出來。第二段不計入徽章，但**看得見**——
    //    「正常空白」與「漏填」本來就不是二元的，真的漏填了獻花也有可能。
    if (requiredCount > 0) {
      html += '<div><strong>一定要填（' + requiredCount + ' 項）：</strong></div>' + itemsHtml(req);
    } else {
      html += '<div><strong>一定要填的都已經填好了。</strong></div>';
    }
    if (optionalCount > 0) {
      html += '<div class="missing-optional-head"><strong>通常空白，有就填（'
        + optionalCount + ' 項）：</strong>這幾項不計入上面那個數字。</div>' + itemsHtml(opt);
    }
    panel.innerHTML = html;
  }

  // =====================================================================
  // 主日下拉、載入、儲存、重新讀取職事表
  // =====================================================================

  function populateWeekSelect(weeks, defaultIsoDate) {
    var sel = document.getElementById('weekSelect');
    sel.innerHTML = '';
    weeks.forEach(function (w) {
      var o = el('option');
      o.value = w.isoDate;
      o.textContent = w.label + (w.status ? '　[' + w.status + ']' : '');
      if (w.isoDate === defaultIsoDate) o.selected = true;
      sel.appendChild(o);
    });
  }

  // BEGIN load-week（測試會把這一段抽出來執行；用到的其他函式由測試提供替身）
  /**
   * 用途：載入指定主日的完整資料。
   * Args:
   *   isoDate {string} 主日日期，yyyy-MM-dd。
   *   options {{keepMessage:boolean}=} 選填。`keepMessage:true` 時不清除
   *     目前顯示的訊息橫幅——`onSaveSuccess()` 剛顯示完「已儲存」之類的
   *     訊息、緊接著要呼叫這個函式重新整理畫面時要傳這個，否則訊息會
   *     被下面第一行的 `hideMessage()` 立刻清走（見 showMessage()
   *     的註解）。使用者自己在下拉選單切換主日則不傳，維持原本「換頁
   *     就清訊息」的行為。
   *
   *   第二批測試修正 G3／G9：發佈區塊的結果與已選的 PDF 跟主日走，不跟
   *   `keepMessage` 走——換到另一個主日一律清走，同一個主日重新載入就保留（見
   *   `resetPublishPanelIfWeekChanged()`）。
   * Returns:
   *   {void}
   * Raises:
   *   （無）伺服器錯誤經 `callServer()` 的 `onError` 顯示。
   */
  function loadWeek(isoDate, options) {
    var opts = options || {};
    if (!opts.keepMessage) hideMessage();
    // G3／G9：換到另一個主日就收起上一個主日的發佈／寄出結果、清走已選的 PDF；
    // 同一個主日保留。
    resetPublishPanelIfWeekChanged(state.isoDate, isoDate);
    setLoaded(false);
    callServer('apiLoadWeek', [isoDate],
      function (resp) { onWeekLoaded(isoDate, resp); },
      { busyText: '載入中…', onError: function (message) { setLoaded(false); showMessage('error', message); } });
  }
  // END load-week

  /**
   * 用途：一週載入成功之後，把伺服器資料放進 `state` 並渲染整個畫面。
   *   表單填好之後立即記下 `state.loadedWeek`（F1：儲存時只送跟它不同的欄位）。
   * Args:
   *   isoDate {string} 主日日期。
   *   resp {{ok:boolean, data:Object, error:Object}} `apiLoadWeek` 的回應。
   * Returns:
   *   {void}
   */
  function onWeekLoaded(isoDate, resp) {
    if (!resp.ok) { setLoaded(false); showMessage('error', resp.error.message); return; }
    var data = resp.data;

    state.isoDate = isoDate;
    state.lastSavedAt = data.lastSavedAt;
    state.week = data.week;
    state.lists = data.lists;
    state.options = data.options;
    state.quarterId = data.quarterId || null;

    // R-034：不論由下拉、箭嘴，還是直接跳轉載入，兩個下拉都要對準這一期。
    syncSelectorsTo(isoDate);
    // R-036：本季職事表狀態的黃色橫幅。
    renderRosterGapBanner(data.rosterGapBanner);

    populateSelectOptions(document.getElementById('programTemplateSelect'), data.options.programTemplateIds);
    populateSelectOptions(document.getElementById('recitationSelect'), data.options.recitationOptions,
      function (v) { return v || '（留空＝自動）'; });
    populatePrayerHeadingOptions(data.options.prayerBlockHeadingOptions);
    document.getElementById('attCantoneseSubLabel').textContent = '粵語堂' + (data.options.cantoneseSubColumnLabel || '主堂');

    applyWeekFieldsToForm();
    // F1：基準值要在「表單剛填好」這一刻記下，取表單實際顯示的值（下拉選單
    // 配不到選項時會變成空白，基準值要跟畫面一致，才不會把沒動過的欄位當成改動）。
    state.loadedWeek = collectWeekFieldsFromForm();
    renderAllLists();
    renderReadOnly(data.readOnly);
    // 換週保護：兩個事奉框剛畫好、使用者還沒動過，這一刻的名字就是「載入時的值」。
    state.loadedDutyNames = dutyNameMap(state.dutyEdits);
    state.loadedNextDutyNames = dutyNameMap(state.nextWeekDutyEdits);
    renderStats(data.missingSplit, data.warnings, data.lastSavedAt);
    renderConflictStat(data.rosterDiff);
    renderFillGridLink(data.fillGridUrl);
    renderPreviewLink(data.previewUrl);
    renderWordFileInfo(data.wordFile);
    refreshSnapshotPanel();
    renderProgramPreview(data.readOnly.program);
    // R-011：一定要排在 applyWeekFieldsToForm() 之後——先填值，再把那幾個
    // 欄位設成唯讀，否則設定 readOnly 之後再寫值會看起來像可以編輯。
    applyContentSheetReadOnly(data.contentSheet);
    document.getElementById('publishServiceDate').textContent = isoDate;
    setLoaded(true);
  }

  /**
   * 用途：顯示／隱藏頂部的「開啟本季填寫表」連結（第八輪）。
   *
   *   ⚠️ 網址是空字串（格子表未建立）時**隱藏整個按鈕**——顯示一條開
   *   不到的連結比不顯示更差，使用者會以為系統壞了。
   * Args:
   *   url {string} 直達季度填寫表的網址；空字串代表未建立。
   * Returns:
   *   {void}
   */
  /**
   * 用途：畫出（或者收起）「開啟預覽」那條連結（R-033）。
   *
   *   ⚠️ 取不到網址就**不顯示**，與填寫表那一條同一個道理：一條開不到
   *   的連結比不顯示更差，使用者會以為系統壞了。取不到的常見原因是
   *   Config 的 PREVIEW_WEBAPP_URL 未填而且 ScriptApp 那一支拿不到。
   * Args:
   *   url {string} 預覽網址；空字串代表取不到。
   * Returns:
   *   {void}
   */
  function renderPreviewLink(url) {
    var link = document.getElementById('previewLink');
    if (!url) {
      link.classList.add('hidden');
      link.removeAttribute('href');
      return;
    }
    link.href = url;
    link.classList.remove('hidden');
  }

  function renderFillGridLink(url) {
    var link = document.getElementById('fillGridLink');
    if (!url) {
      link.classList.add('hidden');
      link.removeAttribute('href');
      return;
    }
    link.href = url;
    link.classList.remove('hidden');
  }

  function reloadRosterOnly() {
    if (!state.isoDate) return;
    if (state.inFlight > 0) return;
    hideMessage();
    callServer('apiLoadWeek', [state.isoDate], onRosterReloaded, { busyText: '讀取職事表中…' });
  }

  /**
   * 只更新唯讀區塊（事奉框、下週事奉、程序預覽）與統計，**不動可編輯
   * 表單**——理由跟這個按鈕原本的設計一致：使用者可能正在填寫、尚未
   * 儲存，這個按鈕的用途是核對職事表最新內容，不是重新載入整份資料。
   * 訊息文案由伺服器的 buildRosterReloadMessage_() 算好，直接顯示。
   */
  function onRosterReloaded(resp) {
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    renderReadOnly(resp.data.readOnly);
    renderStats(resp.data.missingSplit, resp.data.warnings, state.lastSavedAt);
    renderConflictStat(resp.data.rosterDiff);
    renderProgramPreview(resp.data.readOnly.program);
    var msg = resp.data.rosterReloadMessage;
    showMessage(msg.type, msg.text);
  }

  /**
   * ⚠️ R-011：**四張清單與內容表接管的欄位一律不再送**。
   *
   *   後端 `assertContentSheetFieldsNotSubmitted_()` 會擋住帶內容的送出，
   *   但前端也要自己不送——兩邊都做，不是重複：後端擋的是「有人繞過介面」，
   *   前端不送的是「介面自己不要製造出一個會被拒絕的請求」。
   */
  function buildSavePayload() {
    // F1：只送使用者真的改過的欄位，另送它們載入時的值（baseWeek）。
    // 沒有改動的欄位一律不送，否則較早載入的分頁會把別處剛寫入的值蓋回舊值。
    var parts = diffWeekFields(collectWeekFieldsFromForm(), state.loadedWeek, CONTENT_SHEET_WEEK_FIELDS);

    return {
      isoDate: state.isoDate,
      lastSavedAt: state.lastSavedAt,
      baseWeek: parts.baseWeek,
      week: parts.week,
      dutyEdits: Object.keys(state.dutyEdits).map(function (k) { return state.dutyEdits[k]; }),
      // R-040：送去後端之後，後端會用**下一個主日**的日期寫 DutyOverride。
      nextWeekDutyEdits: Object.keys(state.nextWeekDutyEdits)
        .map(function (k) { return state.nextWeekDutyEdits[k]; })
    };
  }

  function setSaveButtonText(text) {
    document.getElementById('saveBtn').textContent = text;
  }

  /**
   * 用途：撳「儲存」的處理函式。
   *
   *   防止重複提交分兩層：按鈕在 `inFlight > 0` 時 `disabled`（視覺層，
   *   見 applyBusyState()），這裡再加 `if (state.inFlight > 0) return;`
   *   （邏輯層）——兩層都要有，因為鍵盤 Enter 或瀏覽器擴充功能有機會
   *   繞過 `disabled` 屬性直接觸發 click。
   * Returns:
   *   {void}
   */
  function saveWeek() {
    if (!state.isoDate) return;
    if (state.inFlight > 0) return;
    if (!state.loaded) {
      showMessage('error', '資料未載入成功，無法儲存');
      return;
    }
    hideMessage();
    setSaveButtonText('儲存中…');
    callServer('apiSaveWeek', [buildSavePayload()], onSaveSuccess, {
      busyText: '儲存中…',
      // 失敗時一定要把按鈕文字改回來，否則會一直寫著「儲存中…」，
      // 看起來像仍然在跑。
      onError: function (message) { setSaveButtonText('儲存'); showMessage('error', message); }
    });
  }

  /**
   * 失敗 → 紅色橫幅，伺服器已經給了講清楚原因的訊息（含 STALE 時的
   * 兩個時間、SCHEMA_OUTDATED 的落差摘要），前端原樣顯示即可。成功時
   * 的文案（綠色「已儲存，更新了 N 個欄位」；G16：欄位沒有改變而只更新了
   * 覆寫記錄時是綠色「已儲存。欄位內容沒有改變，只更新了 N 筆覆寫記錄……」；
   * 或藍色「沒有偵測到任何改動」）由伺服器的 buildSaveResultMessage_() 算好，前端不再自己
   * 砌字串。顯示完訊息之後呼叫 loadWeek() 重新整理畫面，**一定要傳
   * `{ keepMessage: true }`**，否則訊息會被 loadWeek() 開頭的
   * hideMessage() 立刻清走（見 showMessage() 的註解）。
   */
  function onSaveSuccess(resp) {
    setSaveButtonText('儲存');
    if (!resp.ok) {
      showMessage('error', resp.error.message);
      return;
    }
    var msg = resp.data.message;
    showMessage(msg.type, msg.text);
    loadWeek(state.isoDate, { keepMessage: true });

    // ⚠️ D-9：主日下拉的「待填 N 項」標籤要一併刷新。
    //    本來只有頂部徽章更新，下拉仍然顯示儲存之前那個數字——同一個狀態
    //    有兩個來源，而兩個對不上的時候，幹事會信下拉那個（它比較顯眼）。
    refreshWeekSelectorLabels();
  }

  /**
   * 用途：**D-9**——重新拿一次主日清單，只為了更新下拉的狀態標籤。
   *
   *   ⚠️ 用 `busy:'preview'`：這是一個背景刷新，不應該把整個介面鎖住。
   *   失敗也不出紅色橫幅——標籤舊咗一次不是錯誤，而剛剛那個儲存是成功的，
   *   彈一句紅色訊息只會令人以為儲存失敗。
   * Returns:
   *   {void}
   */
  function refreshWeekSelectorLabels() {
    callServer('apiListWeeks', [state.showArchived], function (resp) {
      if (!resp.ok || !resp.data) return;
      populateWeekSelectors(resp.data, state.isoDate);
    }, {
      busy: 'preview',
      onError: function () { /* 標籤舊咗一次不是錯誤，靜靜略過 */ }
    });
  }

  // =====================================================================
  // 由職事表重新取數
  // =====================================================================

  /**
   * 用途：撳「由職事表重新取數」——**不會立即寫入**，只是去伺服器拿一份
   *   比對清單，然後彈出對話框讓使用者逐項勾選。真正的寫入要等撳「確定」。
   * Returns:
   *   {void}
   */
  function openFetchFromRosterDialog() {
    if (!state.isoDate) return;
    if (state.inFlight > 0) return;
    hideMessage();
    callServer('apiGetRosterFetchCandidates', [state.isoDate], onFetchCandidatesLoaded,
      { busyText: '讀取職事表中…' });
  }

  function onFetchCandidatesLoaded(resp) {
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    state.fetchCandidates = resp.data.rows || [];
    renderFetchDialog();
    document.getElementById('fetchDialogBackdrop').classList.remove('hidden');
  }

  /**
   * 用途：渲染對話框內容。只列出 `CONFLICT` 與 `OVERRIDDEN` 的行——
   *   `FOLLOW` 已經自動處理好、`SAME` 根本沒有東西會變，兩者都沒有
   *   「要不要取數」這個選擇可言。`CONFLICT` 預設勾選、`OVERRIDDEN`
   *   預設不勾選（由伺服器算好的 `defaultChecked` 決定）。
   * Returns:
   *   {void}
   */
  function renderFetchDialog() {
    var body = document.getElementById('fetchDialogBody');
    var footnote = document.getElementById('fetchDialogFootnote');
    var confirmBtn = document.getElementById('fetchConfirmBtn');
    body.innerHTML = '';

    if (state.fetchCandidates.length === 0) {
      var empty = el('div', 'dialog-empty');
      empty.textContent = '週報與職事表一致，沒有需要取數的欄位。';
      body.appendChild(empty);
      footnote.classList.add('hidden');
      confirmBtn.classList.add('hidden');
      return;
    }
    footnote.classList.remove('hidden');
    confirmBtn.classList.remove('hidden');

    var table = el('table');
    table.innerHTML = '<thead><tr><th></th><th>崗位</th><th>位次</th><th>你的覆寫值</th><th>職事表現值</th></tr></thead>';
    var tbody = el('tbody');

    state.fetchCandidates.forEach(function (row, idx) {
      var tr = el('tr');
      if (row.status === 'CONFLICT') tr.classList.add('is-conflict');

      var tdCheck = el('td');
      var checkbox = el('input');
      checkbox.type = 'checkbox';
      checkbox.checked = Boolean(row.defaultChecked);
      checkbox.setAttribute('data-fetch-index', String(idx));
      tdCheck.appendChild(checkbox);
      tr.appendChild(tdCheck);

      [row.postLabel, String(row.slotIndex), row.bulletinName || '（空白）', row.rosterName || '（空白）']
        .forEach(function (text) {
          var td = el('td');
          td.textContent = text;
          tr.appendChild(td);
        });

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    body.appendChild(table);
  }

  function setAllFetchCheckboxes(checked) {
    var boxes = document.querySelectorAll('#fetchDialogBody input[type="checkbox"]');
    for (var i = 0; i < boxes.length; i++) boxes[i].checked = checked;
  }

  function closeFetchDialog() {
    document.getElementById('fetchDialogBackdrop').classList.add('hidden');
  }

  /**
   * 用途：撳對話框的「確定」——把勾選的欄位送去伺服器，改回跟隨職事表。
   * Returns:
   *   {void}
   */
  function confirmFetchFromRoster() {
    var selections = [];
    var boxes = document.querySelectorAll('#fetchDialogBody input[type="checkbox"]');
    for (var i = 0; i < boxes.length; i++) {
      if (!boxes[i].checked) continue;
      var row = state.fetchCandidates[Number(boxes[i].getAttribute('data-fetch-index'))];
      if (row) selections.push({ postId: row.postId, slotIndex: row.slotIndex });
    }

    closeFetchDialog();
    if (selections.length === 0) {
      showMessage('info', '沒有勾選任何欄位，沒有做任何改動。');
      return;
    }

    callServer('apiFetchFromRoster', [state.isoDate, selections], function (resp) {
      if (!resp.ok) { showMessage('error', resp.error.message); return; }
      showMessage(resp.data.message.type, resp.data.message.text);
      // 重新載入才看得到新的名單與衝突狀態；一定要保留剛顯示的訊息。
      loadWeek(state.isoDate, { keepMessage: true });
    }, { busyText: '由職事表重新取數中…' });
  }

  // =====================================================================
  // 程序表即時預覽
  // =====================================================================

  function schedulePreviewRefresh() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(refreshPreview, 350);
  }

  /**
   * 即時預覽用自己的 previewInFlight 計數器（beginPreview／endPreview），
   * **不呼叫** beginRequest()／endRequest()——預覽每次打字都會觸發，
   * 不可以停用整個介面，尤其不可以停用輸入框本身，否則使用者會打不了字。
   */
  function refreshPreview() {
    if (!state.isoDate) return;
    var draft = collectWeekFieldsFromForm();
    callServer('apiPreviewProgram', [state.isoDate, draft], function (resp) {
      if (resp.ok) renderProgramPreview(resp.data.rows);
    }, {
      busy: 'preview',
      // 預覽失敗不打擾使用者，維持上一次的預覽內容；但仍然要回報，
      // 否則「預覽一直不更新」這件事永遠沒有人知道。
      onError: function () {}
    });
  }

  // =====================================================================
  // 發佈及匯出（R-002 至 R-008）
  // =====================================================================

  /**
   * 用途：載入頂部狀態列與發佈區塊要用的資料。
   *
   *   ⚠️ 這一組資料不隨主日下拉改變，所以只在開頁時載入一次，之後
   *   只有「發佈成功」才重新載入。
   * Returns:
   *   {void}
   */
  function loadPublishPanel() {
    callServer('apiGetPublishStatus', [], onPublishPanelLoaded, {
      busy: 'none',
      // 狀態列載不到不應該擋住整個填寫介面——照樣寫一句，其餘功能照用。
      onError: function () {
        document.getElementById('publishStatusText').textContent = '發佈狀態載入失敗，其餘功能不受影響。';
      }
    });
  }

  function onPublishPanelLoaded(resp) {
    if (!resp || !resp.ok) {
      document.getElementById('publishStatusText').textContent = '發佈狀態載入失敗，其餘功能不受影響。';
      return;
    }
    state.publish.panel = resp.data;
    renderPublishStatus(resp.data.status);
    renderPublishGroups(resp.data.groupOptions, (resp.data.prefs || {}).groups || resp.data.defaultGroups);

    document.getElementById('doPublishCheck').checked = (resp.data.prefs || {}).doPublish === true;
    document.getElementById('doSendCheck').checked = (resp.data.prefs || {}).doSend === true;
    applyPublishSubStates();

    // 使用者測試期間的兩條保險（見 Index.html 開頭那兩個常駐橫幅的說明）：
    // 一律放在整頁最頂端，不藏在「發佈及匯出」區塊裏面。
    document.getElementById('dryRunTopBanner').classList.toggle('hidden', resp.data.dryRun !== true);

    var testBanner = document.getElementById('testModeTopBanner');
    var testText = String(resp.data.testModeBanner || '').trim();
    testBanner.textContent = testText;
    testBanner.classList.toggle('hidden', !testText);
  }

  /**
   * 用途：畫頂部那一行常駐狀態（R-008）。
   * Args:
   *   status {Object} `buildPublishStatusForWebApp_()` 的回傳值。
   * Returns:
   *   {void}
   */
  function renderPublishStatus(status) {
    var s = status || {};
    document.getElementById('publishStatusText').textContent = s.text || '';

    // ⚠️ 只有**一顆**連結，是正常的 HTML <a>——之前這裏同時放了兩顆
    // 文字重疊的按鈕（「開啟」＋「開啟目前已發佈的 PDF」），視覺上看
    // 起來像「開啟開啟目前已發佈的 PDF」，見 docs/已知bug類型.md
    // 事故二十六。用 `view`（新分頁開啟）而不是 `download`：手上不會
    // 多一個容易選錯、拿去重新上載的檔案。
    var link = document.getElementById('publishStatusLink');
    var canOpen = Boolean(s.hasMaster && s.links && s.links.view);
    link.classList.toggle('hidden', !canOpen);
    if (canOpen) link.href = s.links.view;

    var hint = document.getElementById('publishStatusHint');
    var needsSetup = !s.hasMaster;
    hint.classList.toggle('hidden', !needsSetup);
    if (needsSetup) {
      hint.textContent = '請先在試算表按「週報系統 ▸ 建立 master 發佈檔案」建立一次，之後那一條連結就永遠不變。';
    }
  }

  function renderPublishGroups(options, checkedKeys) {
    var box = document.getElementById('publishGroupOptions');
    box.innerHTML = '';
    var checked = checkedKeys || [];
    (options || []).forEach(function (opt) {
      var label = document.createElement('label');
      var input = document.createElement('input');
      input.type = 'checkbox';
      input.value = opt.key;
      input.setAttribute('data-publish-group', opt.key);
      input.checked = checked.indexOf(opt.key) !== -1;
      input.addEventListener('change', savePublishPrefs);
      label.appendChild(input);
      label.appendChild(document.createTextNode(opt.label));
      box.appendChild(label);
    });
  }

  function selectedPublishGroups() {
    return Array.prototype.map.call(
      document.querySelectorAll('[data-publish-group]:checked'),
      function (input) { return input.value; }
    );
  }

  /**
   * 用途：兩個勾選各自獨立（R-003），但沒有勾的那一段要看得出是停用的。
   * Returns:
   *   {void}
   */
  function applyPublishSubStates() {
    document.getElementById('publishFileRow').classList
      .toggle('is-disabled', !document.getElementById('doPublishCheck').checked);
    document.getElementById('publishSendRow').classList
      .toggle('is-disabled', !document.getElementById('doSendCheck').checked);
  }

  function savePublishPrefs() {
    callServer('apiSavePublishPrefs', [{
      doPublish: document.getElementById('doPublishCheck').checked,
      doSend: document.getElementById('doSendCheck').checked,
      groups: selectedPublishGroups()
    }], function () {}, {
      busy: 'none',
      // 記住勾選只是方便，存不到不用打擾使用者。
      onError: function () {}
    });
  }

  // BEGIN publish-run（測試會把這一段抽出來執行；用到的其他函式由測試提供替身）
  /**
   * 用途：把使用者選的 PDF 讀成 base64 存進 `state.publish`，並記下揀檔時的主日。
   *
   *   ⚠️ `FileReader.readAsDataURL()` 回的是 `data:application/pdf;base64,xxx`，
   *   要把逗號之前那一截切走才是純 base64。
   *
   *   ⚠️ 第二批測試修正 G9：讀檔是非同步的。揀檔之後、讀完之前換了主日的話，
   *   讀完那一刻畫面已經是另一週，這個 PDF 不屬於它——讀完時主日不同就丟棄，
   *   不放進 `state.publish`。`runPublish()` 另外再核對 `pdfIsoDate` 一次。
   * Args:
   *   event {Event} `change` 事件。
   * Returns:
   *   {void}
   * Raises:
   *   （無）讀檔失敗經訊息列顯示。
   */
  function onPublishPdfChosen(event) {
    var file = event.target.files && event.target.files[0];
    state.publish.pdfBase64 = '';
    state.publish.pdfName = '';
    state.publish.pdfIsoDate = '';
    document.getElementById('publishPdfName').textContent = '未選擇';
    if (!file) return;
    var chosenIsoDate = state.isoDate;

    var limitMb = (state.publish.panel && state.publish.panel.maxPdfMb) || 10;
    if (file.size > limitMb * 1024 * 1024) {
      // 前端先擋一次純粹是為了不要白白上載幾 MB；真正把關的是後端
      // `validateUploadedPdf_()`——只擋前端等於沒有擋。
      showMessage('error', '這個檔案有 ' + (Math.round(file.size / 1024 / 1024 * 100) / 100)
        + ' MB，超過上限 ' + limitMb + ' MB。請在 Word 另存 PDF 時選擇較低的圖片解析度。');
      event.target.value = '';
      return;
    }

    var reader = new FileReader();
    reader.onload = function () {
      // G9：讀完時已經換了主日 → 丟棄，畫面維持「未選擇」。
      if (state.isoDate !== chosenIsoDate) return;
      var text = String(reader.result || '');
      var comma = text.indexOf(',');
      state.publish.pdfBase64 = comma === -1 ? '' : text.slice(comma + 1);
      state.publish.pdfName = file.name;
      state.publish.pdfIsoDate = chosenIsoDate;
      document.getElementById('publishPdfName').textContent = file.name;
    };
    reader.onerror = function () {
      showMessage('error', '讀取這個 PDF 檔案時出錯，請重新選擇一次。');
    };
    reader.readAsDataURL(file);
  }

  /**
   * 用途：撳「執行」。第一次呼叫不帶 `confirmed`，讓後端決定要不要出
   *   確認視窗。
   *
   *   第二批測試修正 G9：要發佈時，已選的 PDF 一定要是在目前這個主日揀的
   *   （`state.publish.pdfIsoDate === state.isoDate`），否則拒絕，一個請求都不送。
   * Args:
   *   confirmed {boolean} 幹事是否已經勾了「仍然要發佈」那一格。
   * Returns:
   *   {void}
   * Raises:
   *   （無）拒絕與伺服器錯誤都經訊息列與確認視窗顯示。
   */
  function runPublish(confirmed) {
    if (!state.isoDate) { showMessage('error', '未選擇主日，無法執行。'); return; }

    var doPublish = document.getElementById('doPublishCheck').checked;
    var doSend = document.getElementById('doSendCheck').checked;
    if (!doPublish && !doSend) {
      showMessage('error', '請至少勾選「發佈到 master 連結」或「寄出」其中一項，然後再按執行。');
      return;
    }
    if (doPublish && !state.publish.pdfBase64) {
      showMessage('error', '勾選了「發佈到 master 連結」，但尚未選擇 PDF 檔案。'
        + '請先按「下載 Word」，用 Word 開啟核對，另存為 PDF，然後在這裏選那個 PDF。');
      return;
    }
    if (doPublish && state.publish.pdfIsoDate !== state.isoDate) {
      // G9：確認視窗是 modal，會蓋住訊息列，所以視窗內也寫一份。
      showMessage('error', PUBLISH_PDF_WEEK_CHANGED_MESSAGE);
      showPublishConfirmError(PUBLISH_PDF_WEEK_CHANGED_MESSAGE);
      return;
    }

    hideMessage();
    setPublishButtonsBusy(true, doPublish ? '發佈中…' : '寄出中…');

    callServer('apiRunPublish', [{
      isoDate: state.isoDate,
      doPublish: doPublish,
      doSend: doSend,
      pdfBase64: doPublish ? state.publish.pdfBase64 : '',
      pdfName: state.publish.pdfName,
      groups: selectedPublishGroups(),
      customEmails: document.getElementById('publishCustomEmails').value,
      confirmed: confirmed === true
    }], function (resp) {
      setPublishButtonsBusy(false);
      onPublishDone(resp);
    }, {
      busyText: doPublish ? '發佈中…' : '寄出中…',
      // ⚠️ 失敗一定要（1）把按鈕還原、（2）**在確認視窗之內**顯示紅字。
      // 視窗是 modal，蓋住了下面那條訊息列——錯誤寫在下面等於沒有寫。
      onError: function (message) {
        setPublishButtonsBusy(false);
        showPublishConfirmError(message);
        showPublishResult(message, true);
        showMessage('error', message);
      }
    });
  }

  /** G9：已選的 PDF 是在另一個主日揀的，拒絕發佈時的提示。 */
  var PUBLISH_PDF_WEEK_CHANGED_MESSAGE = '揀檔之後換了主日，請重新揀這一週的 PDF。';
  // END publish-run

  /**
   * 用途：撳下去之後立即停用兩顆「執行／確認發佈」按鈕並改文字，成功或
   *   失敗都要還原（第 3 部分）。
   *
   *   ⚠️ 這是防重複的**第一道**防線，不是唯一一道：後端另外有指令碼鎖
   *   與「N 秒內同一主日不再產生新版本」的判斷。只擋前端等於沒有擋。
   * Args:
   *   busy {boolean} 是否忙碌中。
   *   text {string=} 忙碌時要顯示的按鈕文字。
   * Returns:
   *   {void}
   */
  function setPublishButtonsBusy(busy, text) {
    var runBtn = document.getElementById('publishRunBtn');
    var okBtn = document.getElementById('publishConfirmOkBtn');
    runBtn.disabled = busy === true;
    runBtn.textContent = busy ? (text || '處理中…') : '執行';
    okBtn.disabled = busy === true
      ? true
      : !document.getElementById('publishForcedCheck').checked;
    okBtn.textContent = busy ? (text || '處理中…') : (state.publish.confirmButton || '確認發佈');
  }

  /**
   * 用途：在發佈前檢查視窗**之內**顯示一段紅色錯誤訊息。
   * Args:
   *   message {string} 空字串代表清走。
   * Returns:
   *   {void}
   */
  function showPublishConfirmError(message) {
    var box = document.getElementById('publishConfirmError');
    box.textContent = message || '';
    box.classList.toggle('hidden', !message);
  }

  /**
   * 用途：「執行」發佈／寄出的回應處理。需要確認時打開發佈前檢查視窗，
   *   並帶上伺服器按這次動作算好的字眼（F7：只寄出時不出現「發佈」）。
   * Args:
   *   resp {{ok:boolean, data:Object, error:Object}} `apiRunPublish` 的回應。
   * Returns:
   *   {void}
   */
  function onPublishDone(resp) {
    // 伺服器層的失敗（例外、權限）——訊息同時放在視窗內與訊息列，
    // 因為視窗是 modal，只寫訊息列的話會被蓋住。
    if (!resp.ok) {
      showPublishConfirmError(resp.error.message);
      showPublishResult(resp.error.message, true);
      showMessage('error', resp.error.message);
      return;
    }

    var data = resp.data;
    if (!data.ok && data.reason === 'NEEDS_CONFIRM') {
      openPublishConfirm(data.lines, data.labels);
      return;
    }
    if (!data.ok) {
      // 業務層的拒絕（揀錯檔案、拿不到鎖、格式不對……）。同樣要在視窗內
      // 顯示——這一段訊息正正是使用者最需要看到的那一句。
      showPublishConfirmError(data.message || '未能執行。');
      showPublishResult(data.message || '未能執行。', true);
      showMessage('error', data.message || '未能執行。');
      return;
    }

    closePublishConfirm();
    showPublishResult((data.lines || []).join('\n'), false);
    showMessage('info', data.duplicate
      ? '剛才已經發佈過（第 ' + data.published.versionNo + ' 版），這一次沒有再產生新版本。'
      : (data.published ? '已發佈第 ' + data.published.versionNo + ' 版。' : '已完成。'));

    // 發佈成功之後才需要刷新狀態列；只寄出不會改變「目前已發佈」那一行，
    // 不過一併刷新也無害，而且 `SENT` 欄位可能有更新。
    loadPublishPanel();
  }

  // BEGIN publish-result（測試會把這一段連同 load-week 抽出來在假 DOM 上執行，請保持自足）
  /**
   * 用途：在發佈區塊下面顯示一次發佈／寄出的結果（或錯誤）。
   * Args:
   *   text {string} 要顯示的內容（多行用換行分隔，以 textContent 顯示）。
   *   isError {boolean=} `true` 時用紅色樣式。
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function showPublishResult(text, isError) {
    var box = document.getElementById('publishResult');
    box.textContent = text;
    box.classList.remove('hidden');
    box.classList.toggle('is-error', isError === true);
  }

  /**
   * 用途：清空並收起發佈區塊的結果。
   * Args: （無）
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function clearPublishResult() {
    var box = document.getElementById('publishResult');
    box.textContent = '';
    box.classList.add('hidden');
    box.classList.remove('is-error');
  }

  /**
   * 用途：清走已選的 PDF（記憶體內的內容、檔名、揀檔時的主日），檔案選擇框
   *   清空，旁邊改回「未選擇」。
   *
   *   ⚠️ 檔案選擇框一定要清空：不清的話，再揀同一個檔案瀏覽器不會觸發
   *   `change`，`onPublishPdfChosen()` 根本不會執行。
   * Args: （無）
   * Returns:
   *   {void}
   * Raises:
   *   （無）
   */
  function clearChosenPublishPdf() {
    state.publish.pdfBase64 = '';
    state.publish.pdfName = '';
    state.publish.pdfIsoDate = '';
    document.getElementById('publishPdfInput').value = '';
    document.getElementById('publishPdfName').textContent = '未選擇';
  }

  /**
   * 用途：第二批測試修正 G3／G9：載入另一個主日時，收起上一個主日的發佈／寄出
   *   結果，並清走已選的 PDF。
   *
   *   ⚠️ 發佈區塊標題寫著「主日：新的日期」，下面卻仍然掛著上一個主日的
   *   「已記錄 1 個收件人」，幹事會以為新的那一週已經寄出（G3）；已選的 PDF
   *   也仍然在，勾發佈就會把上一週的 PDF 當成這一週發佈出去（G9）。兩者都只屬於
   *   那一個主日，所以按日期判斷：日期不同就清走；同一個主日重新載入（例如
   *   儲存、發佈、還原、重設之後 `loadWeek(state.isoDate, {keepMessage:true})`）
   *   就保留，免得剛顯示的結果與剛揀的 PDF 被緊接的重新載入清走。
   * Args:
   *   previousIsoDate {?string} 目前畫面上的主日（`state.isoDate`；第一次載入是空）。
   *   nextIsoDate {string} 將要載入的主日。
   * Returns:
   *   {boolean} 有沒有清走。
   * Raises:
   *   （無）
   */
  function resetPublishPanelIfWeekChanged(previousIsoDate, nextIsoDate) {
    if (String(previousIsoDate || '') === String(nextIsoDate || '')) return false;
    clearPublishResult();
    clearChosenPublishPdf();
    return true;
  }
  // END publish-result

  /**
   * 用途：打開發佈前檢查視窗。
   * Args:
   *   lines {string[]} 伺服器排好的內容行。
   *   labels {{title:string, checkbox:string, confirmButton:string}=} 伺服器
   *     按「這次做甚麼」算好的字眼（F7：只寄出時不可以出現「發佈」）。
   * Returns:
   *   {void}
   */
  function openPublishConfirm(lines, labels) {
    var l = labels || { title: '發佈前檢查', checkbox: '我明白以上情況，仍然要發佈', confirmButton: '確認發佈' };
    document.getElementById('publishConfirmTitle').textContent = l.title;
    document.getElementById('publishForcedLabel').textContent = l.checkbox;
    state.publish.confirmButton = l.confirmButton;
    document.getElementById('publishConfirmOkBtn').textContent = l.confirmButton;
    var body = document.getElementById('publishConfirmBody');
    body.textContent = (lines || []).join('\n');
    showPublishConfirmError('');
    document.getElementById('publishForcedCheck').checked = false;
    document.getElementById('publishConfirmOkBtn').disabled = true;
    document.getElementById('publishConfirmBackdrop').classList.remove('hidden');
  }

  function closePublishConfirm() {
    showPublishConfirmError('');
    document.getElementById('publishConfirmBackdrop').classList.add('hidden');
  }

  /**
   * 用途：下載這一期的 Word 檔（R-005）。
   *
   *   後端回 base64，前端還原成 Blob 再觸發下載——Apps Script 的
   *   `google.script.run` 傳不了二進位，所以一定要經 base64。
   * Returns:
   *   {void}
   */
  function downloadWord() {
    if (!state.isoDate) { showMessage('error', '未選擇主日，無法下載。'); return; }
    hideMessage();
    callServer('apiDownloadBulletinDocx', [state.isoDate], function (resp) {
      if (!resp.ok) { showMessage('error', resp.error.message); return; }
      triggerBinaryDownload(resp.data.base64, resp.data.fileName,
        'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      if (resp.data.wordFile) renderWordFileInfo(resp.data.wordFile);
      var done = downloadWordMessage(resp.data);
      showMessage(done.type, done.text);
    }, { busyText: '產生 Word 檔中…' });
  }

  function triggerBinaryDownload(base64, fileName, mimeType) {
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

    var url = URL.createObjectURL(new Blob([bytes], { type: mimeType }));
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // 立刻釋放會令部分瀏覽器來不及開始下載，延後一拍。
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  // =====================================================================
  // R-034：兩層主日選單（季度 → 主日）
  // =====================================================================

  /**
   * 用途：勾選／取消勾選「顯示已封存」之後重新載入季度清單（R-035）。
   * Returns:
   *   {void}
   */
  function onShowArchivedChanged() {
    state.showArchived = document.getElementById('showArchivedCheck').checked === true;
    callServer('apiListWeeks', [state.showArchived], onWeeksLoaded, { busyText: '載入中…' });
  }

  /**
   * 用途：畫出（或者收起）「目前沒有未封存的季度」那一句提示（R-035）。
   *
   *   ⚠️ 這一句是這一條功能最重要的防線。沒有它的話，十月回來打開系統
   *   會見到一個**空白的季度下拉**，完全看不出「資料仍然在，只是被封存了」
   *   ——那會令人以為系統把整年的資料弄丟了。
   * Args:
   *   data {Object} `apiListWeeks()` 的 `data`。
   * Returns:
   *   {void}
   */
  function renderQuarterEmptyHint(data) {
    var hint = document.getElementById('quarterEmptyHint');
    var text = (data && data.emptyHint) ? data.emptyHint : '';
    if (!text) {
      hint.classList.add('hidden');
      hint.textContent = '';
      return;
    }
    hint.textContent = text;
    hint.classList.remove('hidden');
  }

  /**
   * 用途：把伺服器送過來的兩層清單存起來，並把兩個下拉都畫好。
   *
   *   ⚠️ 伺服器拿不到 `quarters`（例如季度全部被排除）時要退回舊的一層
   *   清單，不可以令整個下拉變空——切不到主日等於整個介面用不了。
   * Args:
   *   data {Object} `apiListWeeks()` 的 `data`。
   *   defaultIsoDate {?string} 預設落點。
   * Returns:
   *   {void}
   */
  function populateWeekSelectors(data, defaultIsoDate) {
    var quarters = (data && data.quarters) || [];
    state.quarters = quarters;

    if (quarters.length === 0) {
      document.getElementById('quarterSelect').innerHTML = '';
      populateWeekSelect((data && data.weeks) || [], defaultIsoDate);
      return;
    }

    var qSel = document.getElementById('quarterSelect');
    qSel.innerHTML = '';
    quarters.forEach(function (q) {
      var o = el('option');
      o.value = q.quarterId;
      o.textContent = q.label + '（' + q.weeks.length + ' 個主日）';
      qSel.appendChild(o);
    });

    syncSelectorsTo(defaultIsoDate);
  }

  /**
   * 用途：在兩層清單裏找一個主日屬於哪一季。
   * Args:
   *   isoDate {?string} 主日日期。
   * Returns:
   *   {?string} 找不到回 null。
   */
  function quarterIdOfIsoDate(isoDate) {
    if (!isoDate) return null;
    var quarters = state.quarters || [];
    for (var i = 0; i < quarters.length; i++) {
      for (var j = 0; j < quarters[i].weeks.length; j++) {
        if (quarters[i].weeks[j].isoDate === isoDate) return quarters[i].quarterId;
      }
    }
    return null;
  }

  /**
   * 用途：把兩個下拉對準某一個主日。直接跳轉（例如由網址帶主日參數、或者
   *   程式碼直接呼叫 `loadWeek()`）之後就是靠這一個把季度下拉一併校正。
   *
   *   ⚠️ 這個函式**只改下拉的顯示**，不會觸發載入。切換主日一律走
   *   `loadWeek()`，兩件事分開才不會互相引發無限迴圈。
   * Args:
   *   isoDate {?string} 要對準的主日。
   * Returns:
   *   {void}
   */
  function syncSelectorsTo(isoDate) {
    var quarters = state.quarters || [];
    if (quarters.length === 0) return;

    var quarterId = quarterIdOfIsoDate(isoDate);
    if (quarterId === null) quarterId = quarters[0].quarterId;

    var qSel = document.getElementById('quarterSelect');
    if (qSel.value !== quarterId) qSel.value = quarterId;

    renderWeekOptionsForQuarter(quarterId, isoDate);
  }

  /**
   * 用途：畫出某一季的主日下拉選項，每一項帶狀態標記。
   * Args:
   *   quarterId {string} 季度 ID。
   *   selectedIsoDate {?string} 要選中的主日；不屬於這一季就選第一項。
   * Returns:
   *   {void}
   */
  function renderWeekOptionsForQuarter(quarterId, selectedIsoDate) {
    var group = null;
    (state.quarters || []).forEach(function (q) { if (q.quarterId === quarterId) group = q; });

    var sel = document.getElementById('weekSelect');
    sel.innerHTML = '';
    if (group === null) return;

    var hasSelected = false;
    group.weeks.forEach(function (w) {
      var o = el('option');
      o.value = w.isoDate;
      o.textContent = w.selectorLabel || w.label;
      if (w.isoDate === selectedIsoDate) { o.selected = true; hasSelected = true; }
      sel.appendChild(o);
    });
    if (!hasSelected && group.weeks.length > 0) sel.selectedIndex = 0;
  }

  /**
   * 用途：把兩層清單攤平成一條由早到遲的主日陣列，供上一個／下一個箭嘴
   *   跨季移動用。
   * Returns:
   *   {Object[]}
   */
  function flatWeeksInOrder() {
    var all = [];
    (state.quarters || []).forEach(function (q) {
      q.weeks.forEach(function (w) { all.push(w); });
    });
    all.sort(function (a, b) {
      if (a.isoDate < b.isoDate) return -1;
      if (a.isoDate > b.isoDate) return 1;
      return 0;
    });
    return all;
  }

  /**
   * 用途：上一個／下一個主日。到季度邊界時自動跨到上／下一季。
   * Args:
   *   step {number} `-1` 上一個、`+1` 下一個。
   * Returns:
   *   {void}
   */
  function stepWeek(step) {
    var all = flatWeeksInOrder();
    if (all.length === 0) return;

    var index = -1;
    for (var i = 0; i < all.length; i++) {
      if (all[i].isoDate === state.isoDate) { index = i; break; }
    }
    if (index === -1) return;

    var next = index + step;
    if (next < 0 || next >= all.length) {
      showMessage('info', step < 0 ? '已經是最早的一個主日。' : '已經是最後一個主日。');
      return;
    }
    var target = all[next].isoDate;
    confirmWeekChange(function () { loadWeek(target); }, function () { syncSelectorsTo(state.isoDate); });
  }

  /**
   * 用途：主日下拉一改，載入選中的那一週（有未儲存的改動先問一次）。
   * Args:
   *   isoDate {string} 下拉選中的主日。
   * Returns:
   *   {void}
   */
  function onWeekSelectChanged(isoDate) {
    confirmWeekChange(function () { loadWeek(isoDate); }, function () { syncSelectorsTo(state.isoDate); });
  }

  /**
   * 用途：季度下拉一改，就把主日下拉換成該季，並載入該季第一個主日
   *   （有未儲存的改動先問一次；取消就把兩個下拉改回目前這一週）。
   * Returns:
   *   {void}
   */
  function onQuarterChanged() {
    var quarterId = document.getElementById('quarterSelect').value;
    confirmWeekChange(function () {
      renderWeekOptionsForQuarter(quarterId, null);
      var sel = document.getElementById('weekSelect');
      if (sel.options.length > 0) loadWeek(sel.options[0].value);
    }, function () { syncSelectorsTo(state.isoDate); });
  }

  // =====================================================================
  // R-036：職事表未有資料的黃色橫幅與「補抓空白的事奉欄位」
  // =====================================================================

  /**
   * 用途：畫出（或收起）職事表未有資料的黃色橫幅。
   * Args:
   *   banner {?Object} `{show:boolean, text:string}`；沒有就當不顯示。
   * Returns:
   *   {void}
   */
  function renderRosterGapBanner(banner) {
    var bar = document.getElementById('rosterGapBar');
    if (!banner || banner.show !== true) {
      bar.classList.add('hidden');
      bar.textContent = '';
      return;
    }
    bar.textContent = banner.text || '';
    bar.classList.remove('hidden');
  }

  /**
   * 用途：把本季在職事表已經有、而週報仍然空白的事奉格補抓回來。
   *
   *   ⚠️ 職事表仍然找不到**不是**錯誤——伺服器會回 `ok`、`rosterFound`
   *   為 false 加一句說明，這裏用一般提示（不是紅色）顯示。
   * Returns:
   *   {void}
   */
  function backfillRoster() {
    if (!state.quarterId) {
      showMessage('error', '未知道目前是哪一季，請先揀一個主日。');
      return;
    }
    callServer('apiBackfillRoster', [state.quarterId], function (resp) {
      if (!resp.ok) { showMessage('error', resp.error.message); return; }
      var data = resp.data;
      showMessage(data.rosterFound === true ? 'success' : 'info', data.message);
      // 補抓之後事奉欄位與橫幅都可能變了，重新載入這一期。
      if (state.isoDate) loadWeek(state.isoDate, { keepMessage: true });
    }, { busyText: '補抓空白欄位中…' });
  }

  // =====================================================================
  // 初始化
  // =====================================================================

  function wireStaticEvents() {
    document.getElementById('weekSelect').addEventListener('change', function (e) { onWeekSelectChanged(e.target.value); });
    document.getElementById('quarterSelect').addEventListener('change', onQuarterChanged);
    document.getElementById('showArchivedCheck').addEventListener('change', onShowArchivedChanged);
    document.getElementById('prevWeekBtn').addEventListener('click', function () { stepWeek(-1); });
    document.getElementById('nextWeekBtn').addEventListener('click', function () { stepWeek(1); });
    document.getElementById('backfillRosterBtn').addEventListener('click', backfillRoster);
    document.getElementById('saveBtn').addEventListener('click', saveWeek);
    document.getElementById('reloadRosterBtn').addEventListener('click', reloadRosterOnly);
    document.getElementById('statMissing').addEventListener('click', function () {
      document.getElementById('missingPanel').classList.toggle('hidden');
    });
    // D-11：警告徽章與另外兩個看齊。
    document.getElementById('statWarnings').addEventListener('click', function () {
      document.getElementById('warningsPanel').classList.toggle('hidden');
    });
    document.getElementById('statConflicts').addEventListener('click', function () {
      document.getElementById('conflictPanel').classList.toggle('hidden');
    });

    document.getElementById('fetchFromRosterBtn').addEventListener('click', openFetchFromRosterDialog);
    document.getElementById('fetchCancelBtn').addEventListener('click', closeFetchDialog);
    document.getElementById('fetchConfirmBtn').addEventListener('click', confirmFetchFromRoster);
    document.getElementById('fetchSelectAllBtn').addEventListener('click', function () { setAllFetchCheckboxes(true); });
    document.getElementById('fetchSelectNoneBtn').addEventListener('click', function () { setAllFetchCheckboxes(false); });

    // ---- 發佈及匯出 ----
    document.getElementById('doPublishCheck').addEventListener('change', function () {
      applyPublishSubStates();
      savePublishPrefs();
    });
    document.getElementById('doSendCheck').addEventListener('change', function () {
      applyPublishSubStates();
      savePublishPrefs();
    });
    document.getElementById('publishPdfInput').addEventListener('change', onPublishPdfChosen);
    wireQuarterOpsEvents();
    document.getElementById('publishRunBtn').addEventListener('click', function () { runPublish(false); });
    document.getElementById('downloadWordBtn').addEventListener('click', downloadWord);
    // 階段 2：版本記錄（摺疊區塊打開時才向伺服器取）。
    document.getElementById('snapshotPanel').addEventListener('toggle', function () {
      if (isSnapshotPanelOpen() && state.isoDate && state.snapshotsLoadedFor !== state.isoDate) loadSnapshotPanel();
    });
    document.getElementById('resetWeekBtn').addEventListener('click', onResetWeekClicked);
    // 階段 3：講員表格。
    document.getElementById('speakerFormCreateBtn').addEventListener('click', onSpeakerFormCreateClicked);
    document.getElementById('speakerFormRefreshBtn').addEventListener('click', onSpeakerFormRefreshClicked);
    document.getElementById('speakerFormCopyBtn').addEventListener('click', onSpeakerFormCopyClicked);
    document.getElementById('confirmOkBtn').addEventListener('click', function () { settleConfirmDialog(true); });
    document.getElementById('confirmCancelBtn').addEventListener('click', function () { settleConfirmDialog(false); });
    document.addEventListener('keydown', onConfirmDialogKeydown);
    document.getElementById('publishConfirmCancelBtn').addEventListener('click', closePublishConfirm);
    document.getElementById('publishConfirmOkBtn').addEventListener('click', function () { runPublish(true); });
    // 勾了那一格才可以撳「確認發佈」——R-006／R-007 明文要求。
    document.getElementById('publishForcedCheck').addEventListener('change', function (e) {
      document.getElementById('publishConfirmOkBtn').disabled = !e.target.checked;
    });

    // ⚠️ R-011 起，四張清單改由內容表輸入，「新增一則…」那幾顆按鈕已經由
    // Index.html 移走，所以這裡不再綁事件。`addListItem()` 等函式保留，
    // 日後如果有某一張表要改回可編輯，接返上去即可。

    document.addEventListener('input', function (e) {
      var target = e.target;
      if (target && target.hasAttribute && target.hasAttribute('data-field')) {
        state.week[target.getAttribute('data-field')] = target.value;
        var changedField = target.getAttribute('data-field');
        if (changedField === 'FLOWER_THIS_WEEK' || changedField === 'FLOWER_NEXT_WEEK') {
          renderFlowerHints(state.flowerRoster);
        }
        schedulePreviewRefresh();
      }
    });
  }

  // =====================================================================
  // R-038：季度作業
  //
  // ⚠️ 每一個伺服器呼叫都經 callServer()，一個都不可以自己叫
  //    google.script.run——不寫失敗處理的後果是後端拋的錯全部人間蒸發
  //    （見 docs/已知bug類型.md 事故二十五）。callServer() 順帶處理忙碌
  //    鎖定：回應未返回之前重複撳，第二下不會發出去。
  //
  // ⚠️ 四個唯讀報告共用同一個可捲動面板，不用 alert()：內容動輒過百行，
  //    alert 會爆，而且爆的時候只見到頭幾行，看的人以為報告只有那麼多。
  // =====================================================================

  /**
   * 用途：摺疊／展開「季度作業」區塊。第一次展開才去拿面板資料——
   *   每次開介面都拿一次，是為一個一季用一次的區塊付每日的代價。
   * Returns:
   *   {void}
   */
  function toggleQuarterOps() {
    var body = document.getElementById('quarterOpsBody');
    var toggle = document.getElementById('quarterOpsToggle');
    var open = body.classList.contains('hidden');

    body.classList.toggle('hidden', !open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.getElementById('quarterOpsCaret').textContent = open ? '▾' : '▸';

    if (open) refreshQuarterOpsPanel();
  }

  /**
   * 用途：拿「季度作業」區塊的現況（季度、DRY_RUN、內容表有沒有建立）。
   * Returns:
   *   {void}
   */
  function refreshQuarterOpsPanel() {
    callServer('apiGetQuarterOpsPanel', [state.quarterId || ''], function (resp) {
      if (!resp.ok) { showQuarterOpsMessage('error', resp.error.message); return; }
      renderQuarterOpsPanel(resp.data);
    }, { busy: 'preview' });
  }

  /**
   * 用途：畫出季度、DRY_RUN 標記與內容表連結。
   * Args:
   *   data {Object} apiGetQuarterOpsPanel 的 data。
   * Returns:
   *   {void}
   */
  function renderQuarterOpsPanel(data) {
    state.quarterOps = data;

    document.getElementById('quarterOpsQuarter').textContent =
      data.quarterId ? ('（' + data.quarterId + '）') : '（未能決定季度）';

    // ⚠️ DRY_RUN 一定要顯示喺「寄出內容表連結」旁邊。撳完見到「已寄 12 封」
    //    而其實一封都冇寄出，是這個系統最容易踩的一種誤會。
    var dryRunEl = document.getElementById('opInviteDryRun');
    dryRunEl.textContent = data.dryRun
      ? 'DRY_RUN=TRUE（不會真的寄出）'
      : 'DRY_RUN=FALSE（會真的寄出）';
    dryRunEl.className = 'quarter-ops-dryrun ' + (data.dryRun ? 'is-dryrun' : 'is-live');

    var linkRow = document.getElementById('opContentSheetLinkRow');
    if (data.contentSheet && data.contentSheet.exists && data.contentSheet.fileUrl) {
      linkRow.classList.remove('hidden');
      document.getElementById('opContentSheetLink').href = data.contentSheet.fileUrl;
      var meta = [];
      if (data.contentSheet.inviteSentAt) meta.push('連結已寄出：' + data.contentSheet.inviteSentAt);
      if (data.contentSheet.lastImportedAt) meta.push('最後匯入：' + data.contentSheet.lastImportedAt);
      document.getElementById('opContentSheetMeta').textContent = meta.join('　｜　');
    } else {
      linkRow.classList.add('hidden');
    }
  }

  /**
   * 用途：「季度作業」區塊自己的訊息列。
   *
   *   ⚠️ 刻意不用頁頂那一條：這個區塊在頁面很下面，訊息寫在頁頂等於
   *   沒有寫——使用者撳完只會見到甚麼都沒有發生，然後再撳一次。
   * Args:
   *   kind {string} `'error'`／`'info'`／`'success'`。
   *   text {string}
   * Returns:
   *   {void}
   */
  function showQuarterOpsMessage(kind, text) {
    var box = document.getElementById('quarterOpsMessage');
    box.className = 'quarter-ops-message is-' + kind;
    box.textContent = text;
    box.classList.remove('hidden');
  }

  function hideQuarterOpsMessage() {
    document.getElementById('quarterOpsMessage').classList.add('hidden');
  }

  /**
   * 用途：把一份唯讀報告顯示在可捲動的結果面板。
   * Args:
   *   title {string} 報告名稱。
   *   lines {string[]} 報告內容，一行一個元素。
   * Returns:
   *   {void}
   */
  function showQuarterOpsReport(title, lines) {
    var rows = lines || [];
    document.getElementById('quarterOpsReportTitle').textContent = title;
    document.getElementById('quarterOpsReportCount').textContent = '共 ' + rows.length + ' 行';
    document.getElementById('quarterOpsReportBody').textContent = rows.join('\n');
    document.getElementById('quarterOpsReport').classList.remove('hidden');
  }

  function hideQuarterOpsReport() {
    document.getElementById('quarterOpsReport').classList.add('hidden');
  }

  /**
   * 用途：目前「季度作業」要處理哪一季。
   *
   *   ⚠️ 以伺服器算出來的那一個為準（`quarterOpsPanelData_()`），
   *   前端不自己猜——兩處各猜一次，介面顯示的季度就會跟實際做的那一季
   *   不同，而那是最不可能有人發現的一種錯。
   * Returns:
   *   {string} 拿不到就回空字串。
   */
  function currentOpsQuarterId() {
    if (state.quarterOps && state.quarterOps.quarterId) return state.quarterOps.quarterId;
    return state.quarterId || '';
  }

  /**
   * 用途：有副作用那四粒的共用流程——先叫預覽 API，把「將會發生什麼」
   *   顯示出來，使用者確認之後才叫執行 API。
   *
   *   ⚠️ 預覽與執行走伺服器端同一組底層函式，所以預覽講的跟實際做的
   *   一定是同一件事。
   *
   *   按「取消」顯示 CANCELLED_NOTHING_WRITTEN_MESSAGE（與重設、還原同一句，G15）。
   * Args:
   *   opts {{previewApi:string, runApi:string, args:Array, busyText:string,
   *          confirmSuffix:string, onDone:(function(Object):void|undefined)}}
   * Returns:
   *   {void}
   * Raises:
   *   （無）伺服器錯誤經「季度作業」區塊的訊息列顯示。
   */
  function runQuarterOp(opts) {
    if (state.inFlight > 0) return;
    hideQuarterOpsMessage();
    hideQuarterOpsReport();

    callServer(opts.previewApi, opts.args, function (resp) {
      if (!resp.ok) { showQuarterOpsMessage('error', resp.error.message); return; }
      var data = resp.data;
      if (!data.ok) {
        // ⚠️ 「做不到」與「做了但沒有效果」要分得出。底層回的 message
        //    已經講明下一步要撳哪一粒，原句顯示，不要自己再包裝。
        showQuarterOpsMessage('error', data.message);
        if (data.lines && data.lines.length > 0) showQuarterOpsReport(data.title, data.lines);
        return;
      }

      var confirmLines = (data.lines || []).concat(['', opts.confirmSuffix]);
      openConfirmDialog(data.title || '季度作業', confirmLines, function (accepted) {
        if (!accepted) {
          showQuarterOpsMessage('info', CANCELLED_NOTHING_WRITTEN_MESSAGE);
          return;
        }

        callServer(opts.runApi, opts.args, function (runResp) {
          if (!runResp.ok) { showQuarterOpsMessage('error', runResp.error.message); return; }
          if (!runResp.data.ok) { showQuarterOpsMessage('error', runResp.data.message); return; }
          showQuarterOpsReport(runResp.data.title, runResp.data.lines);
          showQuarterOpsMessage('success', runResp.data.title + '：完成。');
          refreshQuarterOpsPanel();
          if (opts.onDone) opts.onDone(runResp.data);
        }, { busyText: opts.busyText });
      });
    }, { busyText: '計算中…' });
  }

  /**
   * 用途：唯讀那四粒的共用流程——叫一次 API，把回傳的行顯示在面板。
   *   **不寫任何東西。**
   * Args:
   *   api {string} api* 函式名稱。
   *   args {Array}
   *   busyText {string}
   * Returns:
   *   {void}
   */
  function runQuarterReport(api, args, busyText) {
    if (state.inFlight > 0) return;
    hideQuarterOpsMessage();

    callServer(api, args, function (resp) {
      if (!resp.ok) { showQuarterOpsMessage('error', resp.error.message); return; }
      if (!resp.data.ok) {
        showQuarterOpsMessage('error', resp.data.message);
        hideQuarterOpsReport();
        return;
      }
      showQuarterOpsReport(resp.data.title, resp.data.lines);
    }, { busyText: busyText });
  }

  function wireQuarterOpsEvents() {
    document.getElementById('quarterOpsToggle').addEventListener('click', toggleQuarterOps);
    document.getElementById('quarterOpsReportClose').addEventListener('click', hideQuarterOpsReport);

    document.getElementById('opCreateWeeksBtn').addEventListener('click', function () {
      runQuarterOp({
        previewApi: 'apiPreviewCreateWeeks', runApi: 'apiRunCreateWeeks',
        args: [currentOpsQuarterId()], busyText: '建立中…',
        confirmSuffix: '確定要建立嗎？（已經存在的主日一格都不會改）'
      });
    });

    document.getElementById('opContentSheetBtn').addEventListener('click', function () {
      runQuarterOp({
        previewApi: 'apiPreviewContentSheetBuild', runApi: 'apiRunContentSheetBuild',
        args: [currentOpsQuarterId()], busyText: '處理中…',
        confirmSuffix: '確定要繼續嗎？'
      });
    });

    document.getElementById('opInviteBtn').addEventListener('click', function () {
      var dryRun = state.quarterOps ? state.quarterOps.dryRun : true;
      runQuarterOp({
        previewApi: 'apiPreviewContentSheetInvite', runApi: 'apiRunContentSheetInvite',
        args: [currentOpsQuarterId()], busyText: '寄出中…',
        // ⚠️ 確認那一句要**再講一次** DRY_RUN，因為這是唯一一粒會真的
        //    寄信出街的按鈕。旁邊那個標記看漏了，這一句還攔得住。
        confirmSuffix: dryRun
          ? '目前 DRY_RUN=TRUE，撳「確定」不會真的寄出任何郵件，只會寫 SendLog。確定要繼續嗎？'
          : '⚠️ 目前 DRY_RUN=FALSE，撳「確定」會真的把郵件寄出去。確定要寄嗎？'
      });
    });

    document.getElementById('opImportQuarterBtn').addEventListener('click', function () {
      runQuarterOp({
        previewApi: 'apiPreviewQuarterContentImport', runApi: 'apiRunQuarterContentImport',
        args: [currentOpsQuarterId()], busyText: '匯入中…',
        confirmSuffix: '確定要把整季匯入嗎？',
        // 匯入會改到目前這一個主日的內容，所以重新載入一次。
        onDone: function () { if (state.isoDate) loadWeek(state.isoDate); }
      });
    });

    document.getElementById('opMissingBtn').addEventListener('click', function () {
      runQuarterReport('apiQuarterMissingReport', [currentOpsQuarterId()], '整理中…');
    });
    document.getElementById('opRosterDiffBtn').addEventListener('click', function () {
      runQuarterReport('apiRosterDiffReport', [state.isoDate || ''], '比對中…');
    });
    document.getElementById('opGoLiveBtn').addEventListener('click', function () {
      runQuarterReport('apiGoLiveReport', [], '檢查中…');
    });
    document.getElementById('opRevisionsBtn').addEventListener('click', function () {
      runQuarterReport('apiPublishRevisionsReport', [], '讀取中…');
    });
  }

  /**
   * 用途：捕捉前端沒有被任何 try/catch 接住的例外（一般執行錯誤與未處理
   *   的 Promise rejection），顯示紅色橫幅並回報 ErrorLog——理由同
   *   callServer() 的失敗處理：Apps Script 執行紀錄看不到前端發生了什麼事，不記
   *   下來就沒有人知道。
   * Returns:
   *   {void}
   */
  function wireGlobalErrorHandlers() {
    window.onerror = function (message, source, lineno, colno, error) {
      var text = '前端發生未預期的錯誤：' + message;
      showMessage('error', text);
      reportClientError_(
        text,
        error && error.stack ? String(error.stack).split('\n').slice(0, 5).join('\n') : (source + ':' + lineno + ':' + colno),
        'window.onerror'
      );
      return false;
    };

    window.onunhandledrejection = function (event) {
      var reason = event && event.reason;
      var text = '前端發生未處理的錯誤：' + (reason && reason.message ? reason.message : String(reason));
      showMessage('error', text);
      reportClientError_(
        text,
        reason && reason.stack ? String(reason.stack).split('\n').slice(0, 5).join('\n') : '',
        'window.onunhandledrejection'
      );
    };
  }

  function init() {
    wireGlobalErrorHandlers();
    wireStaticEvents();
    document.getElementById('missingPanel').classList.add('hidden');
    document.getElementById('conflictPanel').classList.add('hidden');
    applyBusyState();
    loadPublishPanel();
    loadSpeakerFormStatus();
    callServer('apiListWeeks', [state.showArchived], onWeeksLoaded, { busyText: '載入中…' });
  }

  function onWeeksLoaded(resp) {
    if (!resp.ok) { showMessage('error', resp.error.message); return; }
    renderQuarterEmptyHint(resp.data);
    populateWeekSelectors(resp.data, resp.data.defaultIsoDate);
    if (resp.data.defaultIsoDate) {
      loadWeek(resp.data.defaultIsoDate);
    } else if (resp.data.emptyHint) {
      // ⚠️ 「全部季度都封存咗」與「一條資料都沒有」是兩件事，
      //    訊息要分得出——前者撳一下勾選格就見得返。
      showMessage('info', resp.data.emptyHint);
    } else {
      showMessage('error', '目前沒有任何主日資料。請先在試算表用選單「建立本季空白週報」建立骨架。');
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
